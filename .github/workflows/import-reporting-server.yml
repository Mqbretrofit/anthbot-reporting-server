# Standalone ANTHBOT Reporting Server import
name: Import ANTHBOT Reporting Server

on:
  push:
    paths:
      - ".github/workflows/import-reporting-server.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout standalone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current reporting server source
        run: |
          git clone --depth 1 --branch test/no-go-path-crossing-diagnostics \
            https://github.com/Mqbretrofit/ha-anthbot-map-v2.git /tmp/anthbot-map
          rm -rf anthbot_reporting
          cp -a /tmp/anthbot-map/server/anthbot_reporting ./anthbot_reporting

      - name: Point app metadata at standalone repository
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("anthbot_reporting/config.yaml")
          text = path.read_text(encoding="utf-8")
          text = text.replace('version: "1.0.0-test.16"', 'version: "1.0.0-test.17"')
          lines = []
          for line in text.splitlines():
              if line.startswith("url:"):
                  line = "url: https://github.com/Mqbretrofit/anthbot-reporting-server/tree/main/anthbot_reporting"
              lines.append(line)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Validate reporting server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r anthbot_reporting/requirements.txt httpx
          python -m unittest discover -s anthbot_reporting/tests -p 'test_*.py'

      - name: Commit imported server
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anthbot_reporting
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import ANTHBOT Reporting Server test.17"
          git push origin HEAD:main
