name: Apply public site mobile navigation patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-public-site-mobile-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch public site
        shell: python
        run: |
          from pathlib import Path
          p = Path('anthbot_reporting/public_site.html')
          s = p.read_text(encoding='utf-8')
          old_css = '@media(max-width:760px){.links{display:none}.hero{padding-top:54px}'
          new_css = '''@media(max-width:760px){
          .nav{position:sticky;top:0}
          .navin{height:auto;min-height:64px;padding-top:9px;padding-bottom:9px;display:grid;grid-template-columns:1fr auto;gap:9px 12px}
          .brand{min-width:0}.brand span:last-child{white-space:nowrap}
          .lang-wrap{justify-self:end}
          .links{display:flex;grid-column:1/-1;order:3;width:100%;gap:7px;flex-wrap:nowrap;overflow-x:auto;padding:3px 0 5px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
          .links::-webkit-scrollbar{display:none}
          .links a{flex:0 0 auto;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(20,29,39,.9);font-size:12px;font-weight:750;color:#dce6ec}
          .links a.store-link{background:linear-gradient(180deg,#34c759,#248a46);border-color:transparent;color:#fff;box-shadow:0 7px 18px rgba(36,138,70,.28)}
          .links a.community-link{border-color:rgba(99,184,255,.42);color:#d9efff}
          .links a.hungary-link{border-color:rgba(255,255,255,.24);color:#fff}
          .hero{padding-top:32px}'''
          if old_css not in s:
              raise SystemExit('mobile CSS anchor not found')
          s = s.replace(old_css, new_css, 1)
          old_nav = '<div class="links"><a href="#anthbot-map">ANTHBOT Map</a><a href="#features">Features</a><a href="#models">Models</a><a href="/store">Voice Store</a><a href="#support">Support</a><a href="/terms">Terms</a><a href="/privacy">Privacy</a></div>'
          new_nav = '<div class="links"><a href="#anthbot-map">ANTHBOT Map</a><a href="#features">Features</a><a href="#models">Models</a><a class="store-link" href="/store">🔊 Voice Store</a><a class="community-link" href="https://github.com/Mqbretrofit/ha-anthbot-map-v2/discussions" target="_blank" rel="noopener">💬 GitHub Discussions</a><a class="hungary-link" href="https://anthbothungary.hu/" target="_blank" rel="noopener sponsored">🇭🇺 ANTHBOT Hungary</a><a href="#support">Support</a><a href="/terms">Terms</a><a href="/privacy">Privacy</a></div>'
          if old_nav not in s:
              raise SystemExit('navigation anchor not found')
          s = s.replace(old_nav, new_nav, 1)
          old_cta = '<div class="cta"><a class="btn primary" href="https://github.com/Mqbretrofit/ha-anthbot-map-v2" target="_blank" rel="noopener">View ANTHBOT Map on GitHub</a><a class="btn" href="/store">Community Voice Pack Store</a></div>'
          new_cta = '<div class="cta"><a class="btn primary" href="/store">🔊 Community Voice Pack Store</a><a class="btn" href="https://github.com/Mqbretrofit/ha-anthbot-map-v2" target="_blank" rel="noopener">View ANTHBOT Map on GitHub</a><a class="btn" href="https://github.com/Mqbretrofit/ha-anthbot-map-v2/discussions" target="_blank" rel="noopener">💬 Community Discussions</a><a class="btn" href="https://anthbothungary.hu/" target="_blank" rel="noopener sponsored">🇭🇺 ANTHBOT Hungary</a></div>'
          if old_cta not in s:
              raise SystemExit('hero CTA anchor not found')
          s = s.replace(old_cta, new_cta, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anthbot_reporting/public_site.html
          git diff --cached --check
          git commit -m "Improve mobile navigation and community links"
          git push
