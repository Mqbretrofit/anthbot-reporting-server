<h2>6. 您的權利</h2><p>依 GDPR 與適用例外，您可要求存取、更正、刪除、限制處理與資料可攜，並可反對基於合法利益的處理。基於同意的處理可隨時撤回同意。我們會在無不當延遲下回覆，通常於一個月內；GDPR 允許時可延長。必要時可要求合理的身分驗證。</p>
<h2>7. 必要或可選資料；自動化決策</h2><p>完成購買或所要求服務所需的付款與聯絡資訊屬於合約/合約前必要資料；若不提供，交易或服務可能無法完成。可選 ANTHBOT 回報/診斷不是使用核心整合的前提。Reporting Server 不作出完全基於自動化處理且產生法律或類似重大影響的決策。Stripe 可依其隱私資訊進行自己的詐欺/風險檢查。</p>
<h2>8. 投訴與變更</h2><p>您可先透過上方聯絡方式或下方表單聯絡控制者。您也可向匈牙利監管機關提出投訴：<strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>，地址：1055 Budapest, Falk Miksa utca 9-11；郵寄地址：1363 Budapest, Pf. 9.；電子郵件：ugyfelszolgalat@naih.hu；電話：+36 (1) 391-1400。</p><p>當服務、供應商或法律要求變更時，本說明可能更新。最新版本與更新日期會發布於本頁。</p>`,
tr:`
<h2>1. Veri sorumlusu ve kapsam</h2><p>Bu web sitesinin, ANTHBOT Community ses mağazasının ve ANTHBOT Reporting Server'ın veri sorumlusu yukarıda belirtilen işletmecidir. Bu bildirim satın alımlar, lisanslar ve haklar, özel ses talepleri, destek, herkese açık web sitesi ve isteğe bağlı ANTHBOT Map raporlama/teşhis işlemlerini kapsar.</p>
<h2>2. Kişisel veriler ve kaynaklar</h2><p><strong>Satın alımlar:</strong> Stripe Checkout/oturum ve ödeme kimlikleri, Stripe müşteri kimliği, Checkout'ta verilen email, seçilen ses paketi, tutar, para birimi, ödeme/iade durumu, zaman damgaları ve opak ANTHBOT Map istemci kimliği saklanabilir. Yerel Map bearer tokenının kendisi saklanmaz.</p><p><strong>Özel ses ve destek:</strong> talep edilen dil, ses stili, robot modeli, iletişim bilgileri, notlar, site dili ve yazışmalar.</p><p><strong>İsteğe bağlı raporlama:</strong> yalnızca etkinleştirildiğinde/gönderildiğinde: rastgele kurulum UUID'si, entegrasyon ve Home Assistant sürümleri, sağlanırsa ülke, cihaz/model sayıları, olay zamanları ve teşhis içeriği. Kimlik bilgilerine benzeyen alan adları reddedilir.</p><p><strong>Web sitesi:</strong> seçilen dil tarayıcıda yerel olarak saklanabilir. Uygulama veritabanı ziyaretçi IP adreslerini bilerek saklamaz; barındırma, ağ veya güvenlik sağlayıcıları normal bağlantı meta verilerini geçici olarak işleyebilir.</p><p>Veriler sizden, ANTHBOT Map kurulumunuzdan ve ödeme sırasında Stripe'dan gelir.</p>
<h2>3. Amaçlar ve hukuki dayanaklar</h2><ul><li>Satın alınan dijital ürünlerin, lisansların, indirmelerin ve desteğin sağlanması: GDPR md. 6(1)(b).</li><li>Muhasebe, vergi, hukuk ve düzenleyici yükümlülükler: md. 6(1)(c).</li><li>Güvenlik, dolandırıcılık/kötüye kullanım önleme ve sistemlerin veya hukuki taleplerin korunması: md. 6(1)(f), gerekli ölçüyle sınırlı meşru menfaat.</li><li>Rıza istendiğinde isteğe bağlı raporlama/teşhis: md. 6(1)(a). Rıza gelecekteki işlemler için her zaman geri çekilebilir.</li></ul>
<h2>4. Ödemeler, alıcılar ve uluslararası aktarımlar</h2><p>Ödemeler Stripe tarafından işlenir. Reporting Server tam kart bilgilerini almaz veya saklamaz. AEA'da Stripe Payments Europe Limited faaliyete göre veri işleyen ve/veya bağımsız veri sorumlusu olabilir; ödeme, dolandırıcılık, risk ve uyum işlevleri buna dahildir. Stripe ve gerekli bağlı şirketler/hizmet sağlayıcılar verileri AEA dışında uygun güvencelerle işleyebilir; buna yeterlilik kararları, uygun olduğunda EU-US Data Privacy Framework ve AB Standart Sözleşme Maddeleri dahildir.</p><p>Diğer alıcılar yalnızca gerekli altyapı, barındırma, ağ ve güvenlik sağlayıcıları, gerektiğinde profesyonel danışmanlar ve kanunen zorunlu olduğunda kamu makamlarıdır. Kişisel veriler reklam amacıyla satılmaz.</p>
<h2>5. Saklama</h2><ul><li>Geçici Map eşleştirme kodları 7 gün sonra sona erer; yerel bearer token saklanmaz.</li><li>Sipariş ve hak kayıtları, satın alınan dijital hakkın sağlanması ve geçerli muhasebe, vergi, chargeback, dolandırıcılık önleme ve hukuki talep süreleri için gerekli olduğu kadar saklanır. Temel hak kimlikleri hak aktif olduğu sürece tutulabilir.</li><li>Özel ses/destek talepleri sonuçlanana ve makul takip tamamlanana kadar saklanır; artık gerekli olmadığında silinir veya anonimleştirilir.</li><li>İsteğe bağlı telemetri/teşhis yalnızca onaylanan geliştirme, güvenlik veya inceleme amaçları için gerektiği kadar tutulur ve başka bir hukuki dayanak gerektirmiyorsa geçerli talep üzerine silinebilir.</li><li>Veri koruma hakkı talepleri, talebin işlenmesi ve uyumun kanıtlanması için gerekli olduğu kadar saklanabilir.</li></ul>
<h2>6. Haklarınız</h2><p>GDPR ve uygulanabilir istisnalara göre erişim, düzeltme, silme, kısıtlama ve taşınabilirlik talep edebilir; meşru menfaate dayalı işlemeye itiraz edebilirsiniz. Rıza her zaman geri çekilebilir. Taleplere gereksiz gecikme olmadan, normalde bir ay içinde cevap veririz; GDPR'ın izin verdiği uzatmalar uygulanabilir. Gerektiğinde makul kimlik doğrulaması istenebilir.</p>
<h2>7. Zorunlu veya isteğe bağlı veriler; otomatik kararlar</h2><p>Satın alma veya talep edilen hizmet için gerekli ödeme/iletişim bilgileri sözleşmesel/sözleşme öncesidir; bunlar olmadan işlem veya hizmet tamamlanamayabilir. İsteğe bağlı ANTHBOT raporlama/teşhis çekirdek entegrasyon için zorunlu değildir. Reporting Server yalnızca otomatik işlemeye dayalı ve hukuki ya da benzer derecede önemli etki doğuran karar vermez. Stripe kendi dolandırıcılık/risk kontrollerini yapabilir.</p>
<h2>8. Şikâyetler ve değişiklikler</h2><p>Önce yukarıdaki iletişim bilgileri veya aşağıdaki form üzerinden veri sorumlusuyla iletişime geçebilirsiniz. Ayrıca Macar denetim makamına şikâyette bulunabilirsiniz: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; posta: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; telefon: +36 (1) 391-1400.</p><p>Hizmet, sağlayıcılar veya hukuki gereklilikler değişirse bu bildirim güncellenebilir. Güncel sürüm ve tarih bu sayfada yayımlanır.</p>`,
th:`
<h2>1. ผู้ควบคุมและขอบเขต</h2><p>ผู้ควบคุมข้อมูลของเว็บไซต์นี้ ร้านเสียง ANTHBOT Community และ ANTHBOT Reporting Server คือผู้ดำเนินการที่ระบุไว้ด้านบน ประกาศนี้ครอบคลุมการซื้อ ใบอนุญาตและสิทธิ์ คำขอเสียงแบบกำหนดเอง การสนับสนุน เว็บไซต์สาธารณะ และการรายงาน/การวินิจฉัย ANTHBOT Map แบบเลือกใช้</p>
<h2>2. ข้อมูลส่วนบุคคลและแหล่งที่มา</h2><p><strong>การซื้อ:</strong> เราอาจเก็บตัวระบุ Stripe Checkout/เซสชันและการชำระเงิน ตัวระบุลูกค้า Stripe อีเมลที่ให้ใน Checkout แพ็กเสียงที่เลือก จำนวนเงิน สกุลเงิน สถานะการชำระเงิน/คืนเงิน เวลา และตัวระบุไคลเอนต์ ANTHBOT Map แบบไม่เปิดเผย ตัว bearer token ของ Map ในเครื่องจะไม่ถูกเก็บ</p><p><strong>เสียงกำหนดเองและการสนับสนุน:</strong> ภาษาที่ขอ รูปแบบเสียง รุ่นหุ่นยนต์ ข้อมูลติดต่อ หมายเหตุ ภาษาของเว็บไซต์ และการติดต่อสื่อสาร</p><p><strong>การรายงานแบบเลือกใช้:</strong> เฉพาะเมื่อเปิดใช้/ส่ง: UUID การติดตั้งแบบสุ่ม เวอร์ชัน integration และ Home Assistant ประเทศหากให้ไว้ จำนวนอุปกรณ์/รุ่น เวลาเหตุการณ์ และเนื้อหาการวินิจฉัย ระบบจะปฏิเสธฟิลด์ที่มีชื่อคล้ายข้อมูลรับรอง</p><p><strong>เว็บไซต์:</strong> ภาษาที่เลือกอาจถูกบันทึกไว้ในเบราว์เซอร์ ฐานข้อมูลแอปไม่ตั้งใจเก็บ IP ของผู้เยี่ยมชม แต่ผู้ให้บริการโฮสติ้ง เครือข่าย หรือความปลอดภัยอาจประมวลผลข้อมูลเมตาการเชื่อมต่อทั่วไปชั่วคราว</p><p>ข้อมูลมาจากคุณ การติดตั้ง ANTHBOT Map ของคุณ และ Stripe เมื่อมีการชำระเงิน</p>
<h2>3. วัตถุประสงค์และฐานทางกฎหมาย</h2><ul><li>การให้ผลิตภัณฑ์ดิจิทัลที่ซื้อ ใบอนุญาต ดาวน์โหลด และการสนับสนุน: GDPR มาตรา 6(1)(b)</li><li>หน้าที่ด้านบัญชี ภาษี กฎหมาย และข้อกำกับ: มาตรา 6(1)(c)</li><li>ความปลอดภัย การป้องกันการฉ้อโกง/การใช้ผิดวัตถุประสงค์ และการปกป้องระบบหรือสิทธิเรียกร้อง: มาตรา 6(1)(f) ผลประโยชน์โดยชอบด้วยกฎหมายในขอบเขตที่จำเป็น</li><li>การรายงาน/วินิจฉัยแบบเลือกใช้เมื่อขอความยินยอม: มาตรา 6(1)(a) สามารถถอนความยินยอมสำหรับอนาคตได้ตลอดเวลา</li></ul>
<h2>4. การชำระเงิน ผู้รับ และการโอนระหว่างประเทศ</h2><p>Stripe เป็นผู้ประมวลผลการชำระเงิน Reporting Server ไม่รับหรือเก็บข้อมูลบัตรแบบเต็ม ใน EEA Stripe Payments Europe Limited อาจทำหน้าที่เป็นผู้ประมวลผลและ/หรือผู้ควบคุมอิสระตามกิจกรรม รวมถึงการชำระเงิน การฉ้อโกง ความเสี่ยง และการปฏิบัติตามข้อกำหนด Stripe และบริษัทในเครือ/ผู้ให้บริการที่จำเป็นอาจประมวลผลข้อมูลนอก EEA โดยใช้มาตรการคุ้มครองที่เหมาะสม เช่น การตัดสินความเพียงพอ EU-US Data Privacy Framework เมื่อใช้ได้ และข้อสัญญามาตรฐานของสหภาพยุโรป</p><p>ผู้รับอื่นจำกัดเฉพาะผู้ให้บริการโครงสร้างพื้นฐาน โฮสติ้ง เครือข่าย และความปลอดภัยที่จำเป็น ที่ปรึกษาเมื่อจำเป็น และหน่วยงานรัฐเมื่อกฎหมายกำหนด เราไม่ขายข้อมูลส่วนบุคคลเพื่อโฆษณา</p>
<h2>5. ระยะเวลาจัดเก็บ</h2><ul><li>รหัสจับคู่ Map ชั่วคราวหมดอายุหลัง 7 วัน; bearer token ในเครื่องไม่ถูกเก็บ</li><li>ข้อมูลคำสั่งซื้อและสิทธิ์จะถูกเก็บเท่าที่จำเป็นเพื่อให้สิทธิ์ดิจิทัลที่ซื้อ และตามช่วงเวลาบัญชี ภาษี chargeback ป้องกันการฉ้อโกง และข้อเรียกร้องทางกฎหมายที่ใช้บังคับ ตัวระบุสิทธิ์หลักอาจเก็บไว้ตราบเท่าที่สิทธิ์ยังใช้งานอยู่</li><li>คำขอเสียง/การสนับสนุนจะเก็บจนดำเนินการเสร็จและติดตามอย่างสมเหตุสมผล จากนั้นจะลบหรือทำให้ไม่ระบุตัวตนเมื่อไม่จำเป็นอีกต่อไป</li><li>เทเลเมทรี/การวินิจฉัยแบบเลือกใช้จะเก็บเฉพาะเท่าที่จำเป็นสำหรับวัตถุประสงค์การพัฒนา ความปลอดภัย หรือการตรวจสอบที่ยินยอม และอาจลบตามคำขอที่ถูกต้องหากไม่มีฐานกฎหมายอื่นให้เก็บต่อ</li><li>คำขอใช้สิทธิอาจเก็บเพื่อดำเนินการและแสดงการปฏิบัติตามข้อกำหนด</li></ul>
<h2>6. สิทธิของคุณ</h2><p>ภายใต้ GDPR และข้อยกเว้นที่ใช้บังคับ คุณสามารถขอเข้าถึง แก้ไข ลบ จำกัดการประมวลผล โอนย้ายข้อมูล และคัดค้านการประมวลผลที่อาศัยผลประโยชน์โดยชอบด้วยกฎหมายได้ สามารถถอนความยินยอมได้ตลอดเวลา เราจะตอบโดยไม่ล่าช้าเกินควร โดยปกติภายในหนึ่งเดือน และอาจขยายตามที่ GDPR อนุญาต อาจต้องมีการยืนยันตัวตนอย่างสมเหตุสมผล</p>
<h2>7. ข้อมูลที่จำเป็นหรือเลือกได้; การตัดสินใจอัตโนมัติ</h2><p>ข้อมูลการชำระเงิน/ติดต่อที่จำเป็นสำหรับการซื้อหรือบริการเป็นข้อมูลตามสัญญา/ก่อนสัญญา หากไม่มีอาจไม่สามารถทำธุรกรรมหรือให้บริการได้ การรายงาน/วินิจฉัย ANTHBOT แบบเลือกใช้ไม่จำเป็นต่อฟังก์ชันหลัก Reporting Server ไม่ตัดสินใจโดยอาศัยการประมวลผลอัตโนมัติเพียงอย่างเดียวที่ก่อผลทางกฎหมายหรือผลสำคัญใกล้เคียง Stripe อาจทำการตรวจสอบการฉ้อโกง/ความเสี่ยงของตนเอง</p>
<h2>8. การร้องเรียนและการเปลี่ยนแปลง</h2><p>คุณสามารถติดต่อผู้ควบคุมผ่านข้อมูลด้านบนหรือแบบฟอร์มด้านล่างก่อน และสามารถร้องเรียนต่อหน่วยงานฮังการี: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; ที่อยู่ไปรษณีย์: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; โทรศัพท์: +36 (1) 391-1400.</p><p>ประกาศนี้อาจอัปเดตเมื่อบริการ ผู้ให้บริการ หรือข้อกำหนดทางกฎหมายเปลี่ยนแปลง เวอร์ชันและวันที่ล่าสุดจะแสดงบนหน้านี้</p>`,
vi:`
<h2>1. Bên kiểm soát và phạm vi</h2><p>Bên kiểm soát dữ liệu cho trang web này, cửa hàng giọng nói ANTHBOT Community và ANTHBOT Reporting Server là đơn vị vận hành được nêu ở trên. Thông báo này áp dụng cho mua hàng, giấy phép và quyền sử dụng, yêu cầu giọng tùy chỉnh, hỗ trợ, trang công khai và báo cáo/chẩn đoán ANTHBOT Map tùy chọn.</p>
<h2>2. Dữ liệu cá nhân và nguồn</h2><p><strong>Mua hàng:</strong> chúng tôi có thể lưu mã Stripe Checkout/phiên và thanh toán, mã khách hàng Stripe, email cung cấp trong Checkout, gói giọng đã chọn, số tiền, tiền tệ, trạng thái thanh toán/hoàn tiền, thời gian và mã khách ANTHBOT Map dạng ẩn. Bearer token Map cục bộ không được lưu.</p><p><strong>Giọng tùy chỉnh và hỗ trợ:</strong> ngôn ngữ yêu cầu, phong cách giọng, mẫu robot, thông tin liên hệ, ghi chú, ngôn ngữ trang và trao đổi.</p><p><strong>Báo cáo tùy chọn:</strong> chỉ khi bật/gửi: UUID cài đặt ngẫu nhiên, phiên bản integration và Home Assistant, quốc gia nếu cung cấp, số thiết bị/mẫu, thời gian sự kiện và nội dung chẩn đoán. Các trường có tên giống thông tin xác thực sẽ bị từ chối.</p><p><strong>Trang web:</strong> ngôn ngữ đã chọn có thể được lưu cục bộ trong trình duyệt. Cơ sở dữ liệu ứng dụng không chủ ý lưu IP khách truy cập; nhà cung cấp hosting, mạng hoặc bảo mật có thể xử lý tạm thời siêu dữ liệu kết nối thông thường.</p><p>Dữ liệu đến từ bạn, cài đặt ANTHBOT Map của bạn và Stripe khi có thanh toán.</p>
<h2>3. Mục đích và căn cứ pháp lý</h2><ul><li>Cung cấp sản phẩm số đã mua, giấy phép, tải xuống và hỗ trợ: GDPR Điều 6(1)(b).</li><li>Nghĩa vụ kế toán, thuế, pháp lý và quy định: Điều 6(1)(c).</li><li>Bảo mật, phòng chống gian lận/lạm dụng và bảo vệ hệ thống hoặc yêu cầu pháp lý: Điều 6(1)(f), lợi ích hợp pháp giới hạn ở mức cần thiết.</li><li>Báo cáo/chẩn đoán tùy chọn khi có yêu cầu đồng ý: Điều 6(1)(a). Có thể rút lại sự đồng ý bất cứ lúc nào cho tương lai.</li></ul>
<h2>4. Thanh toán, bên nhận và chuyển dữ liệu quốc tế</h2><p>Thanh toán do Stripe xử lý. Reporting Server không nhận hoặc lưu dữ liệu thẻ đầy đủ. Trong EEA, Stripe Payments Europe Limited có thể đóng vai trò bên xử lý và/hoặc bên kiểm soát độc lập tùy hoạt động, gồm thanh toán, gian lận, rủi ro và tuân thủ. Stripe và các công ty liên kết/nhà cung cấp cần thiết có thể xử lý dữ liệu ngoài EEA với biện pháp bảo vệ phù hợp như quyết định công nhận mức bảo vệ tương đương, EU-US Data Privacy Framework khi áp dụng và các điều khoản hợp đồng tiêu chuẩn EU.</p><p>Các bên nhận khác giới hạn ở nhà cung cấp hạ tầng, hosting, mạng và bảo mật cần thiết, cố vấn khi cần và cơ quan công quyền khi pháp luật yêu cầu. Chúng tôi không bán dữ liệu cá nhân cho quảng cáo.</p>
<h2>5. Thời gian lưu giữ</h2><ul><li>Mã ghép nối Map tạm thời hết hạn sau 7 ngày; bearer token cục bộ không được lưu.</li><li>Dữ liệu đơn hàng và quyền sử dụng được lưu khi cần để cung cấp quyền số đã mua và trong các thời hạn kế toán, thuế, chargeback, chống gian lận và khiếu kiện áp dụng. Mã quyền cốt lõi có thể được giữ khi quyền còn hoạt động.</li><li>Yêu cầu giọng/hỗ trợ được giữ đến khi giải quyết và theo dõi hợp lý, sau đó xóa hoặc ẩn danh khi không còn cần thiết.</li><li>Telemetry/chẩn đoán tùy chọn chỉ được giữ khi cần cho mục đích phát triển, bảo mật hoặc điều tra đã được đồng ý và có thể xóa theo yêu cầu hợp lệ trừ khi có căn cứ pháp lý khác yêu cầu giữ.</li><li>Yêu cầu thực hiện quyền có thể được giữ để xử lý và chứng minh tuân thủ.</li></ul>
<h2>6. Quyền của bạn</h2><p>Theo GDPR và các ngoại lệ áp dụng, bạn có thể yêu cầu truy cập, chỉnh sửa, xóa, hạn chế, khả chuyển dữ liệu và phản đối việc xử lý dựa trên lợi ích hợp pháp. Có thể rút lại sự đồng ý bất kỳ lúc nào. Chúng tôi phản hồi không chậm trễ quá mức, thường trong một tháng; có thể gia hạn khi GDPR cho phép. Có thể yêu cầu xác minh danh tính hợp lý.</p>
<h2>7. Dữ liệu bắt buộc hoặc tùy chọn; quyết định tự động</h2><p>Dữ liệu thanh toán/liên hệ cần cho mua hàng hoặc dịch vụ là dữ liệu theo hợp đồng/trước hợp đồng; thiếu chúng có thể không hoàn tất được giao dịch hoặc dịch vụ. Báo cáo/chẩn đoán ANTHBOT tùy chọn không bắt buộc cho tích hợp cốt lõi. Reporting Server không đưa ra quyết định chỉ dựa trên xử lý tự động gây hiệu lực pháp lý hoặc ảnh hưởng đáng kể tương tự. Stripe có thể thực hiện kiểm tra gian lận/rủi ro riêng.</p>
<h2>8. Khiếu nại và thay đổi</h2><p>Bạn có thể liên hệ trước với bên kiểm soát bằng thông tin trên hoặc biểu mẫu dưới đây. Bạn cũng có thể khiếu nại tới cơ quan Hungary: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; địa chỉ thư: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; điện thoại: +36 (1) 391-1400.</p><p>Thông báo này có thể được cập nhật khi dịch vụ, nhà cung cấp hoặc yêu cầu pháp lý thay đổi. Phiên bản và ngày hiện tại được công bố tại trang này.</p>`,

<h2>5. 보관</h2><ul><li>임시 Map 페어링 코드는 7일 후 만료되며 로컬 bearer token은 저장되지 않습니다.</li><li>주문 및 권한 기록은 구매한 디지털 권한을 제공하는 데 필요한 기간과 적용되는 회계, 세금, chargeback, 사기 방지 및 법적 청구 기간 동안 보관됩니다. 핵심 권한 식별자는 권한이 활성 상태인 동안 유지될 수 있습니다.</li><li>맞춤 음성/지원 요청은 처리 및 합리적 후속조치가 끝날 때까지 보관하고 더 이상 필요하지 않으면 삭제하거나 익명화합니다.</li><li>선택적 텔레메트리/진단은 동의된 개발, 보안 또는 문제 조사 목적에 필요한 동안만 보관하며 다른 법적 근거가 보관을 요구하지 않는 경우 유효한 요청에 따라 삭제할 수 있습니다.</li><li>개인정보 권리 요청은 처리 및 준수 입증에 필요한 동안 보관할 수 있습니다.</li></ul>
<h2>6. 귀하의 권리</h2><p>GDPR 및 적용 예외에 따라 열람, 정정, 삭제, 처리 제한, 데이터 이동을 요청하고 정당한 이익에 근거한 처리에 반대할 수 있습니다. 동의는 언제든 철회할 수 있습니다. 부당한 지연 없이 일반적으로 한 달 내 응답하며 GDPR이 허용하는 경우 연장될 수 있습니다. 필요한 경우 합리적인 신원 확인을 요청할 수 있습니다.</p>

const ANALYTICS_TEXT={
  en:{analyticsTitle:"Privacy-friendly, pseudonymous website statistics",analyticsText:"To understand whether the public site and Voice Store are actually used, the browser sends only the page path and selected site language to our own Reporting Server on each page load. The server uses the source IP address only transiently in memory to create a secret-keyed HMAC pseudonym that changes every UTC day. The raw IP address and User-Agent are not written to the analytics database, and analytics does not use cookies, localStorage identifiers or browser fingerprinting. Daily pseudonyms are kept for at most 35 days; aggregated page-view counts are kept for at most 400 days. The legal basis is our legitimate interest under GDPR Article 6(1)(f) in measuring service use and preventing repeated refreshes from inflating the daily unique count.",analyticsAccuracy:"The daily unique count is approximate: several people behind one public IP may count as one, while the same person may count more than once if their public IP changes. The daily HMAC is not used for security, advertising or cross-day profiling."},
  hu:{analyticsTitle:"Adatvédelmi szempontból kímélő, álnevesített webstatisztika",analyticsText:"Annak megértéséhez, hogy a nyilvános weboldalt és a Hangboltot ténylegesen használják-e, minden oldalbetöltéskor kizárólag az oldal útvonala és a kiválasztott webhelynyelv kerül elküldésre a saját Reporting Serverünknek. A szerver a forrás IP-címet csak pillanatnyilag, memóriában használja egy titkos kulccsal képzett HMAC-álnevesítő azonosító előállításához, amely minden UTC-napon megváltozik. A nyers IP-cím és a User-Agent nem kerül az analitikai adatbázisba, és az analitika nem használ cookie-t, localStorage-alapú látogatói azonosítót vagy böngésző-ujjlenyomatot. A napi álneves azonosítók legfeljebb 35 napig, az összesített oldalmegtekintési számlálók legfeljebb 400 napig maradnak meg. A jogalap a GDPR 6. cikk (1) f) szerinti jogos érdekünk a szolgáltatás használatának mérésére és arra, hogy az ismételt frissítések ne növeljék mesterségesen a napi egyedi látogatók számát.",analyticsAccuracy:"A napi egyedi látogatószám közelítő adat: több, azonos nyilvános IP mögött lévő személy egynek számíthat, míg ugyanaz a személy IP-változás esetén többször is megjelenhet. A napi HMAC-azonosítót nem használjuk biztonsági azonosításra, reklámra vagy napokon átívelő profilalkotásra."},
  de:{analyticsTitle:"Datenschutzfreundliche, pseudonyme Webstatistik",analyticsText:"Um die Nutzung der öffentlichen Website und des Sprachshops zu verstehen, sendet der Browser bei jedem Seitenaufruf nur den Seitenpfad und die gewählte Seitensprache an unseren eigenen Reporting Server. Die Quell-IP wird nur flüchtig im Arbeitsspeicher verwendet, um ein mit geheimem Schlüssel erzeugtes HMAC-Pseudonym zu bilden, das sich an jedem UTC-Tag ändert. Roh-IP und User-Agent werden nicht in der Analysedatenbank gespeichert; es werden keine Analyse-Cookies, localStorage-Besucherkennungen oder Browser-Fingerprints verwendet. Tagespseudonyme werden höchstens 35 Tage, aggregierte Seitenaufrufe höchstens 400 Tage gespeichert. Rechtsgrundlage ist unser berechtigtes Interesse nach Art. 6 Abs. 1 lit. f DSGVO an der Nutzungsmessung und daran, wiederholte Aktualisierungen nicht als neue Tagesbesucher zu zählen.",analyticsAccuracy:"Die Zahl der täglichen Einzelbesucher ist eine Näherung: mehrere Personen hinter einer öffentlichen IP können als eine zählen; bei IP-Wechsel kann dieselbe Person mehrfach erscheinen. Das Tages-HMAC wird nicht für Sicherheit, Werbung oder tageübergreifende Profilbildung verwendet."},
  fr:{analyticsTitle:"Statistiques web pseudonymisées et respectueuses de la vie privée",analyticsText:"Pour mesurer l’utilisation du site public et de la boutique vocale, le navigateur envoie à notre propre Reporting Server uniquement le chemin de la page et la langue du site sélectionnée à chaque chargement. L’adresse IP source n’est utilisée que brièvement en mémoire pour créer un pseudonyme HMAC à clé secrète qui change chaque jour UTC. L’IP brute et le User-Agent ne sont pas enregistrés dans la base analytique, et aucun cookie analytique, identifiant localStorage ou fingerprint du navigateur n’est utilisé. Les pseudonymes quotidiens sont conservés au maximum 35 jours et les compteurs agrégés de pages vues au maximum 400 jours. La base juridique est notre intérêt légitime au titre de l’article 6(1)(f) du RGPD à mesurer l’utilisation du service et à éviter que des actualisations répétées gonflent le nombre quotidien de visiteurs uniques.",analyticsAccuracy:"Le nombre quotidien de visiteurs uniques est approximatif : plusieurs personnes partageant une IP publique peuvent compter pour une seule, tandis qu’une même personne peut être comptée plusieurs fois si son IP change. Le HMAC quotidien n’est pas utilisé pour la sécurité, la publicité ou le profilage entre plusieurs jours."},
  es:{analyticsTitle:"Estadísticas web seudonimizadas y respetuosas con la privacidad",analyticsText:"Para conocer el uso del sitio público y de la tienda de voces, en cada carga el navegador envía únicamente la ruta de la página y el idioma seleccionado a nuestro propio Reporting Server. La IP de origen solo se usa de forma transitoria en memoria para crear un seudónimo HMAC con clave secreta que cambia cada día UTC. La IP original y el User-Agent no se escriben en la base analítica y no usamos cookies analíticas, identificadores de localStorage ni huellas del navegador. Los seudónimos diarios se conservan como máximo 35 días y los recuentos agregados de páginas vistas como máximo 400 días. La base jurídica es nuestro interés legítimo conforme al artículo 6(1)(f) del RGPD en medir el uso del servicio y evitar que las recargas repetidas inflen el número diario de visitantes únicos.",analyticsAccuracy:"El número diario de visitantes únicos es aproximado: varias personas detrás de una misma IP pública pueden contar como una, y una misma persona puede contar varias veces si cambia de IP. El HMAC diario no se utiliza para seguridad, publicidad ni perfiles entre días."},
  it:{analyticsTitle:"Statistiche web pseudonimizzate e rispettose della privacy",analyticsText:"Per capire l’utilizzo del sito pubblico e del negozio voci, a ogni caricamento il browser invia al nostro Reporting Server solo il percorso della pagina e la lingua selezionata. L’IP sorgente viene usato solo temporaneamente in memoria per creare uno pseudonimo HMAC con chiave segreta che cambia ogni giorno UTC. IP grezzo e User-Agent non vengono scritti nel database analitico e non usiamo cookie analitici, identificatori localStorage o fingerprint del browser. Gli pseudonimi giornalieri sono conservati al massimo 35 giorni e i conteggi aggregati delle visualizzazioni al massimo 400 giorni. La base giuridica è il nostro legittimo interesse ai sensi dell’art. 6(1)(f) GDPR a misurare l’uso del servizio ed evitare che ripetuti aggiornamenti gonfino il conteggio giornaliero dei visitatori unici.",analyticsAccuracy:"Il conteggio giornaliero degli utenti unici è approssimativo: più persone dietro lo stesso IP pubblico possono contare come una e la stessa persona può contare più volte se cambia IP. L’HMAC giornaliero non è usato per sicurezza, pubblicità o profilazione tra giorni."},
  pt:{analyticsTitle:"Estatísticas web pseudonimizadas e orientadas para a privacidade",analyticsText:"Para compreender a utilização do site público e da loja de vozes, em cada carregamento o navegador envia apenas o caminho da página e o idioma selecionado ao nosso próprio Reporting Server. O IP de origem é usado apenas transitoriamente em memória para criar um pseudónimo HMAC com chave secreta que muda a cada dia UTC. O IP bruto e o User-Agent não são gravados na base analítica e não usamos cookies analíticos, identificadores localStorage nem fingerprinting do navegador. Os pseudónimos diários são mantidos no máximo 35 dias e as contagens agregadas de visualizações no máximo 400 dias. A base jurídica é o nosso interesse legítimo nos termos do artigo 6(1)(f) do RGPD em medir a utilização do serviço e impedir que atualizações repetidas aumentem artificialmente o número diário de visitantes únicos.",analyticsAccuracy:"A contagem diária de visitantes únicos é aproximada: várias pessoas atrás do mesmo IP público podem contar como uma, e a mesma pessoa pode ser contada várias vezes se o IP mudar. O HMAC diário não é usado para segurança, publicidade ou criação de perfis entre dias."},
  nl:{analyticsTitle:"Gepseudonimiseerde, privacyvriendelijke webstatistieken",analyticsText:"Om het gebruik van de openbare website en Voice Store te begrijpen, stuurt de browser bij elke paginalaad alleen het paginapad en de geselecteerde sitetaal naar onze eigen Reporting Server. Het bron-IP wordt uitsluitend kortstondig in het geheugen gebruikt om een met een geheime sleutel gemaakte HMAC-pseudoniem te vormen dat elke UTC-dag verandert. Het ruwe IP-adres en de User-Agent worden niet in de analysedatabase opgeslagen en er worden geen analysecookies, localStorage-bezoekers-ID’s of browserfingerprints gebruikt. Dagpseudoniemen worden maximaal 35 dagen bewaard en geaggregeerde pageview-tellingen maximaal 400 dagen. De rechtsgrond is ons gerechtvaardigd belang op grond van AVG art. 6(1)(f) om servicegebruik te meten en te voorkomen dat herhaald verversen het dagelijkse aantal unieke bezoekers kunstmatig verhoogt.",analyticsAccuracy:"Het dagelijkse aantal unieke bezoekers is een schatting: meerdere mensen achter één publiek IP kunnen als één tellen, terwijl dezelfde persoon meerdere keren kan tellen als het publieke IP verandert. De dagelijkse HMAC wordt niet gebruikt voor beveiliging, reclame of profilering over meerdere dagen."},
  pl:{analyticsTitle:"Pseudonimizowane statystyki strony z poszanowaniem prywatności",analyticsText:"Aby mierzyć użycie publicznej strony i sklepu głosów, przy każdym załadowaniu przeglądarka wysyła do naszego Reporting Server wyłącznie ścieżkę strony i wybrany język. Źródłowy adres IP jest używany tylko chwilowo w pamięci do utworzenia pseudonimu HMAC z tajnym kluczem, który zmienia się każdego dnia UTC. Surowy IP i User-Agent nie są zapisywane w bazie analitycznej; nie używamy analitycznych cookies, identyfikatorów localStorage ani fingerprintingu przeglądarki. Dzienne pseudonimy są przechowywane maksymalnie 35 dni, a zagregowane liczniki odsłon maksymalnie 400 dni. Podstawą prawną jest nasz prawnie uzasadniony interes z art. 6 ust. 1 lit. f RODO w mierzeniu użycia usługi i zapobieganiu sztucznemu zawyżaniu dziennej liczby unikalnych odwiedzających przez wielokrotne odświeżenia.",analyticsAccuracy:"Dzienna liczba unikalnych odwiedzających jest przybliżona: kilka osób za jednym publicznym IP może zostać policzonych jako jedna, a ta sama osoba może być policzona kilka razy po zmianie IP. Dzienny HMAC nie służy do bezpieczeństwa, reklamy ani profilowania między dniami."},
  cs:{analyticsTitle:"Pseudonymizované statistiky webu šetrné k soukromí",analyticsText:"Pro měření používání veřejného webu a obchodu s hlasy posílá prohlížeč při každém načtení našemu Reporting Serveru pouze cestu stránky a zvolený jazyk webu. Zdrojová IP se použije jen přechodně v paměti k vytvoření pseudonymu HMAC s tajným klíčem, který se mění každý UTC den. Surová IP ani User-Agent se do analytické databáze nezapisují a nepoužíváme analytické cookies, identifikátory localStorage ani otisk prohlížeče. Denní pseudonymy uchováváme nejvýše 35 dní a agregované počty zobrazení nejvýše 400 dní. Právním základem je náš oprávněný zájem podle čl. 6 odst. 1 písm. f GDPR měřit používání služby a zabránit tomu, aby opakovaná obnovení uměle zvyšovala denní počet unikátních návštěvníků.",analyticsAccuracy:"Denní počet unikátních návštěvníků je přibližný: více osob za jednou veřejnou IP může být započteno jako jedna, zatímco stejná osoba může být při změně IP započtena vícekrát. Denní HMAC nepoužíváme pro bezpečnost, reklamu ani profilování napříč dny."},
  sk:{analyticsTitle:"Pseudonymizovaná webová štatistika šetrná k súkromiu",analyticsText:"Na meranie používania verejného webu a obchodu s hlasmi odosiela prehliadač pri každom načítaní nášmu Reporting Serveru iba cestu stránky a zvolený jazyk. Zdrojová IP sa použije len prechodne v pamäti na vytvorenie pseudonymu HMAC s tajným kľúčom, ktorý sa mení každý UTC deň. Surová IP ani User-Agent sa do analytickej databázy nezapisujú a nepoužívame analytické cookies, identifikátory localStorage ani odtlačok prehliadača. Denné pseudonymy uchovávame najviac 35 dní a agregované počty zobrazení najviac 400 dní. Právnym základom je náš oprávnený záujem podľa čl. 6 ods. 1 písm. f GDPR merať používanie služby a zabrániť tomu, aby opakované obnovenia umelo zvyšovali denný počet unikátnych návštevníkov.",analyticsAccuracy:"Denný počet unikátnych návštevníkov je približný: viac osôb za jednou verejnou IP môže byť započítaných ako jedna a tá istá osoba môže byť pri zmene IP započítaná viackrát. Denný HMAC nepoužívame na bezpečnosť, reklamu ani profilovanie naprieč dňami."},
  ro:{analyticsTitle:"Statistici web pseudonimizate, orientate spre protejarea vieții private",analyticsText:"Pentru a măsura utilizarea site-ului public și a magazinului de voci, la fiecare încărcare browserul trimite propriului nostru Reporting Server doar calea paginii și limba selectată. IP-ul sursă este folosit doar temporar în memorie pentru a crea un pseudonim HMAC cu cheie secretă care se schimbă în fiecare zi UTC. IP-ul brut și User-Agent nu sunt scrise în baza analitică și nu folosim cookie-uri analitice, identificatori localStorage sau amprentarea browserului. Pseudonimele zilnice sunt păstrate maximum 35 de zile, iar numărătorile agregate de afișări maximum 400 de zile. Temeiul juridic este interesul nostru legitim conform art. 6(1)(f) GDPR de a măsura utilizarea serviciului și de a evita ca reîncărcările repetate să crească artificial numărul zilnic de vizitatori unici.",analyticsAccuracy:"Numărul zilnic de vizitatori unici este aproximativ: mai multe persoane din spatele aceluiași IP public pot fi numărate ca una, iar aceeași persoană poate fi numărată de mai multe ori dacă IP-ul se schimbă. HMAC-ul zilnic nu este folosit pentru securitate, publicitate sau profilare între zile."},
  da:{analyticsTitle:"Pseudonymiseret og privatlivsvenlig webstatistik",analyticsText:"For at måle brugen af det offentlige websted og stemmebutikken sender browseren ved hver indlæsning kun sidestien og det valgte sprog til vores egen Reporting Server. Kilde-IP'en bruges kun kortvarigt i hukommelsen til at oprette et HMAC-pseudonym med hemmelig nøgle, som ændres hver UTC-dag. Rå IP og User-Agent skrives ikke til analysedatabasen, og der bruges ingen analysecookies, localStorage-besøgs-id'er eller browserfingerprinting. Daglige pseudonymer gemmes højst 35 dage og aggregerede sidevisninger højst 400 dage. Retsgrundlaget er vores legitime interesse efter GDPR art. 6(1)(f) i at måle brugen af tjenesten og forhindre, at gentagne opdateringer kunstigt øger det daglige antal unikke besøgende.",analyticsAccuracy:"Det daglige antal unikke besøgende er omtrentligt: flere personer bag samme offentlige IP kan tælle som én, mens samme person kan tælle flere gange ved IP-skift. Det daglige HMAC bruges ikke til sikkerhed, reklame eller profilering på tværs af dage."},
  sv:{analyticsTitle:"Pseudonymiserad och integritetsvänlig webbstatistik",analyticsText:"För att mäta användningen av den offentliga webbplatsen och röstbutiken skickar webbläsaren vid varje sidladdning endast sidans sökväg och valt språk till vår egen Reporting Server. Käll-IP används endast tillfälligt i minnet för att skapa en HMAC-pseudonym med hemlig nyckel som ändras varje UTC-dag. Rå IP och User-Agent skrivs inte till analysdatabasen och inga analyscookies, localStorage-besökar-ID:n eller webbläsarfingeravtryck används. Dagliga pseudonymer sparas högst 35 dagar och aggregerade sidvisningar högst 400 dagar. Rättslig grund är vårt berättigade intresse enligt GDPR art. 6.1 f att mäta användningen och hindra upprepade omladdningar från att artificiellt höja det dagliga antalet unika besökare.",analyticsAccuracy:"Det dagliga antalet unika besökare är ungefärligt: flera personer bakom samma offentliga IP kan räknas som en, medan samma person kan räknas flera gånger om IP-adressen ändras. Dagens HMAC används inte för säkerhet, reklam eller profilering över flera dagar."},
  no:{analyticsTitle:"Pseudonymisert og personvernvennlig webstatistikk",analyticsText:"For å måle bruken av det offentlige nettstedet og stemmebutikken sender nettleseren ved hver sideinnlasting bare sidestien og valgt språk til vår egen Reporting Server. Kilde-IP brukes bare midlertidig i minnet for å lage et HMAC-pseudonym med hemmelig nøkkel som endres hver UTC-dag. Rå IP og User-Agent skrives ikke til analysedatabasen, og vi bruker ingen analysecookies, localStorage-besøks-ID eller nettleserfingerprinting. Daglige pseudonymer lagres maksimalt 35 dager og aggregerte sidevisninger maksimalt 400 dager. Rettsgrunnlaget er vår legitime interesse etter GDPR art. 6(1)(f) i å måle bruk av tjenesten og hindre at gjentatte oppdateringer kunstig øker det daglige antallet unike besøkende.",analyticsAccuracy:"Det daglige antallet unike besøkende er omtrentlig: flere personer bak samme offentlige IP kan telle som én, mens samme person kan telle flere ganger dersom IP-en endres. Dagens HMAC brukes ikke til sikkerhet, reklame eller profilering på tvers av dager."},
  fi:{analyticsTitle:"Pseudonymisoitu ja yksityisyyttä kunnioittava verkkotilasto",analyticsText:"Julkisen sivuston ja äänikaupan käytön mittaamiseksi selain lähettää jokaisella sivulatauksella omalle Reporting Serverillemme vain sivupolun ja valitun sivustokielen. Lähde-IP:tä käytetään vain hetkellisesti muistissa salaisella avaimella muodostetun HMAC-pseudonyymin luomiseen; pseudonyymi vaihtuu joka UTC-päivä. Raaka-IP:tä tai User-Agentia ei kirjoiteta analytiikkatietokantaan, eikä analytiikassa käytetä evästeitä, localStorage-kävijätunnisteita tai selaimen sormenjälkeä. Päivittäisiä pseudonyymejä säilytetään enintään 35 päivää ja koottuja sivulatauslukuja enintään 400 päivää. Oikeusperuste on GDPR 6(1)(f) mukainen oikeutettu etumme mitata palvelun käyttöä ja estää toistuvia päivityksiä kasvattamasta keinotekoisesti päivän yksittäisten kävijöiden määrää.",analyticsAccuracy:"Päivän yksittäisten kävijöiden määrä on arvio: useat saman julkisen IP:n takana olevat henkilöt voivat näkyä yhtenä, ja sama henkilö voi näkyä useasti IP:n vaihtuessa. Päivittäistä HMAC-tunnistetta ei käytetä turvallisuuteen, mainontaan tai päivien väliseen profilointiin."},
  "zh-CN":{analyticsTitle:"隐私友好的假名化网站统计",analyticsText:"为了了解公开网站和语音商店的实际使用情况，每次页面加载时，浏览器只会向我们自己的 Reporting Server 发送页面路径和所选网站语言。服务器仅在内存中短暂使用来源 IP，通过秘密密钥生成每天 UTC 都会变化的 HMAC 化名标识。原始 IP 和 User-Agent 不会写入分析数据库，也不使用分析 Cookie、localStorage 访客标识或浏览器指纹。每日化名最多保留 35 天，汇总页面浏览次数最多保留 400 天。法律依据是 GDPR 第 6(1)(f) 条下的合法利益，用于衡量服务使用情况，并防止重复刷新人为增加每日唯一访客数。",analyticsAccuracy:"每日唯一访客数是近似值：同一公共 IP 后的多个人可能被计为一个，而同一个人在公共 IP 改变时可能被多次计数。每日 HMAC 不用于安全识别、广告或跨天画像。"},
  "zh-TW":{analyticsTitle:"隱私友善的假名化網站統計",analyticsText:"為了了解公開網站與語音商店的實際使用情況，每次頁面載入時，瀏覽器只會向我們自己的 Reporting Server 傳送頁面路徑與所選網站語言。伺服器只在記憶體中短暫使用來源 IP，透過秘密金鑰產生每天 UTC 都會變更的 HMAC 化名識別碼。原始 IP 與 User-Agent 不會寫入分析資料庫，也不使用分析 Cookie、localStorage 訪客識別碼或瀏覽器指紋。每日化名最多保留 35 天，彙總頁面瀏覽次數最多保留 400 天。法律依據是 GDPR 第 6(1)(f) 條下的合法利益，用於衡量服務使用情況，並避免重複重新整理人為增加每日唯一訪客數。",analyticsAccuracy:"每日唯一訪客數是近似值：同一公共 IP 後的多人可能被計為一人，而同一人在公共 IP 改變時可能被重複計數。每日 HMAC 不用於安全識別、廣告或跨日剖析。"},
  tr:{analyticsTitle:"Takma kimlikli ve gizlilik odaklı web istatistikleri",analyticsText:"Herkese açık sitenin ve ses mağazasının kullanımını anlamak için tarayıcı her sayfa yüklemesinde yalnızca sayfa yolunu ve seçilen site dilini kendi Reporting Server'ımıza gönderir. Kaynak IP yalnızca bellekte geçici olarak, her UTC gününde değişen gizli anahtarlı bir HMAC takma kimliği oluşturmak için kullanılır. Ham IP ve User-Agent analiz veritabanına yazılmaz; analiz çerezi, localStorage ziyaretçi kimliği veya tarayıcı parmak izi kullanılmaz. Günlük takma kimlikler en fazla 35 gün, toplu sayfa görüntüleme sayıları en fazla 400 gün tutulur. Hukuki dayanak, GDPR 6(1)(f) kapsamındaki hizmet kullanımını ölçme ve tekrarlanan yenilemelerin günlük benzersiz ziyaretçi sayısını yapay olarak artırmasını önleme yönündeki meşru menfaatimizdir.",analyticsAccuracy:"Günlük benzersiz ziyaretçi sayısı yaklaşık değerdir: aynı genel IP arkasındaki birden fazla kişi tek sayılabilir; genel IP değişirse aynı kişi birden fazla sayılabilir. Günlük HMAC güvenlik, reklam veya günler arası profil oluşturma amacıyla kullanılmaz."},
  th:{analyticsTitle:"สถิติเข้าเว็บไซต์แบบใช้นามแฝงและคำนึงถึงความเป็นส่วนตัว",analyticsText:"เพื่อวัดการใช้งานเว็บไซต์สาธารณะและร้านเสียง ในแต่ละการโหลดหน้า เบราว์เซอร์จะส่งเฉพาะเส้นทางของหน้าและภาษาที่เลือกไปยัง Reporting Server ของเราเอง IP ต้นทางถูกใช้เพียงชั่วคราวในหน่วยความจำเพื่อสร้างนามแฝง HMAC ด้วยคีย์ลับซึ่งเปลี่ยนทุกวันตาม UTC IP ดิบและ User-Agent จะไม่ถูกเขียนลงฐานข้อมูลวิเคราะห์ และไม่ใช้คุกกี้วิเคราะห์ ตัวระบุผู้เยี่ยมชมใน localStorage หรือ browser fingerprinting นามแฝงรายวันเก็บไม่เกิน 35 วัน และจำนวนการดูหน้าแบบรวมเก็บไม่เกิน 400 วัน ฐานทางกฎหมายคือผลประโยชน์โดยชอบด้วยกฎหมายตาม GDPR มาตรา 6(1)(f) เพื่อวัดการใช้บริการและป้องกันการรีเฟรชซ้ำจากการเพิ่มจำนวนผู้เยี่ยมชมไม่ซ้ำรายวันอย่างเทียม",analyticsAccuracy:"จำนวนผู้เยี่ยมชมไม่ซ้ำรายวันเป็นค่าประมาณ: หลายคนที่ใช้ IP สาธารณะเดียวกันอาจถูกนับเป็นหนึ่ง และคนเดิมอาจถูกนับหลายครั้งหาก IP เปลี่ยน HMAC รายวันไม่ใช้เพื่อความปลอดภัย โฆษณา หรือสร้างโปรไฟล์ข้ามวัน"},
  vi:{analyticsTitle:"Thống kê web dùng bút danh, ưu tiên quyền riêng tư",analyticsText:"Để đo mức sử dụng trang công khai và cửa hàng giọng nói, mỗi lần tải trang trình duyệt chỉ gửi đường dẫn trang và ngôn ngữ đã chọn tới Reporting Server của chúng tôi. IP nguồn chỉ được dùng tạm thời trong bộ nhớ để tạo bút danh HMAC bằng khóa bí mật thay đổi mỗi ngày UTC. IP thô và User-Agent không được ghi vào cơ sở dữ liệu phân tích; không dùng cookie phân tích, mã khách trong localStorage hay fingerprint trình duyệt. Bút danh hằng ngày được giữ tối đa 35 ngày và số lượt xem trang tổng hợp tối đa 400 ngày. Căn cứ pháp lý là lợi ích hợp pháp theo GDPR Điều 6(1)(f) để đo việc sử dụng dịch vụ và ngăn tải lại nhiều lần làm tăng giả tạo số khách duy nhất trong ngày.",analyticsAccuracy:"Số khách duy nhất hằng ngày chỉ là ước tính: nhiều người dùng chung một IP công cộng có thể được tính là một, còn cùng một người có thể được tính nhiều lần nếu IP thay đổi. HMAC hằng ngày không dùng cho bảo mật, quảng cáo hay lập hồ sơ xuyên nhiều ngày."},
  ko:{analyticsTitle:"가명화·개인정보 보호형 웹 통계",analyticsText:"공개 사이트와 음성 스토어의 실제 사용량을 파악하기 위해 페이지가 로드될 때마다 브라우저는 페이지 경로와 선택한 사이트 언어만 자체 Reporting Server로 보냅니다. 원본 IP는 메모리에서 잠시만 사용되어 비밀 키 기반 HMAC 가명 식별자를 만들며, 이 식별자는 UTC 기준 매일 변경됩니다. 원본 IP와 User-Agent는 분석 데이터베이스에 기록되지 않으며 분석 쿠키, localStorage 방문자 ID 또는 브라우저 핑거프린팅을 사용하지 않습니다. 일일 가명 식별자는 최대 35일, 집계된 페이지뷰 수는 최대 400일 보관됩니다. 법적 근거는 GDPR 6(1)(f)에 따른 서비스 이용 측정 및 반복 새로고침으로 일일 고유 방문자 수가 부풀려지는 것을 방지하기 위한 정당한 이익입니다.",analyticsAccuracy:"일일 고유 방문자 수는 근사치입니다. 하나의 공용 IP 뒤에 여러 사람이 있으면 한 명으로 계산될 수 있고, 같은 사람도 IP가 바뀌면 여러 번 계산될 수 있습니다. 일일 HMAC는 보안, 광고 또는 날짜 간 프로파일링에 사용되지 않습니다."},
  km:{analyticsTitle:"ស្ថិតិគេហទំព័រប្រើនាមក្លែង និងគោរពឯកជនភាព",analyticsText:"ដើម្បីវាស់ការប្រើប្រាស់គេហទំព័រសាធារណៈ និងហាងសំឡេង រាល់ពេលផ្ទុកទំព័រ browser ផ្ញើតែផ្លូវទំព័រ និងភាសាគេហទំព័រដែលបានជ្រើសទៅ Reporting Server របស់យើង។ IP ប្រភពត្រូវបានប្រើតែបណ្តោះអាសន្នក្នុង memory ដើម្បីបង្កើត HMAC pseudonym ជាមួយកូនសោសម្ងាត់ ដែលប្តូររាល់ថ្ងៃ UTC។ IP ដើម និង User-Agent មិនត្រូវបានសរសេរទៅ database analytics ហើយមិនប្រើ analytics cookie, localStorage visitor ID ឬ browser fingerprinting ទេ។ pseudonym ប្រចាំថ្ងៃរក្សាទុកអតិបរមា 35 ថ្ងៃ ហើយចំនួន page view សរុបរក្សាទុកអតិបរមា 400 ថ្ងៃ។ មូលដ្ឋានច្បាប់គឺផលប្រយោជន៍ស្របច្បាប់ក្រោម GDPR មាត្រា 6(1)(f) ដើម្បីវាស់ការប្រើសេវា និងទប់ស្កាត់ refresh ដដែលៗមិនឱ្យបង្កើនចំនួនអ្នកទស្សនាតែមួយប្រចាំថ្ងៃដោយសិប្បនិម្មិត។",analyticsAccuracy:"ចំនួនអ្នកទស្សនាតែមួយប្រចាំថ្ងៃគឺជាការប៉ាន់ស្មាន៖ មនុស្សជាច្រើននៅក្រោយ IP សាធារណៈតែមួយអាចត្រូវរាប់ជាម្នាក់ ហើយមនុស្សដដែលអាចត្រូវរាប់ច្រើនដងបើ IP ប្រែប្រួល។ HMAC ប្រចាំថ្ងៃមិនត្រូវបានប្រើសម្រាប់សុវត្ថិភាព ការផ្សាយពាណិជ្ជកម្ម ឬ profiling ឆ្លងថ្ងៃទេ។"}
};
