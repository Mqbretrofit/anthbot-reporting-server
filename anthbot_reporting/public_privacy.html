const INSTALLER_PRIVACY={
  en:{installerPrivacyTitle:"Optional browser-based ANTHBOT Voice Installer",installerPrivacyCredentials:"If you choose the browser Voice Installer, your ANTHBOT username and password are sent over HTTPS to this Reporting Server solely to sign in to the official ANTHBOT API. The password is not written to disk or the application database. After successful sign-in, the temporary ANTHBOT access token and the owner mower details needed for installation, including its serial number, are held only in volatile server memory for up to 20 minutes. Temporary AWS IoT credentials issued for the selected mower are used only during the active installation and are not persisted. This processing is necessary to provide the installation service you request (GDPR Article 6(1)(b)).",installerPrivacyStore:"A strictly functional HttpOnly browser cookie is used to recognize purchases made from the Voice Installer so you do not need to copy a license key. The Reporting Server stores only the derived opaque client identifier with the order, not the cookie value itself. For abuse protection, the source IP may be used transiently in memory to derive a keyed short-lived rate-limit identifier; the raw IP is not stored by this installer function. This protection is based on our legitimate interest under GDPR Article 6(1)(f). Authentication and mower-control requests are sent to ANTHBOT's official cloud; ANTHBOT's AWS IoT infrastructure is used to deliver the installation command to the mower. These external services process data under their own applicable terms and privacy arrangements."},
  hu:{installerPrivacyTitle:"Opcionális, böngészőből használható ANTHBOT hangtelepítő",installerPrivacyCredentials:"Ha a böngészős Hangtelepítőt választod, az ANTHBOT felhasználóneved és jelszavad HTTPS-en keresztül kizárólag azért érkezik a Reporting Serverhez, hogy bejelentkezzen a hivatalos ANTHBOT API-ba. A jelszót nem írjuk lemezre és nem mentjük az alkalmazás adatbázisába. Sikeres bejelentkezés után az ideiglenes ANTHBOT hozzáférési token és a telepítéshez szükséges tulajdonosi robotadatok – köztük a sorozatszám – legfeljebb 20 percig, kizárólag a szerver memóriájában maradnak. A kiválasztott robothoz kiadott ideiglenes AWS IoT hitelesítő adatokat csak az aktív telepítés alatt használjuk, és nem tároljuk tartósan. Ennek jogalapja a kért telepítési szolgáltatás teljesítése, GDPR 6. cikk (1) b).",installerPrivacyStore:"Egy szigorúan funkcionális, HttpOnly böngészőcookie segítségével ismerjük fel a Hangtelepítőből végzett vásárlást, így nem kell licenckulcsot másolnod. A Reporting Server a rendelés mellett csak az ebből képzett, átlátszatlan kliensazonosítót tárolja, magát a cookie értékét nem. Visszaélés-védelemhez a forrás IP-cím pillanatnyilag, memóriában felhasználható egy titkos kulccsal képzett rövid életű sebességkorlátozási azonosító előállítására; a Hangtelepítő funkció a nyers IP-t nem tárolja. Ennek jogalapja a GDPR 6. cikk (1) f) szerinti jogos érdek. A hitelesítési és robotvezérlési kérések az ANTHBOT hivatalos felhőjéhez kerülnek, a telepítési parancs továbbításához pedig az ANTHBOT AWS IoT infrastruktúrája használatos. E külső szolgáltatások a saját alkalmazandó feltételeik és adatvédelmi szabályaik szerint kezelnek adatokat."},
  de:{installerPrivacyTitle:"Optionaler browserbasierter ANTHBOT-Sprachinstaller",installerPrivacyCredentials:"Wenn Sie den Browser-Sprachinstaller verwenden, werden ANTHBOT-Benutzername und Passwort ausschließlich über HTTPS an diesen Reporting Server übermittelt, um sich bei der offiziellen ANTHBOT-API anzumelden. Das Passwort wird weder auf Festplatte noch in der Anwendungsdatenbank gespeichert. Nach erfolgreicher Anmeldung bleiben der temporäre ANTHBOT-Zugriffstoken und die für die Installation erforderlichen Daten des eigenen Mähers, einschließlich Seriennummer, höchstens 20 Minuten ausschließlich im flüchtigen Serverspeicher. Temporäre AWS-IoT-Zugangsdaten für den ausgewählten Mäher werden nur während der aktiven Installation verwendet und nicht dauerhaft gespeichert. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO zur Erbringung der angeforderten Installationsleistung.",installerPrivacyStore:"Ein strikt funktionales HttpOnly-Browser-Cookie erkennt Käufe aus dem Sprachinstaller, damit kein Lizenzschlüssel kopiert werden muss. Beim Auftrag speichert der Reporting Server nur die daraus abgeleitete undurchsichtige Client-ID, nicht den Cookie-Wert selbst. Zum Missbrauchsschutz kann die Quell-IP kurzfristig im Arbeitsspeicher zur Bildung einer geheimschlüsselbasierten, kurzlebigen Rate-Limit-ID verwendet werden; die Roh-IP wird von dieser Installer-Funktion nicht gespeichert. Rechtsgrundlage ist unser berechtigtes Interesse nach Art. 6 Abs. 1 lit. f DSGVO. Authentifizierungs- und Mähersteuerungsanfragen gehen an die offizielle ANTHBOT-Cloud; für die Übermittlung des Installationsbefehls wird die AWS-IoT-Infrastruktur von ANTHBOT verwendet."},
  fr:{installerPrivacyTitle:"Installateur vocal ANTHBOT optionnel dans le navigateur",installerPrivacyCredentials:"Si vous utilisez l’installateur vocal dans le navigateur, votre identifiant et votre mot de passe ANTHBOT sont transmis en HTTPS à ce Reporting Server uniquement pour vous connecter à l’API officielle ANTHBOT. Le mot de passe n’est écrit ni sur disque ni dans la base de données. Après connexion, le jeton d’accès ANTHBOT temporaire et les données du robot appartenant au compte nécessaires à l’installation, notamment son numéro de série, restent uniquement en mémoire volatile du serveur pendant 20 minutes au maximum. Les identifiants AWS IoT temporaires du robot sélectionné ne sont utilisés que pendant l’installation active et ne sont pas conservés. La base juridique est l’article 6(1)(b) du RGPD pour fournir le service d’installation demandé.",installerPrivacyStore:"Un cookie de navigateur HttpOnly strictement fonctionnel permet de reconnaître les achats effectués depuis l’installateur sans copier de clé de licence. Le Reporting Server ne conserve avec la commande que l’identifiant client opaque dérivé, et non la valeur du cookie. Pour prévenir les abus, l’IP source peut être utilisée brièvement en mémoire afin de dériver un identifiant de limitation à courte durée avec clé secrète; l’IP brute n’est pas conservée par cette fonction. Cette protection repose sur l’intérêt légitime au titre de l’article 6(1)(f) du RGPD. Les requêtes d’authentification et de contrôle sont envoyées au cloud officiel ANTHBOT et l’infrastructure AWS IoT d’ANTHBOT transmet la commande d’installation."},
  es:{installerPrivacyTitle:"Instalador de voz ANTHBOT opcional desde el navegador",installerPrivacyCredentials:"Si utilizas el instalador web, tu usuario y contraseña de ANTHBOT se envían por HTTPS a este Reporting Server únicamente para iniciar sesión en la API oficial de ANTHBOT. La contraseña no se guarda en disco ni en la base de datos. Tras iniciar sesión, el token temporal de ANTHBOT y los datos del robot propio necesarios para instalar, incluido el número de serie, permanecen solo en memoria volátil del servidor durante un máximo de 20 minutos. Las credenciales temporales de AWS IoT emitidas para el robot seleccionado se usan solo durante la instalación activa y no se conservan. La base jurídica es el artículo 6(1)(b) del RGPD para prestar el servicio solicitado.",installerPrivacyStore:"Una cookie HttpOnly estrictamente funcional reconoce las compras hechas desde el instalador, evitando copiar una licencia. El Reporting Server guarda con el pedido solo un identificador de cliente opaco derivado, no el valor de la cookie. Para proteger frente a abusos, la IP de origen puede utilizarse brevemente en memoria para derivar un identificador de limitación temporal con clave secreta; esta función no almacena la IP original. La base jurídica de esta protección es el interés legítimo del artículo 6(1)(f) del RGPD. Las solicitudes de autenticación y control se envían a la nube oficial de ANTHBOT y la infraestructura AWS IoT de ANTHBOT entrega el comando de instalación."},
  it:{installerPrivacyTitle:"Installer vocale ANTHBOT opzionale nel browser",installerPrivacyCredentials:"Se usi l’installer vocale nel browser, nome utente e password ANTHBOT vengono inviati tramite HTTPS a questo Reporting Server esclusivamente per accedere all’API ufficiale ANTHBOT. La password non viene scritta su disco né nel database. Dopo l’accesso, il token ANTHBOT temporaneo e i dati del rasaerba di proprietà necessari all’installazione, incluso il numero di serie, restano solo nella memoria volatile del server per un massimo di 20 minuti. Le credenziali temporanee AWS IoT del rasaerba selezionato sono usate solo durante l’installazione attiva e non vengono conservate. La base giuridica è l’articolo 6(1)(b) GDPR per fornire il servizio richiesto.",installerPrivacyStore:"Un cookie HttpOnly strettamente funzionale riconosce gli acquisti effettuati dall’installer, evitando di copiare una chiave di licenza. Il Reporting Server memorizza con l’ordine soltanto l’identificatore client opaco derivato, non il valore del cookie. Per prevenire abusi, l’IP sorgente può essere usato brevemente in memoria per derivare un identificatore di rate limit a breve durata con chiave segreta; l’IP grezzo non viene memorizzato da questa funzione. La base è il legittimo interesse ai sensi dell’articolo 6(1)(f) GDPR. Le richieste di autenticazione e controllo vanno al cloud ufficiale ANTHBOT e l’infrastruttura AWS IoT di ANTHBOT consegna il comando di installazione."},
  pt:{installerPrivacyTitle:"Instalador de voz ANTHBOT opcional no navegador",installerPrivacyCredentials:"Se utilizar o instalador no navegador, o utilizador e a palavra-passe ANTHBOT são enviados por HTTPS a este Reporting Server apenas para iniciar sessão na API oficial ANTHBOT. A palavra-passe não é gravada em disco nem na base de dados. Depois do início de sessão, o token temporário ANTHBOT e os dados do corta-relva do proprietário necessários à instalação, incluindo o número de série, ficam apenas na memória volátil do servidor por no máximo 20 minutos. Credenciais temporárias AWS IoT do equipamento selecionado são usadas apenas durante a instalação ativa e não são persistidas. A base jurídica é o artigo 6(1)(b) do RGPD para prestar o serviço pedido.",installerPrivacyStore:"Um cookie HttpOnly estritamente funcional reconhece compras feitas no instalador para evitar copiar uma chave de licença. O Reporting Server guarda com a encomenda apenas o identificador opaco derivado do cliente, e não o valor do cookie. Para proteção contra abuso, o IP de origem pode ser usado brevemente em memória para derivar um identificador temporário de limitação com chave secreta; esta função não guarda o IP bruto. A base é o interesse legítimo nos termos do artigo 6(1)(f) do RGPD. Os pedidos de autenticação e controlo são enviados à cloud oficial ANTHBOT e a infraestrutura AWS IoT da ANTHBOT entrega o comando de instalação."},
  nl:{installerPrivacyTitle:"Optionele ANTHBOT-spraakinstaller in de browser",installerPrivacyCredentials:"Als u de browserinstaller gebruikt, worden uw ANTHBOT-gebruikersnaam en wachtwoord via HTTPS naar deze Reporting Server gestuurd uitsluitend om aan te melden bij de officiële ANTHBOT-API. Het wachtwoord wordt niet naar schijf of database geschreven. Na succesvolle aanmelding blijven de tijdelijke ANTHBOT-token en de gegevens van de eigen maaier die voor installatie nodig zijn, inclusief serienummer, maximaal 20 minuten alleen in vluchtig servergeheugen. Tijdelijke AWS IoT-inloggegevens van de geselecteerde maaier worden alleen tijdens de actieve installatie gebruikt en niet bewaard. De rechtsgrond is AVG art. 6(1)(b) voor de gevraagde installatiedienst.",installerPrivacyStore:"Een strikt functionele HttpOnly-browsercookie herkent aankopen vanuit de installer, zodat geen licentiesleutel hoeft te worden gekopieerd. Bij de bestelling bewaart de Reporting Server alleen de afgeleide ondoorzichtige client-ID, niet de cookiewaarde. Voor misbruikbeveiliging kan het bron-IP kort in het geheugen worden gebruikt om met een geheime sleutel een kortlevende rate-limit-ID af te leiden; het ruwe IP wordt door deze functie niet opgeslagen. De rechtsgrond is het gerechtvaardigd belang volgens AVG art. 6(1)(f). Authenticatie- en besturingsverzoeken gaan naar de officiële ANTHBOT-cloud; de AWS IoT-infrastructuur van ANTHBOT levert de installatieopdracht."},
  pl:{installerPrivacyTitle:"Opcjonalny instalator głosu ANTHBOT w przeglądarce",installerPrivacyCredentials:"Jeśli użyjesz instalatora przeglądarkowego, login i hasło ANTHBOT są przesyłane przez HTTPS do tego Reporting Server wyłącznie w celu zalogowania do oficjalnego API ANTHBOT. Hasło nie jest zapisywane na dysku ani w bazie danych. Po logowaniu tymczasowy token ANTHBOT i dane własnej kosiarki potrzebne do instalacji, w tym numer seryjny, pozostają wyłącznie w pamięci ulotnej serwera przez maksymalnie 20 minut. Tymczasowe dane AWS IoT dla wybranej kosiarki są używane tylko podczas aktywnej instalacji i nie są utrwalane. Podstawą prawną jest art. 6 ust. 1 lit. b RODO w celu realizacji żądanej usługi.",installerPrivacyStore:"Ściśle funkcjonalny plik cookie HttpOnly rozpoznaje zakupy z instalatora, dzięki czemu nie trzeba kopiować klucza licencji. Reporting Server zapisuje przy zamówieniu jedynie pochodny, nieprzejrzysty identyfikator klienta, a nie wartość cookie. W celu ochrony przed nadużyciami źródłowy IP może być krótko użyty w pamięci do wyliczenia krótkotrwałego identyfikatora limitu z tajnym kluczem; surowy IP nie jest zapisywany przez tę funkcję. Podstawą jest prawnie uzasadniony interes z art. 6 ust. 1 lit. f RODO. Żądania uwierzytelniania i sterowania trafiają do oficjalnej chmury ANTHBOT, a infrastruktura AWS IoT ANTHBOT dostarcza polecenie instalacji."},
  cs:{installerPrivacyTitle:"Volitelný instalátor hlasu ANTHBOT v prohlížeči",installerPrivacyCredentials:"Pokud použijete webový instalátor, uživatelské jméno a heslo ANTHBOT jsou přes HTTPS odeslány tomuto Reporting Serveru pouze za účelem přihlášení k oficiálnímu API ANTHBOT. Heslo se nezapisuje na disk ani do databáze. Po přihlášení zůstávají dočasný token ANTHBOT a údaje o vlastním robotu potřebné k instalaci, včetně sériového čísla, pouze v volatilní paměti serveru nejvýše 20 minut. Dočasné přihlašovací údaje AWS IoT pro vybraný robot se používají jen během aktivní instalace a neukládají se. Právním základem je čl. 6 odst. 1 písm. b GDPR pro poskytnutí požadované služby.",installerPrivacyStore:"Striktně funkční HttpOnly cookie rozpozná nákup z instalátoru, takže není nutné kopírovat licenční klíč. Reporting Server ukládá k objednávce jen odvozené neprůhledné ID klienta, nikoli hodnotu cookie. Pro ochranu proti zneužití lze zdrojovou IP krátce použít v paměti k odvození krátkodobého identifikátoru limitu s tajným klíčem; surová IP se touto funkcí neukládá. Základem je oprávněný zájem podle čl. 6 odst. 1 písm. f GDPR. Autentizační a řídicí požadavky směřují do oficiálního cloudu ANTHBOT a instalační příkaz doručuje infrastruktura AWS IoT ANTHBOT."},
  sk:{installerPrivacyTitle:"Voliteľný inštalátor hlasu ANTHBOT v prehliadači",installerPrivacyCredentials:"Ak použijete webový inštalátor, používateľské meno a heslo ANTHBOT sa cez HTTPS odošlú tomuto Reporting Serveru iba na prihlásenie do oficiálneho API ANTHBOT. Heslo sa nezapisuje na disk ani do databázy. Po prihlásení zostávajú dočasný token ANTHBOT a údaje o vlastnom robote potrebné na inštaláciu, vrátane sériového čísla, iba vo volatilnej pamäti servera najviac 20 minút. Dočasné údaje AWS IoT pre vybraný robot sa používajú len počas aktívnej inštalácie a neukladajú sa. Právnym základom je čl. 6 ods. 1 písm. b GDPR na poskytnutie požadovanej služby.",installerPrivacyStore:"Prísne funkčný HttpOnly cookie rozpozná nákup z inštalátora, takže netreba kopírovať licenčný kľúč. Reporting Server ukladá k objednávke iba odvodené nepriehľadné ID klienta, nie hodnotu cookie. Na ochranu pred zneužitím môže byť zdrojová IP krátko použitá v pamäti na odvodenie krátkodobého identifikátora limitu s tajným kľúčom; surová IP sa touto funkciou neukladá. Základom je oprávnený záujem podľa čl. 6 ods. 1 písm. f GDPR. Autentizačné a riadiace požiadavky smerujú do oficiálneho cloudu ANTHBOT a inštalačný príkaz doručuje infraštruktúra AWS IoT ANTHBOT."},
  ro:{installerPrivacyTitle:"Instalator vocal ANTHBOT opțional în browser",installerPrivacyCredentials:"Dacă utilizați instalatorul din browser, numele de utilizator și parola ANTHBOT sunt trimise prin HTTPS către acest Reporting Server exclusiv pentru autentificarea la API-ul oficial ANTHBOT. Parola nu este scrisă pe disc sau în baza de date. După autentificare, tokenul temporar ANTHBOT și datele robotului deținut necesare instalării, inclusiv numărul de serie, rămân doar în memoria volatilă a serverului cel mult 20 de minute. Credencialele temporare AWS IoT ale robotului selectat sunt utilizate doar în timpul instalării active și nu sunt păstrate. Temeiul juridic este art. 6(1)(b) GDPR pentru furnizarea serviciului solicitat.",installerPrivacyStore:"Un cookie HttpOnly strict funcțional recunoaște achizițiile din instalator, astfel încât nu trebuie copiată cheia de licență. Reporting Server stochează cu comanda doar ID-ul client opac derivat, nu valoarea cookie-ului. Pentru protecție împotriva abuzului, IP-ul sursă poate fi folosit temporar în memorie pentru a deriva un identificator de limitare cu durată scurtă și cheie secretă; IP-ul brut nu este stocat de această funcție. Temeiul este interesul legitim conform art. 6(1)(f) GDPR. Solicitările de autentificare și control sunt trimise cloudului oficial ANTHBOT, iar infrastructura AWS IoT ANTHBOT livrează comanda de instalare."},
  da:{installerPrivacyTitle:"Valgfrit ANTHBOT-stemmeinstallationsværktøj i browseren",installerPrivacyCredentials:"Hvis du bruger browserinstallationen, sendes ANTHBOT-brugernavn og adgangskode via HTTPS til denne Reporting Server alene for at logge ind på den officielle ANTHBOT-API. Adgangskoden skrives ikke til disk eller database. Efter login opbevares den midlertidige ANTHBOT-token og de nødvendige ejerdata om plæneklipperen, herunder serienummer, kun i flygtig serverhukommelse i højst 20 minutter. Midlertidige AWS IoT-legitimationsoplysninger for den valgte robot bruges kun under den aktive installation og gemmes ikke. Retsgrundlaget er GDPR art. 6(1)(b) for at levere den ønskede tjeneste.",installerPrivacyStore:"En strengt funktionel HttpOnly-cookie genkender køb fra installeren, så du ikke behøver kopiere en licensnøgle. Reporting Server gemmer kun det afledte uigennemsigtige klient-id sammen med ordren, ikke selve cookie-værdien. Til misbrugsbeskyttelse kan kilde-IP kortvarigt bruges i hukommelsen til at aflede et kortlivet rate-limit-id med hemmelig nøgle; rå IP gemmes ikke af denne funktion. Grundlaget er legitim interesse efter GDPR art. 6(1)(f). Godkendelses- og styringsanmodninger sendes til ANTHBOTs officielle cloud, og ANTHBOTs AWS IoT-infrastruktur leverer installationskommandoen."},
  sv:{installerPrivacyTitle:"Valfri ANTHBOT-röstinstallerare i webbläsaren",installerPrivacyCredentials:"Om du använder webbläsarinstallationen skickas ANTHBOT-användarnamn och lösenord via HTTPS till denna Reporting Server endast för inloggning mot det officiella ANTHBOT-API:t. Lösenordet skrivs inte till disk eller databas. Efter inloggning ligger den tillfälliga ANTHBOT-token och nödvändiga ägardata för klipparen, inklusive serienummer, endast i flyktigt serverminne i högst 20 minuter. Tillfälliga AWS IoT-uppgifter för vald klippare används bara under den aktiva installationen och sparas inte. Rättslig grund är GDPR art. 6.1 b för att tillhandahålla den begärda tjänsten.",installerPrivacyStore:"En strikt funktionell HttpOnly-cookie känner igen köp från installeren så att ingen licensnyckel behöver kopieras. Reporting Server lagrar bara det härledda ogenomskinliga klient-id:t med ordern, inte cookie-värdet. För missbruksskydd kan käll-IP kort användas i minnet för att härleda ett kortlivat rate-limit-id med hemlig nyckel; rå IP lagras inte av denna funktion. Grunden är berättigat intresse enligt GDPR art. 6.1 f. Autentiserings- och styrningsanrop skickas till ANTHBOTs officiella moln och ANTHBOTs AWS IoT-infrastruktur levererar installationskommandot."},
  no:{installerPrivacyTitle:"Valgfritt ANTHBOT-stemmeinstallasjonsverktøy i nettleseren",installerPrivacyCredentials:"Hvis du bruker nettleserinstallasjonen, sendes ANTHBOT-brukernavn og passord via HTTPS til denne Reporting Server kun for innlogging mot det offisielle ANTHBOT-API-et. Passordet skrives ikke til disk eller database. Etter innlogging beholdes den midlertidige ANTHBOT-tokenen og nødvendige eierdata for klipperen, inkludert serienummer, bare i flyktig serverminne i opptil 20 minutter. Midlertidige AWS IoT-opplysninger for valgt klipper brukes bare under aktiv installasjon og lagres ikke. Rettsgrunnlaget er GDPR art. 6(1)(b) for å levere tjenesten du ber om.",installerPrivacyStore:"En strengt funksjonell HttpOnly-cookie gjenkjenner kjøp fra installeren slik at lisensnøkkel ikke må kopieres. Reporting Server lagrer bare den avledede ugjennomsiktige klient-ID-en med ordren, ikke cookie-verdien. For misbruksvern kan kilde-IP brukes kort i minnet til å avlede en kortlivet rate-limit-ID med hemmelig nøkkel; rå IP lagres ikke av denne funksjonen. Grunnlaget er legitim interesse etter GDPR art. 6(1)(f). Autentiserings- og styringsforespørsler sendes til ANTHBOTs offisielle sky, og ANTHBOTs AWS IoT-infrastruktur leverer installasjonskommandoen."},
  fi:{installerPrivacyTitle:"Valinnainen ANTHBOT-ääniasennin selaimessa",installerPrivacyCredentials:"Jos käytät selainasenninta, ANTHBOT-käyttäjätunnus ja salasana lähetetään HTTPS-yhteydellä tälle Reporting Serverille vain kirjautumista varten viralliseen ANTHBOT-APIin. Salasanaa ei kirjoiteta levylle tai tietokantaan. Kirjautumisen jälkeen väliaikainen ANTHBOT-token ja asennuksessa tarvittavat omistajan leikkuritiedot, mukaan lukien sarjanumero, säilyvät vain palvelimen haihtuvassa muistissa enintään 20 minuuttia. Valitulle leikkurille myönnettyjä väliaikaisia AWS IoT -tunnuksia käytetään vain aktiivisen asennuksen aikana eikä niitä tallenneta. Oikeusperuste on GDPR 6(1)(b) pyydetyn palvelun tarjoamiseksi.",installerPrivacyStore:"Tiukasti toiminnallinen HttpOnly-eväste tunnistaa asentimesta tehdyt ostot, jotta lisenssiavainta ei tarvitse kopioida. Reporting Server tallentaa tilauksen yhteyteen vain johdetun läpinäkymättömän asiakastunnuksen, ei evästeen arvoa. Väärinkäytön estämiseksi lähde-IP:tä voidaan käyttää lyhyesti muistissa salaisella avaimella muodostetun lyhytikäisen rate-limit-tunnuksen luomiseen; raakaa IP:tä ei tallenneta tässä toiminnossa. Peruste on GDPR 6(1)(f) mukainen oikeutettu etu. Todennus- ja ohjauspyynnöt lähetetään ANTHBOTin viralliseen pilveen ja ANTHBOTin AWS IoT -infrastruktuuri toimittaa asennuskomennon."},
  "zh-CN":{installerPrivacyTitle:"可选的浏览器版 ANTHBOT 语音安装器",installerPrivacyCredentials:"如果你使用浏览器语音安装器，ANTHBOT 用户名和密码会通过 HTTPS 发送到本 Reporting Server，仅用于登录官方 ANTHBOT API。密码不会写入磁盘或应用数据库。登录成功后，临时 ANTHBOT 访问令牌以及安装所需的自有割草机信息（包括序列号）最多只在服务器易失性内存中保留 20 分钟。为所选割草机签发的临时 AWS IoT 凭证只在当前安装期间使用，不会持久保存。法律依据是 GDPR 第 6(1)(b) 条，用于提供你请求的安装服务。",installerPrivacyStore:"一个严格功能性的 HttpOnly 浏览器 Cookie 用于识别从安装器完成的购买，因此无需复制许可证密钥。Reporting Server 只随订单保存由其派生的不透明客户端标识，而不会保存 Cookie 本身的值。为防止滥用，来源 IP 可在内存中短暂用于派生带秘密密钥的短期限速标识；该功能不会存储原始 IP。法律依据是 GDPR 第 6(1)(f) 条下的合法利益。身份验证和割草机控制请求发送到 ANTHBOT 官方云，安装命令通过 ANTHBOT 的 AWS IoT 基础设施传递。"},
  "zh-TW":{installerPrivacyTitle:"可選的瀏覽器版 ANTHBOT 語音安裝器",installerPrivacyCredentials:"如果你使用瀏覽器語音安裝器，ANTHBOT 使用者名稱與密碼會透過 HTTPS 傳送到本 Reporting Server，僅用於登入官方 ANTHBOT API。密碼不會寫入磁碟或應用程式資料庫。登入成功後，臨時 ANTHBOT 存取權杖及安裝所需的自有割草機資料（包括序號）最多只在伺服器揮發性記憶體中保留 20 分鐘。為所選割草機核發的臨時 AWS IoT 憑證只在目前安裝期間使用，不會永久保存。法律依據是 GDPR 第 6(1)(b) 條，用於提供你要求的安裝服務。",installerPrivacyStore:"一個嚴格功能性的 HttpOnly 瀏覽器 Cookie 用於識別從安裝器完成的購買，因此無需複製授權金鑰。Reporting Server 只隨訂單保存由其衍生的不透明用戶端識別碼，而不保存 Cookie 本身的值。為防止濫用，來源 IP 可在記憶體中短暫用於衍生帶秘密金鑰的短期限速識別碼；此功能不儲存原始 IP。法律依據是 GDPR 第 6(1)(f) 條下的合法利益。驗證與割草機控制請求傳送至 ANTHBOT 官方雲端，安裝命令透過 ANTHBOT 的 AWS IoT 基礎設施傳遞。"},
  tr:{installerPrivacyTitle:"İsteğe bağlı tarayıcı tabanlı ANTHBOT ses yükleyici",installerPrivacyCredentials:"Tarayıcı yükleyiciyi kullanırsanız ANTHBOT kullanıcı adı ve parolanız yalnızca resmi ANTHBOT API'sinde oturum açmak amacıyla HTTPS üzerinden bu Reporting Server'a gönderilir. Parola diske veya uygulama veritabanına yazılmaz. Başarılı oturum açmadan sonra geçici ANTHBOT erişim belirteci ve kurulum için gereken sahip olunan biçici bilgileri, seri numarası dahil, en fazla 20 dakika yalnızca sunucunun geçici belleğinde tutulur. Seçilen biçici için verilen geçici AWS IoT kimlik bilgileri yalnızca etkin kurulum sırasında kullanılır ve kalıcı olarak saklanmaz. Hukuki dayanak, istenen hizmeti sağlamak için GDPR 6(1)(b)'dir.",installerPrivacyStore:"Kesinlikle işlevsel bir HttpOnly tarayıcı çerezi, yükleyiciden yapılan satın alımları tanır; böylece lisans anahtarının kopyalanması gerekmez. Reporting Server siparişle birlikte yalnızca türetilmiş opak istemci kimliğini saklar, çerez değerini değil. Kötüye kullanımı önlemek için kaynak IP, gizli anahtarlı kısa ömürlü bir hız sınırlama kimliği türetmek üzere bellekte kısa süre kullanılabilir; ham IP bu işlev tarafından saklanmaz. Dayanak GDPR 6(1)(f) kapsamındaki meşru menfaattir. Kimlik doğrulama ve biçici kontrol istekleri resmi ANTHBOT bulutuna gönderilir; kurulum komutu ANTHBOT'un AWS IoT altyapısı üzerinden iletilir."},
  th:{installerPrivacyTitle:"ตัวติดตั้งเสียง ANTHBOT บนเบราว์เซอร์แบบเลือกใช้",installerPrivacyCredentials:"หากคุณใช้ตัวติดตั้งบนเบราว์เซอร์ ชื่อผู้ใช้และรหัสผ่าน ANTHBOT จะถูกส่งผ่าน HTTPS มายัง Reporting Server นี้เพื่อเข้าสู่ระบบ API ทางการของ ANTHBOT เท่านั้น รหัสผ่านจะไม่ถูกเขียนลงดิสก์หรือฐานข้อมูล หลังเข้าสู่ระบบ โทเค็น ANTHBOT ชั่วคราวและข้อมูลเครื่องตัดหญ้าที่เป็นของบัญชีซึ่งจำเป็นต่อการติดตั้ง รวมถึงหมายเลขซีเรียล จะอยู่เฉพาะในหน่วยความจำชั่วคราวของเซิร์ฟเวอร์ไม่เกิน 20 นาที ข้อมูลรับรอง AWS IoT ชั่วคราวของเครื่องที่เลือกใช้เฉพาะระหว่างการติดตั้งและไม่ถูกเก็บถาวร ฐานทางกฎหมายคือ GDPR มาตรา 6(1)(b) เพื่อให้บริการติดตั้งที่ร้องขอ",installerPrivacyStore:"คุกกี้ HttpOnly ที่จำเป็นต่อการทำงานใช้เพื่อจดจำการซื้อจากตัวติดตั้ง จึงไม่ต้องคัดลอกคีย์ใบอนุญาต Reporting Server เก็บกับคำสั่งซื้อเฉพาะรหัสไคลเอนต์แบบทึบที่ได้มาจากคุกกี้ ไม่เก็บค่าคุกกี้เอง เพื่อป้องกันการใช้งานในทางที่ผิด IP ต้นทางอาจถูกใช้ชั่วคราวในหน่วยความจำเพื่อสร้างรหัสจำกัดอัตราแบบอายุสั้นด้วยคีย์ลับ ฟังก์ชันนี้ไม่เก็บ IP ดิบ ฐานคือผลประโยชน์โดยชอบด้วยกฎหมายตาม GDPR 6(1)(f) คำขอยืนยันตัวตนและควบคุมถูกส่งไปยังคลาวด์ทางการของ ANTHBOT และคำสั่งติดตั้งส่งผ่านโครงสร้างพื้นฐาน AWS IoT ของ ANTHBOT"},
  vi:{installerPrivacyTitle:"Trình cài giọng nói ANTHBOT tùy chọn trên trình duyệt",installerPrivacyCredentials:"Nếu bạn dùng trình cài trên trình duyệt, tên đăng nhập và mật khẩu ANTHBOT được gửi qua HTTPS tới Reporting Server này chỉ để đăng nhập API chính thức của ANTHBOT. Mật khẩu không được ghi vào đĩa hoặc cơ sở dữ liệu. Sau khi đăng nhập, token ANTHBOT tạm thời và dữ liệu máy cắt thuộc tài khoản cần cho cài đặt, gồm số sê-ri, chỉ ở trong bộ nhớ khả biến của máy chủ tối đa 20 phút. Thông tin xác thực AWS IoT tạm thời cho máy đã chọn chỉ được dùng trong lúc cài đặt đang hoạt động và không được lưu lâu dài. Cơ sở pháp lý là GDPR Điều 6(1)(b) để cung cấp dịch vụ được yêu cầu.",installerPrivacyStore:"Cookie HttpOnly hoàn toàn chức năng nhận biết giao dịch mua từ trình cài để bạn không cần sao chép khóa giấy phép. Reporting Server chỉ lưu cùng đơn hàng mã khách hàng mờ đã suy ra, không lưu giá trị cookie. Để chống lạm dụng, IP nguồn có thể được dùng ngắn hạn trong bộ nhớ để tạo mã giới hạn tốc độ ngắn hạn bằng khóa bí mật; chức năng này không lưu IP thô. Cơ sở là lợi ích hợp pháp theo GDPR Điều 6(1)(f). Yêu cầu xác thực và điều khiển được gửi tới đám mây chính thức ANTHBOT và lệnh cài đặt được chuyển qua hạ tầng AWS IoT của ANTHBOT."},
  ko:{installerPrivacyTitle:"선택형 브라우저 ANTHBOT 음성 설치기",installerPrivacyCredentials:"브라우저 음성 설치기를 사용하면 ANTHBOT 사용자 이름과 비밀번호가 공식 ANTHBOT API 로그인만을 위해 HTTPS를 통해 이 Reporting Server로 전송됩니다. 비밀번호는 디스크나 애플리케이션 데이터베이스에 기록되지 않습니다. 로그인 성공 후 임시 ANTHBOT 액세스 토큰과 설치에 필요한 소유자 잔디깎이 정보(일련번호 포함)는 최대 20분 동안 서버의 휘발성 메모리에만 유지됩니다. 선택한 잔디깎이에 발급된 임시 AWS IoT 자격 증명은 활성 설치 중에만 사용되며 지속적으로 저장되지 않습니다. 법적 근거는 요청된 설치 서비스를 제공하기 위한 GDPR 6(1)(b)입니다.",installerPrivacyStore:"엄격히 기능적인 HttpOnly 브라우저 쿠키로 설치기에서 이루어진 구매를 인식하여 라이선스 키를 복사할 필요가 없게 합니다. Reporting Server는 주문과 함께 파생된 불투명 클라이언트 ID만 저장하며 쿠키 값 자체는 저장하지 않습니다. 악용 방지를 위해 소스 IP를 메모리에서 잠시 사용해 비밀 키 기반의 단기 rate-limit ID를 만들 수 있으며 원본 IP는 이 기능에서 저장하지 않습니다. 근거는 GDPR 6(1)(f)에 따른 정당한 이익입니다. 인증 및 잔디깎이 제어 요청은 공식 ANTHBOT 클라우드로 전송되고 설치 명령은 ANTHBOT의 AWS IoT 인프라를 통해 전달됩니다."},
  km:{installerPrivacyTitle:"កម្មវិធីដំឡើងសំឡេង ANTHBOT តាម browser ជាជម្រើស",installerPrivacyCredentials:"បើអ្នកប្រើកម្មវិធីដំឡើងតាម browser ឈ្មោះអ្នកប្រើ និងពាក្យសម្ងាត់ ANTHBOT ត្រូវបានផ្ញើតាម HTTPS មក Reporting Server នេះសម្រាប់តែចូល API ផ្លូវការរបស់ ANTHBOT ប៉ុណ្ណោះ។ ពាក្យសម្ងាត់មិនត្រូវបានសរសេរទៅថាស ឬ database ទេ។ បន្ទាប់ពីចូលបាន token ANTHBOT បណ្តោះអាសន្ន និងព័ត៌មានម៉ាស៊ីនកាត់ស្មៅដែលជាកម្មសិទ្ធិ និងចាំបាច់សម្រាប់ដំឡើង រួមទាំងលេខ serial ត្រូវបានរក្សាទុកតែក្នុង memory បណ្តោះអាសន្នរបស់ server អតិបរមា 20 នាទី។ AWS IoT credentials បណ្តោះអាសន្នសម្រាប់ម៉ាស៊ីនដែលបានជ្រើសត្រូវប្រើតែក្នុងពេលដំឡើង និងមិនរក្សាទុកជាអចិន្ត្រៃយ៍។ មូលដ្ឋានច្បាប់គឺ GDPR 6(1)(b) សម្រាប់ផ្តល់សេវាដែលបានស្នើ។",installerPrivacyStore:"HttpOnly cookie ដែលចាំបាច់សម្រាប់មុខងារ ត្រូវប្រើដើម្បីស្គាល់ការទិញពីកម្មវិធីដំឡើង ដូច្នេះមិនចាំបាច់ចម្លង license key។ Reporting Server រក្សាទុកជាមួយការបញ្ជាទិញតែ opaque client ID ដែលបានបង្កើតពី cookie មិនរក្សាតម្លៃ cookie ផ្ទាល់ទេ។ សម្រាប់ការពារការបំពាន source IP អាចត្រូវប្រើបណ្តោះអាសន្នក្នុង memory ដើម្បីបង្កើត rate-limit ID អាយុខ្លីដោយ secret key ហើយ raw IP មិនត្រូវបានរក្សាទុកដោយមុខងារនេះទេ។ មូលដ្ឋានគឺ legitimate interest តាម GDPR 6(1)(f)។ សំណើ authentication និង control ត្រូវផ្ញើទៅ ANTHBOT cloud ផ្លូវការ ហើយពាក្យបញ្ជាដំឡើងត្រូវបញ្ជូនតាម AWS IoT infrastructure របស់ ANTHBOT។"}
};
for(const [lang,values] of Object.entries(INSTALLER_PRIVACY)){Object.assign(TEXT[lang]||TEXT.en,values);}

const ACCOUNT_PRIVACY={"en":{"accountPrivacyTitle":"Voice Store account and sign-in","accountPrivacyData":"For the Voice Store account we store the verified email address, an internal random user ID, the Stripe customer ID when available, purchased voice entitlements, and links between the account and explicitly paired ANTHBOT Map installations. Purchases are assigned to the internal user ID rather than to one browser.","accountPrivacySecurity":"Sign-in uses a six-digit one-time code sent by email. The code is stored only as a salted cryptographic hash and expires after 10 minutes. After successful verification, a strictly functional Secure, HttpOnly, SameSite=Lax cookie keeps the account signed in for up to 30 days; the server stores only a hash of the session token.","accountPrivacyRetention":"Account and entitlement data is processed to provide purchased digital products under GDPR Article 6(1)(b). Login security and abuse prevention are based on Article 6(1)(f). One-time codes and sessions are time-limited; account, order and entitlement records are retained while needed to provide purchased rights and meet applicable accounting, chargeback, fraud-prevention and legal-claim obligations."},"hu":{"accountPrivacyTitle":"Hangbolt-fiók és belépés","accountPrivacyData":"A Hangbolt-fiókhoz tároljuk az ellenőrzött e-mail-címet, egy belső véletlen felhasználói azonosítót, ha rendelkezésre áll a Stripe ügyfélazonosítót, a megvásárolt hangjogosultságokat, valamint a fiókhoz kifejezetten párosított ANTHBOT Map telepítések kapcsolatát. A vásárlásokat a belső felhasználói azonosítóhoz, nem egy adott böngészőhöz rendeljük.","accountPrivacySecurity":"A belépés e-mailben küldött, hatjegyű egyszer használatos kóddal történik. A kódot csak sózott kriptográfiai hash formájában tároljuk, és 10 perc után lejár. Sikeres ellenőrzés után egy szigorúan funkcionális Secure, HttpOnly, SameSite=Lax süti legfeljebb 30 napig fenntartja a bejelentkezést; a szerver a session tokenből is csak hash-t tárol.","accountPrivacyRetention":"A fiók- és jogosultsági adatokat a megvásárolt digitális termék biztosításához a GDPR 6. cikk (1) b) alapján kezeljük. A belépés biztonsága és a visszaélések megelőzése a 6. cikk (1) f) szerinti jogos érdeken alapul. Az egyszer használatos kódok és sessionök időben korlátozottak; a fiók-, rendelési és jogosultsági adatokat a megvásárolt jogok biztosításához, valamint az alkalmazandó számviteli, chargeback-, csalásmegelőzési és jogi igényérvényesítési kötelezettségekhez szükséges ideig őrizzük."},"de":{"accountPrivacyTitle":"Voice-Store-Konto und Anmeldung","accountPrivacyData":"Für das Voice-Store-Konto speichern wir die verifizierte E-Mail-Adresse, eine zufällige interne Benutzer-ID, soweit vorhanden die Stripe-Kunden-ID, gekaufte Sprachberechtigungen sowie Verknüpfungen zu ausdrücklich gekoppelten ANTHBOT-Map-Installationen. Käufe werden der internen Benutzer-ID und nicht einem einzelnen Browser zugeordnet.","accountPrivacySecurity":"Die Anmeldung erfolgt mit einem sechsstelligen Einmalcode per E-Mail. Der Code wird nur als gesalzener kryptografischer Hash gespeichert und läuft nach 10 Minuten ab. Nach erfolgreicher Prüfung hält ein funktionales Secure-, HttpOnly-, SameSite=Lax-Cookie die Anmeldung bis zu 30 Tage aufrecht; serverseitig wird nur ein Hash des Sitzungstokens gespeichert.","accountPrivacyRetention":"Konto- und Berechtigungsdaten werden zur Bereitstellung gekaufter digitaler Produkte nach Art. 6 Abs. 1 lit. b DSGVO verarbeitet. Anmeldesicherheit und Missbrauchsprävention beruhen auf Art. 6 Abs. 1 lit. f. Einmalcodes und Sitzungen sind zeitlich begrenzt; Konto-, Bestell- und Berechtigungsdaten bleiben nur so lange gespeichert, wie dies für erworbene Rechte und anwendbare Rechnungs-, Chargeback-, Betrugs- und Rechtsanspruchspflichten erforderlich ist."},"fr":{"accountPrivacyTitle":"Compte Voice Store et connexion","accountPrivacyData":"Pour le compte Voice Store, nous enregistrons l’adresse e-mail vérifiée, un identifiant utilisateur interne aléatoire, l’identifiant client Stripe lorsqu’il existe, les droits sur les voix achetées et les liens avec les installations ANTHBOT Map explicitement associées. Les achats sont rattachés à l’identifiant utilisateur interne et non à un navigateur particulier.","accountPrivacySecurity":"La connexion utilise un code à six chiffres à usage unique envoyé par e-mail. Le code n’est conservé que sous forme de hachage cryptographique salé et expire après 10 minutes. Après vérification, un cookie strictement fonctionnel Secure, HttpOnly, SameSite=Lax maintient la session jusqu’à 30 jours; le serveur ne conserve qu’un hachage du jeton de session.","accountPrivacyRetention":"Les données de compte et de droits sont traitées pour fournir les produits numériques achetés sur la base de l’article 6(1)(b) du RGPD. La sécurité de connexion et la prévention des abus reposent sur l’article 6(1)(f). Les codes et sessions sont limités dans le temps; les données de compte, commande et droits sont conservées aussi longtemps que nécessaire pour fournir les droits achetés et respecter les obligations applicables de comptabilité, rétrofacturation, lutte contre la fraude et défense des droits."},"es":{"accountPrivacyTitle":"Cuenta de Voice Store e inicio de sesión","accountPrivacyData":"Para la cuenta de Voice Store guardamos el correo verificado, un ID de usuario interno aleatorio, el ID de cliente de Stripe cuando exista, los derechos de voces compradas y los enlaces con instalaciones ANTHBOT Map asociadas expresamente. Las compras se vinculan al ID interno del usuario y no a un navegador concreto.","accountPrivacySecurity":"El acceso usa un código de seis dígitos de un solo uso enviado por correo. El código se almacena únicamente como hash criptográfico con sal y caduca a los 10 minutos. Tras verificarlo, una cookie funcional Secure, HttpOnly, SameSite=Lax mantiene la sesión hasta 30 días; el servidor solo guarda un hash del token de sesión.","accountPrivacyRetention":"Los datos de cuenta y derechos se tratan para proporcionar los productos digitales comprados conforme al artículo 6(1)(b) del RGPD. La seguridad de acceso y la prevención de abusos se basan en el artículo 6(1)(f). Los códigos y sesiones tienen duración limitada; los datos de cuenta, pedido y derechos se conservan mientras sean necesarios para prestar los derechos adquiridos y cumplir obligaciones aplicables de contabilidad, contracargos, prevención del fraude y reclamaciones legales."},"it":{"accountPrivacyTitle":"Account Voice Store e accesso","accountPrivacyData":"Per l’account Voice Store conserviamo l’indirizzo e-mail verificato, un ID utente interno casuale, l’ID cliente Stripe quando disponibile, i diritti sulle voci acquistate e i collegamenti con le installazioni ANTHBOT Map esplicitamente associate. Gli acquisti sono collegati all’ID utente interno e non a un singolo browser.","accountPrivacySecurity":"L’accesso usa un codice monouso di sei cifre inviato via e-mail. Il codice è memorizzato solo come hash crittografico con salt e scade dopo 10 minuti. Dopo la verifica, un cookie funzionale Secure, HttpOnly, SameSite=Lax mantiene l’accesso fino a 30 giorni; il server conserva solo l’hash del token di sessione.","accountPrivacyRetention":"I dati dell’account e dei diritti sono trattati per fornire i prodotti digitali acquistati ai sensi dell’articolo 6(1)(b) GDPR. La sicurezza dell’accesso e la prevenzione degli abusi si basano sull’articolo 6(1)(f). Codici e sessioni sono limitati nel tempo; dati di account, ordini e diritti sono conservati finché necessari per i diritti acquistati e per obblighi applicabili di contabilità, chargeback, antifrode e tutela legale."},"pt":{"accountPrivacyTitle":"Conta da Loja de Vozes e início de sessão","accountPrivacyData":"Na conta da Loja de Vozes guardamos o e-mail verificado, um ID interno aleatório de utilizador, o ID de cliente Stripe quando disponível, os direitos das vozes compradas e as ligações a instalações ANTHBOT Map expressamente associadas. As compras ficam ligadas ao ID interno do utilizador e não a um navegador específico.","accountPrivacySecurity":"O início de sessão usa um código único de seis dígitos enviado por e-mail. O código é guardado apenas como hash criptográfico com salt e expira ao fim de 10 minutos. Após a verificação, um cookie funcional Secure, HttpOnly, SameSite=Lax mantém a sessão até 30 dias; o servidor guarda apenas um hash do token de sessão.","accountPrivacyRetention":"Os dados da conta e dos direitos são tratados para fornecer os produtos digitais comprados ao abrigo do artigo 6(1)(b) do RGPD. A segurança de acesso e prevenção de abuso baseiam-se no artigo 6(1)(f). Códigos e sessões têm duração limitada; dados de conta, encomenda e direitos são mantidos enquanto necessários para fornecer os direitos adquiridos e cumprir obrigações aplicáveis de contabilidade, chargeback, prevenção de fraude e reivindicações legais."},"nl":{"accountPrivacyTitle":"Voice Store-account en aanmelden","accountPrivacyData":"Voor het Voice Store-account bewaren we het geverifieerde e-mailadres, een willekeurige interne gebruikers-ID, indien beschikbaar de Stripe-klant-ID, gekochte stemrechten en koppelingen met expliciet gekoppelde ANTHBOT Map-installaties. Aankopen worden aan de interne gebruikers-ID gekoppeld, niet aan één browser.","accountPrivacySecurity":"Aanmelden gebeurt met een zescijferige eenmalige code per e-mail. De code wordt alleen als gezouten cryptografische hash opgeslagen en verloopt na 10 minuten. Na verificatie houdt een functionele Secure-, HttpOnly-, SameSite=Lax-cookie de sessie maximaal 30 dagen actief; de server bewaart alleen een hash van het sessietoken.","accountPrivacyRetention":"Account- en rechtengegevens worden verwerkt om gekochte digitale producten te leveren op grond van AVG artikel 6(1)(b). Beveiliging en misbruikpreventie steunen op artikel 6(1)(f). Codes en sessies zijn tijdgebonden; account-, bestel- en rechtengegevens worden bewaard zolang nodig voor gekochte rechten en toepasselijke verplichtingen rond boekhouding, chargebacks, fraudepreventie en juridische claims."},"pl":{"accountPrivacyTitle":"Konto sklepu głosów i logowanie","accountPrivacyData":"Dla konta sklepu głosów przechowujemy zweryfikowany adres e-mail, losowy wewnętrzny identyfikator użytkownika, identyfikator klienta Stripe, jeśli jest dostępny, prawa do kupionych głosów oraz powiązania z wyraźnie sparowanymi instalacjami ANTHBOT Map. Zakupy są przypisywane do wewnętrznego ID użytkownika, a nie do jednej przeglądarki.","accountPrivacySecurity":"Logowanie odbywa się przy użyciu sześciocyfrowego kodu jednorazowego wysłanego e-mailem. Kod jest przechowywany wyłącznie jako solony hash kryptograficzny i wygasa po 10 minutach. Po weryfikacji funkcjonalny plik cookie Secure, HttpOnly, SameSite=Lax utrzymuje logowanie do 30 dni; serwer przechowuje tylko hash tokenu sesji.","accountPrivacyRetention":"Dane konta i uprawnień są przetwarzane w celu dostarczenia zakupionych produktów cyfrowych na podstawie art. 6 ust. 1 lit. b RODO. Bezpieczeństwo logowania i zapobieganie nadużyciom opiera się na art. 6 ust. 1 lit. f. Kody i sesje są ograniczone czasowo; dane kont, zamówień i uprawnień są przechowywane tak długo, jak to konieczne do realizacji zakupionych praw i obowiązków księgowych, chargeback, przeciwdziałania oszustwom i roszczeń prawnych."},"cs":{"accountPrivacyTitle":"Účet obchodu s hlasy a přihlášení","accountPrivacyData":"Pro účet obchodu s hlasy ukládáme ověřenou e-mailovou adresu, náhodné interní ID uživatele, je-li k dispozici ID zákazníka Stripe, zakoupená hlasová oprávnění a vazby na výslovně spárované instalace ANTHBOT Map. Nákupy jsou přiřazeny k internímu ID uživatele, nikoli k jednomu prohlížeči.","accountPrivacySecurity":"Přihlášení používá šestimístný jednorázový kód zaslaný e-mailem. Kód se ukládá pouze jako solený kryptografický hash a platí 10 minut. Po ověření udržuje funkční cookie Secure, HttpOnly, SameSite=Lax přihlášení až 30 dní; server ukládá pouze hash tokenu relace.","accountPrivacyRetention":"Údaje účtu a oprávnění zpracováváme za účelem poskytnutí zakoupených digitálních produktů podle čl. 6 odst. 1 písm. b GDPR. Bezpečnost přihlášení a prevence zneužití vychází z čl. 6 odst. 1 písm. f. Kódy a relace jsou časově omezené; údaje o účtu, objednávkách a oprávněních se uchovávají po dobu potřebnou pro zakoupená práva a příslušné účetní, chargeback, protifraudní a právní povinnosti."},"sk":{"accountPrivacyTitle":"Účet obchodu s hlasmi a prihlásenie","accountPrivacyData":"Pre účet obchodu s hlasmi ukladáme overenú e-mailovú adresu, náhodné interné ID používateľa, ak je dostupné ID zákazníka Stripe, zakúpené hlasové oprávnenia a väzby na výslovne spárované inštalácie ANTHBOT Map. Nákupy sú priradené k internému ID používateľa, nie k jednému prehliadaču.","accountPrivacySecurity":"Prihlásenie používa šesťmiestny jednorazový kód odoslaný e-mailom. Kód sa ukladá iba ako solený kryptografický hash a platí 10 minút. Po overení udržiava funkčný cookie Secure, HttpOnly, SameSite=Lax prihlásenie až 30 dní; server ukladá iba hash session tokenu.","accountPrivacyRetention":"Údaje účtu a oprávnení spracúvame na poskytovanie zakúpených digitálnych produktov podľa čl. 6 ods. 1 písm. b GDPR. Bezpečnosť prihlásenia a prevencia zneužitia sa opiera o čl. 6 ods. 1 písm. f. Kódy a sessiony sú časovo obmedzené; údaje účtu, objednávok a oprávnení sa uchovávajú tak dlho, ako je potrebné pre zakúpené práva a príslušné účtovné, chargeback, protifraudné a právne povinnosti."},"ro":{"accountPrivacyTitle":"Cont Magazin Voci și autentificare","accountPrivacyData":"Pentru contul Magazin Voci stocăm adresa de e-mail verificată, un ID intern aleatoriu de utilizator, ID-ul clientului Stripe când este disponibil, drepturile vocilor cumpărate și legăturile cu instalările ANTHBOT Map asociate explicit. Cumpărăturile sunt legate de ID-ul intern al utilizatorului, nu de un singur browser.","accountPrivacySecurity":"Autentificarea folosește un cod unic de șase cifre trimis prin e-mail. Codul este stocat doar ca hash criptografic cu salt și expiră după 10 minute. După verificare, un cookie funcțional Secure, HttpOnly, SameSite=Lax menține sesiunea până la 30 de zile; serverul păstrează doar hash-ul tokenului de sesiune.","accountPrivacyRetention":"Datele contului și drepturilor sunt prelucrate pentru furnizarea produselor digitale cumpărate conform art. 6(1)(b) GDPR. Securitatea autentificării și prevenirea abuzului se bazează pe art. 6(1)(f). Codurile și sesiunile sunt limitate în timp; datele de cont, comandă și drepturi sunt păstrate cât este necesar pentru drepturile cumpărate și obligațiile aplicabile de contabilitate, chargeback, antifraudă și pretenții legale."},"da":{"accountPrivacyTitle":"Voice Store-konto og login","accountPrivacyData":"Til Voice Store-kontoen gemmer vi den bekræftede e-mailadresse, et tilfældigt internt bruger-id, Stripe-kunde-id når det findes, købte stemmerettigheder og forbindelser til udtrykkeligt parrede ANTHBOT Map-installationer. Køb knyttes til det interne bruger-id og ikke til én bestemt browser.","accountPrivacySecurity":"Login bruger en sekscifret engangskode sendt via e-mail. Koden gemmes kun som en saltet kryptografisk hash og udløber efter 10 minutter. Efter bekræftelse holder en funktionel Secure-, HttpOnly-, SameSite=Lax-cookie sessionen aktiv i op til 30 dage; serveren gemmer kun en hash af sessionstokenet.","accountPrivacyRetention":"Konto- og rettighedsdata behandles for at levere købte digitale produkter efter GDPR artikel 6, stk. 1, litra b. Loginsikkerhed og misbrugsforebyggelse bygger på litra f. Koder og sessioner er tidsbegrænsede; konto-, ordre- og rettighedsdata opbevares så længe det er nødvendigt for købte rettigheder og relevante regnskabs-, chargeback-, svindel- og retskravsforpligtelser."},"sv":{"accountPrivacyTitle":"Voice Store-konto och inloggning","accountPrivacyData":"För Voice Store-kontot lagrar vi den verifierade e-postadressen, ett slumpmässigt internt användar-ID, Stripe-kund-ID när det finns, köpta rösträttigheter och länkar till uttryckligen parkopplade ANTHBOT Map-installationer. Köp kopplas till det interna användar-ID:t och inte till en viss webbläsare.","accountPrivacySecurity":"Inloggning använder en sexsiffrig engångskod som skickas via e-post. Koden lagras endast som en saltad kryptografisk hash och löper ut efter 10 minuter. Efter verifiering håller en funktionell Secure-, HttpOnly-, SameSite=Lax-cookie sessionen aktiv i upp till 30 dagar; servern lagrar endast en hash av sessionstokenet.","accountPrivacyRetention":"Konto- och rättighetsdata behandlas för att tillhandahålla köpta digitala produkter enligt GDPR artikel 6.1 b. Inloggningssäkerhet och förebyggande av missbruk bygger på artikel 6.1 f. Koder och sessioner är tidsbegränsade; konto-, order- och rättighetsdata sparas så länge det behövs för köpta rättigheter och tillämpliga bokförings-, chargeback-, bedrägeri- och rättsliga skyldigheter."},"no":{"accountPrivacyTitle":"Voice Store-konto og innlogging","accountPrivacyData":"For Voice Store-kontoen lagrer vi den bekreftede e-postadressen, en tilfeldig intern bruker-ID, Stripe-kunde-ID når tilgjengelig, kjøpte stemmerettigheter og koblinger til uttrykkelig parede ANTHBOT Map-installasjoner. Kjøp knyttes til den interne bruker-ID-en, ikke til én nettleser.","accountPrivacySecurity":"Innlogging bruker en sekssifret engangskode sendt på e-post. Koden lagres bare som en saltet kryptografisk hash og utløper etter 10 minutter. Etter bekreftelse holder en funksjonell Secure-, HttpOnly-, SameSite=Lax-cookie innloggingen aktiv i opptil 30 dager; serveren lagrer bare en hash av sesjonstokenet.","accountPrivacyRetention":"Konto- og rettighetsdata behandles for å levere kjøpte digitale produkter etter GDPR artikkel 6(1)(b). Innloggingssikkerhet og misbruksforebygging bygger på artikkel 6(1)(f). Koder og sesjoner er tidsbegrenset; konto-, ordre- og rettighetsdata beholdes så lenge det er nødvendig for kjøpte rettigheter og relevante regnskaps-, chargeback-, svindel- og rettskravsforpliktelser."},"fi":{"accountPrivacyTitle":"Voice Store -tili ja kirjautuminen","accountPrivacyData":"Voice Store -tiliä varten tallennamme vahvistetun sähköpostiosoitteen, satunnaisen sisäisen käyttäjätunnisteen, Stripe-asiakastunnisteen silloin kun se on saatavilla, ostettujen äänten käyttöoikeudet sekä nimenomaisesti paritettujen ANTHBOT Map -asennusten yhteydet tiliin. Ostot liitetään sisäiseen käyttäjätunnisteeseen, eivät yhteen selaimeen.","accountPrivacySecurity":"Kirjautuminen käyttää sähköpostilla lähetettävää kuusinumeroista kertakäyttökoodia. Koodi tallennetaan vain suolattuna kryptografisena tiivisteenä ja vanhenee 10 minuutissa. Vahvistuksen jälkeen toiminnallinen Secure-, HttpOnly-, SameSite=Lax-eväste pitää kirjautumisen voimassa enintään 30 päivää; palvelin tallentaa vain istuntotunnuksen tiivisteen.","accountPrivacyRetention":"Tili- ja käyttöoikeustietoja käsitellään ostettujen digitaalisten tuotteiden toimittamiseksi GDPR 6(1)(b) artiklan perusteella. Kirjautumisturva ja väärinkäytön esto perustuvat 6(1)(f) artiklaan. Koodit ja istunnot ovat määräaikaisia; tili-, tilaus- ja käyttöoikeustietoja säilytetään niin kauan kuin ostetut oikeudet sekä sovellettavat kirjanpito-, takaisinperintä-, petostorjunta- ja oikeusvaadevelvoitteet edellyttävät."},"zh-CN":{"accountPrivacyTitle":"Voice Store 账户与登录","accountPrivacyData":"对于 Voice Store 账户，我们会保存已验证的电子邮箱、随机生成的内部用户 ID、可用时的 Stripe 客户 ID、已购买语音的权益，以及与明确配对的 ANTHBOT Map 安装之间的关联。购买记录绑定到内部用户 ID，而不是某一个浏览器。","accountPrivacySecurity":"登录使用通过电子邮件发送的 6 位一次性验证码。验证码仅以加盐的加密哈希形式保存，并在 10 分钟后过期。验证成功后，严格用于功能的 Secure、HttpOnly、SameSite=Lax Cookie 可保持登录最长 30 天；服务器只保存会话令牌的哈希。","accountPrivacyRetention":"账户和权益数据依据 GDPR 第 6(1)(b) 条用于提供已购买的数字产品。登录安全和防滥用依据第 6(1)(f) 条的合法利益。验证码和会话均有时间限制；账户、订单和权益记录仅在提供购买权益及履行适用的会计、拒付、反欺诈和法律索赔义务所需期间保存。"},"zh-TW":{"accountPrivacyTitle":"Voice Store 帳戶與登入","accountPrivacyData":"對於 Voice Store 帳戶，我們會保存已驗證的電子郵件、隨機產生的內部使用者 ID、可用時的 Stripe 客戶 ID、已購買語音的權益，以及與明確配對的 ANTHBOT Map 安裝之間的關聯。購買記錄綁定到內部使用者 ID，而不是某一個瀏覽器。","accountPrivacySecurity":"登入使用透過電子郵件傳送的 6 位一次性驗證碼。驗證碼只以加鹽的加密雜湊形式保存，並在 10 分鐘後失效。驗證成功後，嚴格功能用途的 Secure、HttpOnly、SameSite=Lax Cookie 可維持登入最長 30 天；伺服器只保存 session token 的雜湊。","accountPrivacyRetention":"帳戶和權益資料依 GDPR 第 6(1)(b) 條用於提供已購買的數位產品。登入安全與防止濫用依第 6(1)(f) 條合法利益。驗證碼與 session 均有時間限制；帳戶、訂單與權益資料僅在提供購買權益以及履行適用的會計、拒付、反詐欺和法律請求義務所需期間保存。"},"tr":{"accountPrivacyTitle":"Voice Store hesabı ve oturum açma","accountPrivacyData":"Voice Store hesabı için doğrulanmış e-posta adresini, rastgele bir dahili kullanıcı kimliğini, mevcut olduğunda Stripe müşteri kimliğini, satın alınan ses haklarını ve açıkça eşleştirilmiş ANTHBOT Map kurulumlarıyla bağlantıları saklarız. Satın almalar belirli bir tarayıcıya değil dahili kullanıcı kimliğine bağlanır.","accountPrivacySecurity":"Oturum açma, e-posta ile gönderilen altı haneli tek kullanımlık kodla yapılır. Kod yalnızca tuzlanmış kriptografik hash olarak saklanır ve 10 dakika sonra sona erer. Doğrulamadan sonra işlevsel Secure, HttpOnly, SameSite=Lax çerezi oturumu 30 güne kadar açık tutar; sunucu yalnızca oturum tokeninin hashini saklar.","accountPrivacyRetention":"Hesap ve hak verileri, satın alınan dijital ürünleri sağlamak için GDPR 6(1)(b) uyarınca işlenir. Giriş güvenliği ve kötüye kullanımın önlenmesi 6(1)(f) meşru menfaate dayanır. Kodlar ve oturumlar süre sınırlıdır; hesap, sipariş ve hak kayıtları satın alınan hakları sağlamak ve uygulanabilir muhasebe, ters ibraz, dolandırıcılık önleme ve hukuki talep yükümlülükleri için gerektiği sürece tutulur."},"th":{"accountPrivacyTitle":"บัญชี Voice Store และการเข้าสู่ระบบ","accountPrivacyData":"สำหรับบัญชี Voice Store เราจัดเก็บอีเมลที่ยืนยันแล้ว รหัสผู้ใช้ภายในแบบสุ่ม รหัสลูกค้า Stripe เมื่อมี สิทธิ์ของเสียงที่ซื้อ และการเชื่อมโยงกับ ANTHBOT Map ที่จับคู่อย่างชัดเจน การซื้อผูกกับรหัสผู้ใช้ภายใน ไม่ใช่เบราว์เซอร์เครื่องใดเครื่องหนึ่ง","accountPrivacySecurity":"การเข้าสู่ระบบใช้รหัสครั้งเดียว 6 หลักที่ส่งทางอีเมล รหัสจะถูกเก็บเฉพาะในรูปแฮชเข้ารหัสแบบใส่ salt และหมดอายุหลัง 10 นาที หลังยืนยัน คุกกี้เพื่อการทำงานแบบ Secure, HttpOnly, SameSite=Lax จะคงการเข้าสู่ระบบได้นานสูงสุด 30 วัน โดยเซิร์ฟเวอร์เก็บเพียงแฮชของ session token","accountPrivacyRetention":"ข้อมูลบัญชีและสิทธิ์ถูกประมวลผลเพื่อให้บริการผลิตภัณฑ์ดิจิทัลที่ซื้อ ตาม GDPR มาตรา 6(1)(b) ความปลอดภัยในการเข้าสู่ระบบและการป้องกันการใช้งานในทางที่ผิดอาศัยมาตรา 6(1)(f) รหัสและ session มีระยะเวลาจำกัด; ข้อมูลบัญชี คำสั่งซื้อ และสิทธิ์จะเก็บเท่าที่จำเป็นต่อสิทธิ์ที่ซื้อและภาระด้านบัญชี chargeback การป้องกันการฉ้อโกง และข้อเรียกร้องทางกฎหมายที่เกี่ยวข้อง"},"vi":{"accountPrivacyTitle":"Tài khoản Voice Store và đăng nhập","accountPrivacyData":"Đối với tài khoản Voice Store, chúng tôi lưu địa chỉ email đã xác minh, ID người dùng nội bộ ngẫu nhiên, ID khách hàng Stripe khi có, quyền đối với các giọng đã mua và liên kết với các cài đặt ANTHBOT Map được ghép nối rõ ràng. Giao dịch mua được gắn với ID người dùng nội bộ chứ không phải một trình duyệt cụ thể.","accountPrivacySecurity":"Đăng nhập dùng mã một lần 6 chữ số gửi qua email. Mã chỉ được lưu dưới dạng hash mật mã có salt và hết hạn sau 10 phút. Sau khi xác minh, cookie chức năng Secure, HttpOnly, SameSite=Lax duy trì đăng nhập tối đa 30 ngày; máy chủ chỉ lưu hash của session token.","accountPrivacyRetention":"Dữ liệu tài khoản và quyền được xử lý để cung cấp sản phẩm số đã mua theo GDPR Điều 6(1)(b). Bảo mật đăng nhập và phòng chống lạm dụng dựa trên Điều 6(1)(f). Mã và session bị giới hạn thời gian; dữ liệu tài khoản, đơn hàng và quyền được giữ trong thời gian cần thiết để cung cấp quyền đã mua và đáp ứng nghĩa vụ kế toán, chargeback, chống gian lận và khiếu nại pháp lý áp dụng."},"ko":{"accountPrivacyTitle":"Voice Store 계정 및 로그인","accountPrivacyData":"Voice Store 계정을 위해 확인된 이메일 주소, 임의의 내부 사용자 ID, 사용 가능한 경우 Stripe 고객 ID, 구매한 음성 권한 및 명시적으로 페어링된 ANTHBOT Map 설치와의 연결을 저장합니다. 구매 내역은 특정 브라우저가 아니라 내부 사용자 ID에 연결됩니다.","accountPrivacySecurity":"로그인은 이메일로 전송되는 6자리 일회용 코드를 사용합니다. 코드는 salted 암호화 해시로만 저장되며 10분 후 만료됩니다. 확인 후 기능상 필요한 Secure, HttpOnly, SameSite=Lax 쿠키가 최대 30일 동안 로그인을 유지하며 서버에는 session token의 해시만 저장됩니다.","accountPrivacyRetention":"계정 및 권한 데이터는 구매한 디지털 제품을 제공하기 위해 GDPR 제6조(1)(b)에 따라 처리됩니다. 로그인 보안 및 오용 방지는 제6조(1)(f)의 정당한 이익에 근거합니다. 코드와 session은 시간 제한이 있으며 계정, 주문 및 권한 기록은 구매 권한 제공과 적용되는 회계, chargeback, 사기 방지 및 법적 청구 의무에 필요한 기간 동안 보관됩니다."},"km":{"accountPrivacyTitle":"គណនី Voice Store និងការចូល","accountPrivacyData":"សម្រាប់គណនី Voice Store យើងរក្សាទុកអ៊ីមែលដែលបានផ្ទៀងផ្ទាត់ លេខសម្គាល់អ្នកប្រើខាងក្នុងបង្កើតចៃដន្យ Stripe customer ID នៅពេលមាន សិទ្ធិសំឡេងដែលបានទិញ និងការភ្ជាប់ទៅ ANTHBOT Map ដែលបានផ្គូផ្គងយ៉ាងច្បាស់។ ការទិញត្រូវភ្ជាប់ទៅ user ID ខាងក្នុង មិនមែន browser តែមួយទេ។","accountPrivacySecurity":"ការចូលប្រើកូដមួយដង 6 ខ្ទង់ដែលផ្ញើតាមអ៊ីមែល។ កូដត្រូវរក្សាទុកតែជា salted cryptographic hash ហើយផុតកំណត់ក្រោយ 10 នាទី។ បន្ទាប់ពីផ្ទៀងផ្ទាត់ cookie មុខងារ Secure, HttpOnly, SameSite=Lax រក្សាការចូលរហូតដល់ 30 ថ្ងៃ; server រក្សាទុកតែ hash នៃ session token។","accountPrivacyRetention":"ទិន្នន័យគណនី និងសិទ្ធិ ត្រូវបានដំណើរការដើម្បីផ្តល់ផលិតផលឌីជីថលដែលបានទិញតាម GDPR Article 6(1)(b)។ សុវត្ថិភាពការចូល និងការការពារការប្រើប្រាស់ខុស ផ្អែកលើ Article 6(1)(f)។ កូដ និង session មានកំណត់ពេល; ទិន្នន័យគណនី ការបញ្ជាទិញ និងសិទ្ធិ ត្រូវរក្សាទុកតែរយៈពេលចាំបាច់សម្រាប់សិទ្ធិដែលបានទិញ និងកាតព្វកិច្ចគណនេយ្យ chargeback ការពារការក្លែងបន្លំ និងទាមទារផ្លូវច្បាប់។"}};
for(const [lang,values] of Object.entries(ACCOUNT_PRIVACY)){Object.assign(TEXT[lang]||TEXT.en,values);}

const SUPPORTED=["hu","en","de","fr","es","it","pt","nl","pl","cs","sk","ro","da","sv","no","fi","zh-CN","zh-TW","tr","th","vi","ko","km"];
const BASE_BODY=COMMON_BODY.en;
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function bodyFor(lang){return COMMON_BODY[lang]||COMMON_BODY.en;}
function applyLanguage(lang){
  if(!SUPPORTED.includes(lang))lang="en";
  document.documentElement.lang=lang;
  const t=TEXT[lang]||TEXT.en;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(t[k])el.textContent=t[k];});
  document.getElementById("policy-body").innerHTML=bodyFor(lang);
  document.title=t.title+" | MQB Retrofit Hungary";
  document.getElementById("site-language").value=lang;
  const select=document.getElementById("request-type");
  const values=["access","rectification","erasure","restriction","portability","objection","withdraw_consent","complaint","other"];
  select.innerHTML=values.map((v,i)=>'<option value="'+v+'">'+escapeHtml(t.types[i])+'</option>').join("");
  try{localStorage.setItem("mqb-site-language",lang)}catch(_){}
}
function initialLanguage(){
  let saved="";try{saved=localStorage.getItem("mqb-site-language")||""}catch(_){}
  if(SUPPORTED.includes(saved))return saved;
  const raw=navigator.language||"en";
  if(SUPPORTED.includes(raw))return raw;
  const short=raw.slice(0,2).toLowerCase();
  return SUPPORTED.includes(short)?short:"en";
}
document.getElementById("site-language").addEventListener("change",e=>applyLanguage(e.target.value));
document.getElementById("privacy-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const t=TEXT[document.documentElement.lang]||TEXT.en;
  const btn=document.getElementById("request-submit");
  const status=document.getElementById("request-status");
  const payload={request_type:document.getElementById("request-type").value,contact:document.getElementById("request-contact").value.trim(),details:document.getElementById("request-details").value.trim(),site_language:document.documentElement.lang||"en"};
  btn.disabled=true;btn.textContent=t.sending;status.className="status";status.textContent="";
  try{
    const res=await fetch("/api/anthbot/privacy-requests",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.detail||("HTTP "+res.status));
    status.className="status good";status.textContent=t.sent.replace("{id}",data.request_id||"");
    document.getElementById("request-details").value="";
  }catch(err){status.className="status bad";status.textContent=t.error+": "+err.message}
  finally{btn.disabled=false;btn.textContent=t.requestSubmit}
});
applyLanguage(initialLanguage());
</script>
