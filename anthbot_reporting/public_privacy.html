<h2>1. Controller and scope</h2><p>The controller for this website, the ANTHBOT Community Voice Store and the ANTHBOT Reporting Server is the operator identified above. This notice covers purchases, licenses and entitlements, custom voice requests, support, the public website, and optional ANTHBOT Map reporting and diagnostics.</p>
<h2>2. Personal data and sources</h2><p><strong>Purchases:</strong> we may store Stripe Checkout/session and payment identifiers, Stripe customer identifier, customer email supplied through Checkout, selected voice pack, amount, currency, payment/refund status, timestamps and an opaque ANTHBOT Map client identifier. The Map bearer token itself is not stored; the server derives an opaque identifier from it.</p><p><strong>Custom voice and support requests:</strong> requested language, voice style, mower model, contact details, notes, site language and correspondence.</p><p><strong>Optional reporting:</strong> only when enabled/submitted, a random installation UUID, integration and Home Assistant versions, country if supplied, device/model counts, event timestamps and diagnostic report contents. Credential-like field names are rejected by the reporting server.</p><p><strong>Website:</strong> the selected language may be stored locally in the browser. The application database does not intentionally store visitor IP addresses, although hosting, network or security providers may process ordinary connection metadata transiently.</p><p>Data comes from you, your ANTHBOT Map installation, and Stripe in connection with a payment.</p>
<h2>3. Purposes and legal bases</h2><ul><li>Providing purchased digital products, licenses, downloads and support: GDPR Article 6(1)(b), performance of a contract or steps requested before a contract.</li><li>Accounting, tax, legal and regulatory duties: Article 6(1)(c), legal obligation.</li><li>Service security, fraud/abuse prevention and protection of systems and claims: Article 6(1)(f), legitimate interests, limited to what is necessary and balanced against user rights.</li><li>Optional ANTHBOT Map usage reporting or diagnostics where consent is requested: Article 6(1)(a), consent. Consent may be withdrawn at any time for future processing without affecting prior lawful processing.</li></ul>
<h2>4. Payments, recipients and international transfers</h2><p>Payments are handled by Stripe. The Reporting Server does not receive or store full payment-card data. For EEA services, Stripe Payments Europe Limited may act as processor and/or independent controller depending on the activity, including payment, fraud, risk and compliance functions. Stripe and necessary affiliates/service providers may process data outside the EEA using applicable safeguards such as adequacy decisions, the EU-U.S. Data Privacy Framework where applicable, and EU Standard Contractual Clauses.</p><p>Other recipients are limited to infrastructure/hosting/network/security providers needed to operate the service, professional advisers where necessary, and public authorities where disclosure is legally required. Personal data is not sold for advertising.</p>
<h2>5. Retention</h2><ul><li>Temporary Map pairing codes expire after 7 days. The local Map bearer token is not stored by the Reporting Server.</li><li>Order and entitlement records are retained while necessary to provide the purchased digital entitlement and for applicable accounting, tax, chargeback, fraud-prevention and legal-claim periods. Core entitlement identifiers may be kept while the purchased entitlement remains active.</li><li>Custom voice/support requests are retained until the request and reasonable follow-up are completed, then deleted or anonymised when no longer needed for contract, legal or claim purposes.</li><li>Optional telemetry and diagnostics are retained only while needed for the opted-in reporting/development purpose, security and issue investigation, and may be deleted on a valid request unless a legal ground requires continued retention.</li><li>Privacy-rights requests may be retained as necessary to process the request and demonstrate compliance.</li></ul>
<h2>6. Your rights</h2><p>Subject to the GDPR and applicable exceptions, you may request access, rectification, erasure, restriction, portability and may object to processing based on legitimate interests. Where processing is based on consent, you may withdraw consent at any time. Requests are answered without undue delay and normally within one month; the period may be extended where the GDPR allows it. Identity verification may be requested where reasonably necessary.</p>
<h2>7. Required or optional data; automated decisions</h2><p>Payment and contact information needed to complete a purchase or requested service is contractual/pre-contractual; without it the transaction or service may not be completed. Optional ANTHBOT reporting/diagnostics is not required to use the core integration. The Reporting Server does not make decisions based solely on automated processing that produce legal or similarly significant effects. Stripe may perform its own fraud/risk checks under its own privacy information.</p>
<h2>8. Complaints and changes</h2><p>You may contact the controller first using the details above or the rights-request form below. You also have the right to lodge a complaint with the Hungarian supervisory authority: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; postal address: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; phone: +36 (1) 391-1400.</p><p>This notice may be updated when the service, providers or legal requirements change. The current version and update date are published on this page.</p>`,

<h2>2. Kezelt személyes adatok és forrásuk</h2><p><strong>Vásárlások:</strong> tárolhatjuk a Stripe Checkout/session és fizetési azonosítókat, a Stripe ügyfélazonosítót, a Checkout során megadott ügyfél-emailt, a kiválasztott hangcsomagot, összeget, pénznemet, fizetési/visszatérítési állapotot, időbélyegeket és egy átlátszatlan ANTHBOT Map kliensazonosítót. A Map titkos bearer tokenjét a Reporting Server nem tárolja; abból csak egy átlátszatlan azonosítót képez.</p><p><strong>Egyedi hang- és támogatási kérések:</strong> kért nyelv, hangkarakter, robotmodell, kapcsolati adatok, megjegyzés, webhely nyelve és a kapcsolódó kommunikáció.</p><p><strong>Opcionális jelentés:</strong> csak bekapcsolás/beküldés esetén véletlenszerű telepítési UUID, integráció- és Home Assistant-verzió, megadott ország, eszköz- és modellszámok, esemény-időbélyegek és diagnosztikai jelentés tartalma. A Reporting Server a hitelesítő adatokra utaló mezőneveket elutasítja.</p><p><strong>Weboldal:</strong> a kiválasztott nyelvet a böngésző helyben megjegyezheti. Az alkalmazás adatbázisa szándékosan nem tárol látogatói IP-címeket, ugyanakkor a tárhely-, hálózati vagy biztonsági szolgáltatók a szokásos kapcsolati metaadatokat átmenetileg kezelhetik.</p><p>Az adatok forrása te magad, az ANTHBOT Map telepítésed, illetve fizetés esetén a Stripe.</p>

<h2>4. Fizetés, címzettek és nemzetközi adattovábbítás</h2><p>A fizetést a Stripe kezeli. A Reporting Server nem kapja meg és nem tárolja a teljes bankkártyaadatokat. Az EGT-ben a Stripe Payments Europe Limited a konkrét művelettől függően adatfeldolgozóként és/vagy önálló adatkezelőként járhat el, többek között fizetési, csalásmegelőzési, kockázati és megfelelési feladatok során. A Stripe és szükséges kapcsolt vállalkozásai/szolgáltatói az EGT-n kívül is kezelhetnek adatot, megfelelő garanciák – például megfelelőségi határozat, adott esetben EU–USA Adatvédelmi Keret, illetve uniós általános szerződési feltételek – alkalmazásával.</p><p>További címzettek csak a szolgáltatáshoz szükséges infrastruktúra-, tárhely-, hálózati és biztonsági szolgáltatók, szükség esetén szakmai tanácsadók, valamint jogszabály alapján hatóságok. Személyes adatot reklámcélú értékesítésre nem adunk el.</p>
<h2>5. Megőrzési idők és szempontok</h2><ul><li>Az ideiglenes Map párosítási kód 7 nap után lejár. A helyi Map bearer tokent a Reporting Server nem tárolja.</li><li>A rendelési és jogosultsági adatokat addig őrizzük, amíg az szükséges a megvásárolt digitális jogosultság biztosításához, továbbá az alkalmazandó számviteli, adózási, chargeback-, csalásmegelőzési és jogi igényérvényesítési időszakokig. A jogosultság alapazonosítói a megvásárolt jogosultság fennállásáig megőrizhetők.</li><li>Az egyedi hang- és támogatási kéréseket a kérés és az ésszerű utókövetés lezárásáig kezeljük, ezt követően töröljük vagy anonimizáljuk, ha szerződéses, jogi vagy igényérvényesítési cél már nem indokolja a megőrzést.</li><li>Az opcionális telemetria és diagnosztika csak az engedélyezett jelentési/fejlesztési célhoz, biztonsághoz és hibavizsgálathoz szükséges ideig marad meg, és érvényes törlési kérelemre törölhető, ha más jogalap nem követeli meg a további megőrzést.</li><li>Az adatvédelmi joggyakorlási kérelmek a kérelem intézéséhez és a megfelelés igazolásához szükséges ideig megőrizhetők.</li></ul>
<h2>6. Érintetti jogaid</h2><p>A GDPR és az alkalmazandó kivételek szerint kérheted a hozzáférést, helyesbítést, törlést, az adatkezelés korlátozását, az adathordozhatóságot, és tiltakozhatsz a jogos érdeken alapuló adatkezelés ellen. Hozzájáruláson alapuló adatkezelésnél a hozzájárulást bármikor visszavonhatod. A kérelmekre indokolatlan késedelem nélkül, főszabály szerint egy hónapon belül válaszolunk; a GDPR által megengedett esetekben ez meghosszabbítható. Szükség esetén ésszerű személyazonosság-ellenőrzést kérhetünk.</p>
<h2>7. Kötelező és opcionális adatok; automatizált döntés</h2><p>A vásárláshoz vagy kért szolgáltatáshoz szükséges fizetési és kapcsolati adatok szerződéses/szerződéskötést megelőző adatok; nélkülük a tranzakció vagy szolgáltatás nem teljesíthető. Az opcionális ANTHBOT jelentés/diagnosztika nem feltétele az integráció alapfunkcióinak. A Reporting Server nem hoz kizárólag automatizált adatkezelésen alapuló, joghatással vagy hasonlóan jelentős hatással járó döntést. A Stripe saját tájékoztatója szerint saját csalás- és kockázatértékelést végezhet.</p>
<h2>8. Panasz és módosítások</h2><p>Elsőként kapcsolatba léphetsz az adatkezelővel a fenti elérhetőségeken vagy az alábbi joggyakorlási űrlapon. Emellett panaszt tehetsz a magyar felügyeleti hatóságnál: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11.; levelezési cím: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; telefon: +36 (1) 391-1400.</p><p>A tájékoztatót a szolgáltatás, a szolgáltatók vagy a jogi követelmények változásakor frissíthetjük. Az aktuális verzió és frissítési dátum ezen az oldalon található.</p>`

<h2>3. Zwecke und Rechtsgrundlagen</h2><ul><li>Bereitstellung gekaufter digitaler Produkte, Lizenzen, Downloads und Support: Art. 6 Abs. 1 lit. b DSGVO.</li><li>Rechnungs-, Steuer-, Rechts- und Behördenpflichten: Art. 6 Abs. 1 lit. c.</li><li>Sicherheit, Betrugs-/Missbrauchsprävention und Schutz von Systemen/Rechtsansprüchen: Art. 6 Abs. 1 lit. f, berechtigtes Interesse, nur soweit erforderlich.</li><li>Optionale Nutzungsberichte oder Diagnosen bei abgefragter Einwilligung: Art. 6 Abs. 1 lit. a. Einwilligung kann jederzeit für die Zukunft widerrufen werden.</li></ul>
<h2>4. Zahlungen, Empfänger und internationale Übermittlungen</h2><p>Zahlungen werden von Stripe verarbeitet. Der Reporting Server erhält oder speichert keine vollständigen Kartendaten. Im EWR kann Stripe Payments Europe Limited je nach Tätigkeit Auftragsverarbeiter und/oder eigenständiger Verantwortlicher sein, etwa für Zahlung, Betrugsbekämpfung, Risiko und Compliance. Stripe und notwendige verbundene Unternehmen/Dienstleister können Daten außerhalb des EWR unter geeigneten Garantien wie Angemessenheitsbeschlüssen, dem EU-US Data Privacy Framework soweit anwendbar und EU-Standardvertragsklauseln verarbeiten.</p><p>Weitere Empfänger sind nur erforderliche Hosting-, Infrastruktur-, Netzwerk- und Sicherheitsanbieter, erforderlichenfalls Berater sowie Behörden bei gesetzlicher Pflicht. Personenbezogene Daten werden nicht für Werbung verkauft.</p>
<h2>5. Speicherdauer</h2><ul><li>Temporäre Map-Pairing-Codes laufen nach 7 Tagen ab; das lokale Bearer-Token wird nicht gespeichert.</li><li>Bestell- und Berechtigungsdaten werden solange aufbewahrt, wie dies für die digitale Berechtigung sowie gesetzliche Rechnungs-/Steuer-, Chargeback-, Betrugs- und Rechtsanspruchsfristen erforderlich ist. Kernkennungen können während der aktiven Berechtigung bestehen bleiben.</li><li>Individuelle Sprach-/Supportanfragen werden bis zur Erledigung und angemessenen Nachbearbeitung aufbewahrt und danach gelöscht oder anonymisiert, wenn kein Vertrags-, Rechts- oder Anspruchszweck mehr besteht.</li><li>Optionale Telemetrie/Diagnosen bleiben nur solange erhalten, wie sie für den zugestimmten Entwicklungs-, Sicherheits- oder Fehleranalysezweck nötig sind, und können auf gültigen Antrag gelöscht werden, sofern keine andere Rechtsgrundlage entgegensteht.</li><li>Datenschutzanfragen können zur Bearbeitung und zum Nachweis der Compliance aufbewahrt werden.</li></ul>
<h2>6. Ihre Rechte</h2><p>Nach DSGVO und anwendbaren Ausnahmen können Sie Auskunft, Berichtigung, Löschung, Einschränkung und Datenübertragbarkeit verlangen und der Verarbeitung aufgrund berechtigter Interessen widersprechen. Einwilligungen können jederzeit widerrufen werden. Anfragen werden unverzüglich und grundsätzlich innerhalb eines Monats beantwortet; zulässige Verlängerungen bleiben vorbehalten. Eine angemessene Identitätsprüfung kann verlangt werden.</p>
<h2>7. Erforderliche oder freiwillige Daten; automatisierte Entscheidungen</h2><p>Für Kauf oder angeforderte Leistung notwendige Zahlungs- und Kontaktdaten sind vertraglich/vorvertraglich erforderlich; ohne sie kann die Leistung nicht erbracht werden. Optionale ANTHBOT-Berichte/Diagnosen sind keine Voraussetzung für die Kernintegration. Der Reporting Server trifft keine ausschließlich automatisierten Entscheidungen mit rechtlicher oder ähnlich erheblicher Wirkung. Stripe kann eigene Betrugs-/Risikoprüfungen nach seinen Datenschutzinformationen durchführen.</p>
<h2>8. Beschwerden und Änderungen</h2><p>Sie können zuerst den Verantwortlichen über die oben genannten Kontaktdaten oder das Formular unten kontaktieren. Sie können sich außerdem an die ungarische Aufsichtsbehörde wenden: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; Postanschrift: 1363 Budapest, Pf. 9.; E-Mail: ugyfelszolgalat@naih.hu; Telefon: +36 (1) 391-1400.</p><p>Diese Erklärung kann bei Änderungen des Dienstes, der Anbieter oder rechtlicher Anforderungen aktualisiert werden. Die aktuelle Fassung und das Datum stehen auf dieser Seite.</p>`,
fr:`
<h2>1. Responsable et champ d’application</h2><p>Le responsable du traitement de ce site, de la boutique vocale ANTHBOT Community et de l’ANTHBOT Reporting Server est l’opérateur identifié ci-dessus. La présente notice couvre les achats, licences et droits d’accès, demandes de voix personnalisées, assistance, site public ainsi que les rapports et diagnostics ANTHBOT Map facultatifs.</p>
<h2>2. Données personnelles et sources</h2><p><strong>Achats :</strong> identifiants Stripe Checkout/session et paiement, identifiant client Stripe, e-mail fourni lors du paiement, pack vocal choisi, montant, devise, statut paiement/remboursement, horodatages et identifiant client ANTHBOT Map opaque. Le jeton bearer local de Map n’est pas stocké.</p><p><strong>Voix personnalisée et assistance :</strong> langue demandée, style de voix, modèle du robot, coordonnées, notes, langue du site et communications.</p><p><strong>Rapports facultatifs :</strong> uniquement s’ils sont activés/envoyés : UUID d’installation aléatoire, versions de l’intégration et de Home Assistant, pays s’il est fourni, nombres d’appareils/modèles, horodatages et contenu des diagnostics. Les champs ressemblant à des identifiants sensibles sont rejetés.</p><p><strong>Site :</strong> la langue choisie peut être enregistrée localement dans le navigateur. La base applicative ne stocke pas volontairement les adresses IP des visiteurs, mais les prestataires d’hébergement, réseau ou sécurité peuvent traiter temporairement les métadonnées de connexion ordinaires.</p><p>Les données proviennent de vous, de votre installation ANTHBOT Map et de Stripe pour les paiements.</p>
<h2>3. Finalités et bases juridiques</h2><ul><li>Fourniture des produits numériques, licences, téléchargements et assistance : art. 6(1)(b) RGPD.</li><li>Obligations comptables, fiscales, juridiques et réglementaires : art. 6(1)(c).</li><li>Sécurité, prévention de la fraude/abus et défense des systèmes ou droits : art. 6(1)(f), intérêt légitime limité au nécessaire.</li><li>Rapports d’utilisation/diagnostics facultatifs lorsque le consentement est demandé : art. 6(1)(a). Le consentement peut être retiré à tout moment pour l’avenir.</li></ul>
<h2>4. Paiements, destinataires et transferts internationaux</h2><p>Les paiements sont traités par Stripe. Le Reporting Server ne reçoit ni ne stocke les données complètes de carte. Dans l’EEE, Stripe Payments Europe Limited peut agir comme sous-traitant et/ou responsable indépendant selon l’activité, notamment paiement, fraude, risque et conformité. Stripe et les affiliés/prestataires nécessaires peuvent traiter des données hors EEE avec des garanties appropriées telles que décisions d’adéquation, EU-US Data Privacy Framework lorsqu’applicable et clauses contractuelles types de l’UE.</p><p>Les autres destinataires sont limités aux prestataires nécessaires d’hébergement, infrastructure, réseau et sécurité, aux conseillers si nécessaire et aux autorités lorsque la loi l’exige. Les données personnelles ne sont pas vendues à des fins publicitaires.</p>
<h2>5. Conservation</h2><ul><li>Les codes temporaires d’association Map expirent après 7 jours ; le jeton bearer local n’est pas stocké.</li><li>Les données de commande et de droits sont conservées aussi longtemps que nécessaire pour fournir le droit numérique acheté et respecter les délais applicables comptables, fiscaux, de rétrofacturation, de lutte contre la fraude et de réclamation. Les identifiants essentiels peuvent être conservés tant que le droit reste actif.</li><li>Les demandes de voix personnalisées/support sont conservées jusqu’à leur traitement et suivi raisonnable, puis supprimées ou anonymisées lorsqu’elles ne sont plus nécessaires.</li><li>La télémétrie et les diagnostics facultatifs ne sont conservés que le temps nécessaire aux finalités consenties de développement, sécurité ou investigation et peuvent être supprimés sur demande valide sauf autre base légale.</li><li>Les demandes relatives aux droits peuvent être conservées pour leur traitement et la preuve de conformité.</li></ul>
<h2>6. Vos droits</h2><p>Sous réserve du RGPD et des exceptions applicables, vous pouvez demander l’accès, la rectification, l’effacement, la limitation et la portabilité et vous opposer aux traitements fondés sur l’intérêt légitime. Vous pouvez retirer votre consentement à tout moment. Les demandes sont traitées sans retard injustifié et normalement dans un délai d’un mois ; une prolongation permise par le RGPD est possible. Une vérification raisonnable d’identité peut être demandée.</p>
<h2>7. Données obligatoires ou facultatives ; décisions automatisées</h2><p>Les données de paiement et de contact nécessaires à un achat ou service demandé sont contractuelles/précontractuelles ; sans elles, la transaction ou le service peut être impossible. Les rapports/diagnostics ANTHBOT facultatifs ne conditionnent pas l’intégration principale. Le Reporting Server ne prend pas de décision exclusivement automatisée produisant des effets juridiques ou similaires importants. Stripe peut effectuer ses propres contrôles fraude/risque selon sa politique.</p>
<h2>8. Réclamations et modifications</h2><p>Vous pouvez d’abord contacter le responsable via les coordonnées ci-dessus ou le formulaire ci-dessous. Vous pouvez aussi saisir l’autorité hongroise : <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11 ; adresse postale : 1363 Budapest, Pf. 9. ; e-mail : ugyfelszolgalat@naih.hu ; téléphone : +36 (1) 391-1400.</p><p>Cette notice peut être mise à jour si le service, les prestataires ou les exigences légales changent. La version actuelle et sa date sont publiées ici.</p>`,
es:`
<h2>1. Responsable y ámbito</h2><p>El responsable de este sitio, la tienda de voces ANTHBOT Community y el ANTHBOT Reporting Server es el operador identificado arriba. Este aviso cubre compras, licencias y derechos, solicitudes de voz personalizada, soporte, sitio público y los informes/diagnósticos opcionales de ANTHBOT Map.</p>
<h2>2. Datos personales y fuentes</h2><p><strong>Compras:</strong> identificadores de Stripe Checkout/sesión y pago, identificador de cliente Stripe, email facilitado en Checkout, pack elegido, importe, moneda, estado de pago/reembolso, marcas de tiempo e identificador opaco de cliente ANTHBOT Map. El token bearer local de Map no se almacena.</p><p><strong>Voz personalizada y soporte:</strong> idioma solicitado, estilo de voz, modelo de robot, contacto, notas, idioma del sitio y comunicaciones.</p><p><strong>Informes opcionales:</strong> solo si se activan/envían: UUID aleatorio de instalación, versiones de integración y Home Assistant, país si se facilita, recuentos de dispositivos/modelos, marcas de tiempo y contenido de diagnóstico. Se rechazan campos con nombres similares a credenciales.</p><p><strong>Sitio:</strong> el idioma elegido puede guardarse localmente en el navegador. La base de datos de la aplicación no guarda deliberadamente IP de visitantes, aunque proveedores de alojamiento, red o seguridad pueden procesar temporalmente metadatos normales de conexión.</p><p>Los datos proceden de ti, de tu instalación ANTHBOT Map y de Stripe cuando hay un pago.</p>
<h2>3. Finalidades y bases jurídicas</h2><ul><li>Entrega de productos digitales, licencias, descargas y soporte: art. 6(1)(b) RGPD.</li><li>Obligaciones contables, fiscales, legales y regulatorias: art. 6(1)(c).</li><li>Seguridad, prevención de fraude/abuso y defensa de sistemas o reclamaciones: art. 6(1)(f), interés legítimo limitado a lo necesario.</li><li>Informes/diagnósticos opcionales cuando se solicita consentimiento: art. 6(1)(a). El consentimiento puede retirarse en cualquier momento para el futuro.</li></ul>
<h2>4. Pagos, destinatarios y transferencias internacionales</h2><p>Stripe procesa los pagos. El Reporting Server no recibe ni almacena los datos completos de la tarjeta. En el EEE, Stripe Payments Europe Limited puede actuar como encargado y/o responsable independiente según la actividad, incluidas funciones de pago, fraude, riesgo y cumplimiento. Stripe y los afiliados/proveedores necesarios pueden tratar datos fuera del EEE con garantías como decisiones de adecuación, EU-US Data Privacy Framework cuando proceda y cláusulas contractuales tipo de la UE.</p><p>Otros destinatarios se limitan a proveedores necesarios de infraestructura, alojamiento, red y seguridad, asesores cuando sea necesario y autoridades cuando la ley lo exija. No vendemos datos personales para publicidad.</p>
<h2>5. Conservación</h2><ul><li>Los códigos temporales de emparejamiento Map caducan a los 7 días; el token bearer local no se almacena.</li><li>Los registros de pedido y derechos se conservan mientras sean necesarios para proporcionar el derecho digital comprado y cumplir plazos contables, fiscales, de contracargo, antifraude y de reclamaciones. Los identificadores esenciales pueden mantenerse mientras el derecho esté activo.</li><li>Las solicitudes de voz/soporte se conservan hasta su resolución y seguimiento razonable y después se eliminan o anonimizan cuando ya no sean necesarias.</li><li>Telemetría y diagnósticos opcionales se conservan solo mientras sean necesarios para las finalidades consentidas de desarrollo, seguridad o investigación y pueden eliminarse mediante solicitud válida salvo otra base legal.</li><li>Las solicitudes de derechos pueden conservarse para tramitarlas y demostrar cumplimiento.</li></ul>
<h2>6. Tus derechos</h2><p>Conforme al RGPD y sus excepciones puedes solicitar acceso, rectificación, supresión, limitación y portabilidad y oponerte al tratamiento basado en interés legítimo. Puedes retirar el consentimiento en cualquier momento. Respondemos sin demora indebida y normalmente en un mes; puede ampliarse cuando el RGPD lo permita. Puede solicitarse una verificación razonable de identidad.</p>
<h2>7. Datos obligatorios u opcionales; decisiones automatizadas</h2><p>Los datos de pago/contacto necesarios para una compra o servicio son contractuales/precontractuales; sin ellos puede no ser posible completar la operación. Los informes/diagnósticos ANTHBOT opcionales no son necesarios para usar la integración principal. El Reporting Server no adopta decisiones exclusivamente automatizadas con efectos jurídicos o similares significativos. Stripe puede realizar controles propios de fraude/riesgo.</p>
<h2>8. Reclamaciones y cambios</h2><p>Puedes contactar primero con el responsable mediante los datos anteriores o el formulario. También puedes reclamar ante la autoridad húngara: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; correo postal: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; teléfono: +36 (1) 391-1400.</p><p>Este aviso puede actualizarse cuando cambien el servicio, los proveedores o las exigencias legales. La versión y fecha vigentes se publican aquí.</p>`,
it:`
<h2>1. Titolare e ambito</h2><p>Il titolare di questo sito, del negozio voci ANTHBOT Community e dell’ANTHBOT Reporting Server è l’operatore indicato sopra. L’informativa copre acquisti, licenze e autorizzazioni, richieste di voce personalizzata, assistenza, sito pubblico e reporting/diagnostica ANTHBOT Map opzionali.</p>
<h2>2. Dati personali e fonti</h2><p><strong>Acquisti:</strong> identificativi Stripe Checkout/sessione e pagamento, identificativo cliente Stripe, email fornita nel Checkout, pacchetto scelto, importo, valuta, stato pagamento/rimborso, timestamp e identificativo opaco del client ANTHBOT Map. Il bearer token locale di Map non viene memorizzato.</p><p><strong>Voce personalizzata e supporto:</strong> lingua richiesta, stile voce, modello robot, contatti, note, lingua del sito e comunicazioni.</p><p><strong>Reporting opzionale:</strong> solo se attivato/inviato: UUID casuale dell’installazione, versioni integrazione e Home Assistant, paese se fornito, conteggi dispositivi/modelli, timestamp e contenuti diagnostici. I campi con nomi simili a credenziali vengono rifiutati.</p><p><strong>Sito:</strong> la lingua scelta può essere salvata localmente nel browser. Il database applicativo non memorizza intenzionalmente gli IP dei visitatori, ma fornitori di hosting, rete o sicurezza possono trattare temporaneamente normali metadati di connessione.</p><p>I dati provengono da te, dalla tua installazione ANTHBOT Map e da Stripe per i pagamenti.</p>
<h2>3. Finalità e basi giuridiche</h2><ul><li>Fornitura di prodotti digitali acquistati, licenze, download e supporto: art. 6(1)(b) GDPR.</li><li>Obblighi contabili, fiscali, legali e regolamentari: art. 6(1)(c).</li><li>Sicurezza, prevenzione frodi/abusi e tutela di sistemi o pretese: art. 6(1)(f), legittimo interesse limitato al necessario.</li><li>Reporting/diagnostica opzionali quando è richiesto il consenso: art. 6(1)(a). Il consenso può essere revocato in qualsiasi momento per il futuro.</li></ul>
<h2>4. Pagamenti, destinatari e trasferimenti internazionali</h2><p>I pagamenti sono gestiti da Stripe. Il Reporting Server non riceve né conserva i dati completi della carta. Nel SEE, Stripe Payments Europe Limited può agire come responsabile e/o titolare autonomo a seconda dell’attività, comprese funzioni di pagamento, frode, rischio e conformità. Stripe e necessari affiliati/fornitori possono trattare dati fuori dal SEE con garanzie quali decisioni di adeguatezza, EU-US Data Privacy Framework quando applicabile e clausole contrattuali standard UE.</p><p>Altri destinatari sono limitati a fornitori necessari di infrastruttura, hosting, rete e sicurezza, consulenti quando necessario e autorità quando la legge lo impone. I dati personali non sono venduti per pubblicità.</p>
<h2>5. Conservazione</h2><ul><li>I codici temporanei di pairing Map scadono dopo 7 giorni; il bearer token locale non viene memorizzato.</li><li>I dati di ordine e autorizzazione sono conservati finché necessari per fornire il diritto digitale acquistato e rispettare periodi contabili, fiscali, chargeback, antifrode e di tutela legale. Gli identificativi essenziali possono restare finché il diritto è attivo.</li><li>Richieste voce/supporto sono conservate fino alla chiusura e ragionevole seguito, poi eliminate o anonimizzate quando non più necessarie.</li><li>Telemetria/diagnostica opzionali sono conservate solo finché necessarie per finalità consentite di sviluppo, sicurezza o indagine e possono essere cancellate su richiesta valida salvo altra base giuridica.</li><li>Le richieste privacy possono essere conservate per gestirle e dimostrare la conformità.</li></ul>
<h2>6. I tuoi diritti</h2><p>Salve le eccezioni GDPR, puoi chiedere accesso, rettifica, cancellazione, limitazione, portabilità e opporti ai trattamenti basati sul legittimo interesse. Puoi revocare il consenso in qualsiasi momento. Le richieste sono gestite senza ingiustificato ritardo e normalmente entro un mese; sono possibili proroghe consentite dal GDPR. Può essere richiesta una ragionevole verifica dell’identità.</p>
<h2>7. Dati obbligatori o facoltativi; decisioni automatizzate</h2><p>I dati di pagamento/contatto necessari per acquisto o servizio sono contrattuali/precontrattuali; senza di essi la transazione può non essere completata. Reporting/diagnostica ANTHBOT opzionali non sono necessari per le funzioni principali. Il Reporting Server non prende decisioni esclusivamente automatizzate con effetti giuridici o analogamente significativi. Stripe può effettuare proprie verifiche frode/rischio.</p>
<h2>8. Reclami e modifiche</h2><p>Puoi contattare prima il titolare con i dati sopra o il modulo. Puoi anche presentare reclamo all’autorità ungherese: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; indirizzo postale: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; telefono: +36 (1) 391-1400.</p><p>L’informativa può essere aggiornata se cambiano servizio, fornitori o requisiti di legge. Versione e data correnti sono pubblicate qui.</p>`,

nl:`
<h2>1. Verantwoordelijke en reikwijdte</h2><p>De verantwoordelijke voor deze website, de ANTHBOT Community Voice Store en de ANTHBOT Reporting Server is de hierboven vermelde exploitant. Deze verklaring geldt voor aankopen, licenties en rechten, verzoeken om aangepaste stemmen, support, de openbare website en optionele ANTHBOT Map-rapportage en diagnostiek.</p>
<h2>2. Persoonsgegevens en bronnen</h2><p><strong>Aankopen:</strong> we kunnen Stripe Checkout-/sessie- en betalings-ID's, Stripe-klant-ID, het tijdens Checkout opgegeven e-mailadres, gekozen stem, bedrag, valuta, betaal-/terugbetalingsstatus, tijdstempels en een afgeschermde ANTHBOT Map-client-ID bewaren. Het lokale Map bearer-token zelf wordt niet opgeslagen.</p><p><strong>Aangepaste stem en support:</strong> gevraagde taal, stemstijl, robotmodel, contactgegevens, notities, sitetaal en communicatie.</p><p><strong>Optionele rapportage:</strong> alleen wanneer ingeschakeld/verzonden: willekeurige installatie-UUID, integratie- en Home Assistant-versies, land indien opgegeven, aantallen apparaten/modellen, tijdstempels en diagnostische inhoud. Velden met namen die op inloggegevens lijken worden geweigerd.</p><p><strong>Website:</strong> de gekozen taal kan lokaal in de browser worden opgeslagen. De applicatiedatabase slaat niet bewust bezoekers-IP-adressen op; hosting-, netwerk- of beveiligingsproviders kunnen gewone verbindingsmetadata tijdelijk verwerken.</p><p>Gegevens komen van u, uw ANTHBOT Map-installatie en Stripe in verband met betalingen.</p>
<h2>3. Doeleinden en rechtsgronden</h2><ul><li>Leveren van gekochte digitale producten, licenties, downloads en support: AVG art. 6(1)(b).</li><li>Boekhoudkundige, fiscale, juridische en wettelijke verplichtingen: art. 6(1)(c).</li><li>Beveiliging, fraude-/misbruikpreventie en bescherming van systemen of rechtsvorderingen: art. 6(1)(f), gerechtvaardigd belang, beperkt tot wat nodig is.</li><li>Optionele gebruiksrapportage/diagnostiek wanneer toestemming wordt gevraagd: art. 6(1)(a). Toestemming kan te allen tijde voor de toekomst worden ingetrokken.</li></ul>
<h2>4. Betalingen, ontvangers en internationale doorgiften</h2><p>Betalingen worden door Stripe verwerkt. De Reporting Server ontvangt of bewaart geen volledige kaartgegevens. In de EER kan Stripe Payments Europe Limited, afhankelijk van de activiteit, verwerker en/of zelfstandige verwerkingsverantwoordelijke zijn, onder meer voor betaling, fraude, risico en compliance. Stripe en noodzakelijke gelieerde ondernemingen/dienstverleners kunnen gegevens buiten de EER verwerken met passende waarborgen, zoals adequaatheidsbesluiten, het EU-US Data Privacy Framework waar toepasselijk en EU-modelcontractbepalingen.</p><p>Andere ontvangers zijn beperkt tot noodzakelijke infrastructuur-, hosting-, netwerk- en beveiligingsproviders, professionele adviseurs waar nodig en overheidsinstanties indien wettelijk verplicht. Persoonsgegevens worden niet verkocht voor reclame.</p>
<h2>5. Bewaartermijnen</h2><ul><li>Tijdelijke Map-koppelcodes verlopen na 7 dagen; het lokale bearer-token wordt niet opgeslagen.</li><li>Bestel- en rechtgegevens worden bewaard zolang nodig om het gekochte digitale recht te leveren en voor toepasselijke boekhoud-, belasting-, chargeback-, antifraude- en juridische termijnen. Kern-ID's kunnen blijven zolang het recht actief is.</li><li>Verzoeken om aangepaste stemmen/support worden bewaard tot afhandeling en redelijke opvolging en daarna verwijderd of geanonimiseerd wanneer ze niet langer nodig zijn.</li><li>Optionele telemetrie/diagnostiek wordt alleen bewaard zolang nodig voor de toegestane ontwikkelings-, beveiligings- of onderzoeksdoelen en kan op geldig verzoek worden verwijderd tenzij een andere rechtsgrond bewaring vereist.</li><li>Privacyverzoeken kunnen worden bewaard om het verzoek af te handelen en naleving aan te tonen.</li></ul>
<h2>6. Uw rechten</h2><p>Onder de AVG en toepasselijke uitzonderingen kunt u inzage, rectificatie, wissing, beperking en overdraagbaarheid vragen en bezwaar maken tegen verwerking op grond van gerechtvaardigd belang. Toestemming kan te allen tijde worden ingetrokken. Verzoeken worden zonder onnodige vertraging en normaal binnen één maand beantwoord; verlenging is mogelijk waar de AVG dat toestaat. Redelijke identiteitscontrole kan worden gevraagd.</p>
<h2>7. Verplichte of optionele gegevens; geautomatiseerde besluiten</h2><p>Betaal- en contactgegevens die nodig zijn voor een aankoop of gevraagde dienst zijn contractueel/precontractueel; zonder die gegevens kan de transactie of dienst niet worden uitgevoerd. Optionele ANTHBOT-rapportage/diagnostiek is niet vereist voor de kernintegratie. De Reporting Server neemt geen uitsluitend geautomatiseerde beslissingen met juridische of vergelijkbaar aanzienlijke gevolgen. Stripe kan eigen fraude-/risicocontroles uitvoeren.</p>
<h2>8. Klachten en wijzigingen</h2><p>U kunt eerst contact opnemen met de verantwoordelijke via de gegevens hierboven of het formulier. U kunt ook een klacht indienen bij de Hongaarse toezichthouder: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; postadres: 1363 Budapest, Pf. 9.; e-mail: ugyfelszolgalat@naih.hu; telefoon: +36 (1) 391-1400.</p><p>Deze verklaring kan worden bijgewerkt als de dienst, providers of wettelijke eisen veranderen. De actuele versie en datum staan op deze pagina.</p>`,
pl:`
<h2>1. Administrator i zakres</h2><p>Administratorem tej witryny, sklepu głosów ANTHBOT Community i ANTHBOT Reporting Server jest operator wskazany powyżej. Informacja obejmuje zakupy, licencje i uprawnienia, zamówienia głosu niestandardowego, wsparcie, publiczną witrynę oraz opcjonalne raportowanie i diagnostykę ANTHBOT Map.</p>
<h2>2. Dane osobowe i źródła</h2><p><strong>Zakupy:</strong> możemy przechowywać identyfikatory Stripe Checkout/sesji i płatności, identyfikator klienta Stripe, email podany w Checkout, wybrany pakiet głosowy, kwotę, walutę, status płatności/zwrotu, znaczniki czasu oraz niejawny identyfikator klienta ANTHBOT Map. Lokalny bearer token Map nie jest przechowywany.</p><p><strong>Głos niestandardowy i wsparcie:</strong> żądany język, styl głosu, model robota, dane kontaktowe, notatki, język strony i korespondencja.</p><p><strong>Opcjonalne raportowanie:</strong> tylko po włączeniu/wysłaniu: losowy UUID instalacji, wersje integracji i Home Assistant, kraj jeśli podany, liczby urządzeń/modeli, znaczniki czasu i treść diagnostyki. Pola o nazwach sugerujących dane uwierzytelniające są odrzucane.</p><p><strong>Witryna:</strong> wybrany język może być zapisany lokalnie w przeglądarce. Baza aplikacji nie przechowuje celowo adresów IP odwiedzających, choć dostawcy hostingu, sieci lub bezpieczeństwa mogą tymczasowo przetwarzać zwykłe metadane połączenia.</p><p>Dane pochodzą od Ciebie, z instalacji ANTHBOT Map oraz od Stripe przy płatności.</p>
<h2>3. Cele i podstawy prawne</h2><ul><li>Dostarczenie zakupionych produktów cyfrowych, licencji, pobrań i wsparcia: art. 6 ust. 1 lit. b RODO.</li><li>Obowiązki księgowe, podatkowe, prawne i regulacyjne: art. 6 ust. 1 lit. c.</li><li>Bezpieczeństwo, zapobieganie oszustwom/nadużyciom i ochrona systemów lub roszczeń: art. 6 ust. 1 lit. f, prawnie uzasadniony interes ograniczony do niezbędnego zakresu.</li><li>Opcjonalne raportowanie/diagnostyka, gdy prosimy o zgodę: art. 6 ust. 1 lit. a. Zgodę można wycofać w każdej chwili na przyszłość.</li></ul>
<h2>4. Płatności, odbiorcy i transfery międzynarodowe</h2><p>Płatności obsługuje Stripe. Reporting Server nie otrzymuje ani nie zapisuje pełnych danych karty. W EOG Stripe Payments Europe Limited może działać jako podmiot przetwarzający i/lub niezależny administrator zależnie od czynności, m.in. płatności, oszustw, ryzyka i zgodności. Stripe i niezbędni partnerzy/usługodawcy mogą przetwarzać dane poza EOG z odpowiednimi zabezpieczeniami, np. decyzjami o adekwatności, EU-US Data Privacy Framework tam, gdzie ma zastosowanie, oraz standardowymi klauzulami umownymi UE.</p><p>Inni odbiorcy są ograniczeni do niezbędnych dostawców infrastruktury, hostingu, sieci i bezpieczeństwa, doradców w razie potrzeby oraz organów publicznych, gdy wymaga tego prawo. Danych osobowych nie sprzedajemy do celów reklamowych.</p>
<h2>5. Okres przechowywania</h2><ul><li>Tymczasowe kody parowania Map wygasają po 7 dniach; lokalny bearer token nie jest przechowywany.</li><li>Dane zamówień i uprawnień są przechowywane tak długo, jak potrzeba do zapewnienia zakupionego prawa cyfrowego oraz przez wymagane okresy księgowe, podatkowe, chargeback, antyfraudowe i dochodzenia roszczeń. Podstawowe identyfikatory mogą pozostać przez czas aktywności uprawnienia.</li><li>Wnioski o głos niestandardowy/wsparcie są przechowywane do zakończenia sprawy i rozsądnego dalszego kontaktu, a następnie usuwane lub anonimizowane, gdy nie są już potrzebne.</li><li>Opcjonalna telemetria/diagnostyka pozostaje tylko tak długo, jak jest potrzebna do zaakceptowanych celów rozwoju, bezpieczeństwa lub analizy i może być usunięta na ważny wniosek, o ile inna podstawa prawna nie wymaga dalszego przechowywania.</li><li>Wnioski dotyczące praw mogą być przechowywane w celu ich obsługi i wykazania zgodności.</li></ul>
<h2>6. Twoje prawa</h2><p>Z zastrzeżeniem RODO i wyjątków możesz żądać dostępu, sprostowania, usunięcia, ograniczenia, przenoszenia oraz sprzeciwić się przetwarzaniu opartemu na prawnie uzasadnionym interesie. Zgodę można wycofać w każdej chwili. Odpowiadamy bez zbędnej zwłoki, zwykle w ciągu miesiąca; możliwe są przedłużenia przewidziane w RODO. Możemy poprosić o rozsądną weryfikację tożsamości.</p>
<h2>7. Dane wymagane lub opcjonalne; decyzje automatyczne</h2><p>Dane płatnicze/kontaktowe potrzebne do zakupu lub usługi są umowne/przedumowne; bez nich transakcja lub usługa może nie być możliwa. Opcjonalne raportowanie/diagnostyka ANTHBOT nie jest wymagane do korzystania z podstawowej integracji. Reporting Server nie podejmuje wyłącznie zautomatyzowanych decyzji o skutkach prawnych lub podobnie istotnych. Stripe może prowadzić własne kontrole oszustw/ryzyka.</p>
<h2>8. Skargi i zmiany</h2><p>Najpierw możesz skontaktować się z administratorem poprzez dane powyżej lub formularz. Możesz także złożyć skargę do węgierskiego organu: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; adres pocztowy: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; telefon: +36 (1) 391-1400.</p><p>Informacja może zostać zaktualizowana, gdy zmieni się usługa, dostawcy lub wymagania prawne. Aktualna wersja i data są publikowane na tej stronie.</p>`,
cs:`
<h2>1. Správce a rozsah</h2><p>Správcem tohoto webu, obchodu s hlasy ANTHBOT Community a ANTHBOT Reporting Serveru je provozovatel uvedený výše. Toto oznámení se vztahuje na nákupy, licence a oprávnění, požadavky na vlastní hlas, podporu, veřejný web a volitelné hlášení a diagnostiku ANTHBOT Map.</p>
<h2>2. Osobní údaje a zdroje</h2><p><strong>Nákupy:</strong> můžeme ukládat identifikátory Stripe Checkout/session a plateb, Stripe customer ID, email zadaný v Checkout, vybraný hlasový balíček, částku, měnu, stav platby/refundu, časová razítka a neprůhledný identifikátor klienta ANTHBOT Map. Lokální bearer token Map se neukládá.</p><p><strong>Vlastní hlas a podpora:</strong> požadovaný jazyk, styl hlasu, model robota, kontaktní údaje, poznámky, jazyk webu a komunikace.</p><p><strong>Volitelné hlášení:</strong> pouze po zapnutí/odeslání: náhodné instalační UUID, verze integrace a Home Assistant, země pokud je uvedena, počty zařízení/modelů, časová razítka a diagnostický obsah. Pole s názvy podobnými přihlašovacím údajům server odmítá.</p><p><strong>Web:</strong> zvolený jazyk může být uložen lokálně v prohlížeči. Databáze aplikace záměrně neukládá IP adresy návštěvníků; hostingové, síťové či bezpečnostní služby mohou dočasně zpracovat běžná metadata spojení.</p><p>Údaje pocházejí od vás, z vaší instalace ANTHBOT Map a od Stripe v souvislosti s platbou.</p>
<h2>3. Účely a právní základy</h2><ul><li>Poskytování zakoupených digitálních produktů, licencí, stažení a podpory: čl. 6 odst. 1 písm. b GDPR.</li><li>Účetní, daňové, právní a regulační povinnosti: čl. 6 odst. 1 písm. c.</li><li>Bezpečnost, prevence podvodů/zneužití a ochrana systémů či nároků: čl. 6 odst. 1 písm. f, oprávněný zájem omezený na nezbytné.</li><li>Volitelné hlášení/diagnostika při vyžádání souhlasu: čl. 6 odst. 1 písm. a. Souhlas lze kdykoli odvolat do budoucna.</li></ul>
<h2>4. Platby, příjemci a mezinárodní předávání</h2><p>Platby zpracovává Stripe. Reporting Server nepřijímá ani neukládá úplné údaje platební karty. V EHP může Stripe Payments Europe Limited podle činnosti vystupovat jako zpracovatel a/nebo samostatný správce, včetně plateb, podvodů, rizik a compliance. Stripe a nezbytné propojené společnosti/dodavatelé mohou zpracovávat data mimo EHP s odpovídajícími zárukami, např. rozhodnutími o odpovídající ochraně, EU-US Data Privacy Framework tam, kde se použije, a standardními smluvními doložkami EU.</p><p>Další příjemci jsou omezeni na nezbytné poskytovatele infrastruktury, hostingu, sítě a bezpečnosti, poradce podle potřeby a orgány veřejné moci, pokud to ukládá zákon. Osobní údaje neprodáváme pro reklamu.</p>
<h2>5. Doba uchování</h2><ul><li>Dočasné párovací kódy Map vyprší po 7 dnech; lokální bearer token se neukládá.</li><li>Údaje o objednávce a oprávnění se uchovávají po dobu nezbytnou pro poskytnutí zakoupeného digitálního oprávnění a po použitelné účetní, daňové, chargeback, antifraudní a právní lhůty. Základní identifikátory mohou zůstat po dobu aktivního oprávnění.</li><li>Požadavky na vlastní hlas/podporu se uchovávají do vyřízení a přiměřené následné komunikace a poté se smažou nebo anonymizují, pokud již nejsou potřeba.</li><li>Volitelná telemetrie/diagnostika se uchovává jen po dobu potřebnou pro odsouhlasený vývoj, bezpečnost nebo vyšetření a může být na platnou žádost smazána, pokud jiný právní základ nevyžaduje uchování.</li><li>Žádosti o práva mohou být uchovány pro jejich vyřízení a doložení souladu.</li></ul>
<h2>6. Vaše práva</h2><p>Podle GDPR a příslušných výjimek můžete požadovat přístup, opravu, výmaz, omezení a přenositelnost a vznést námitku proti zpracování založenému na oprávněném zájmu. Souhlas lze kdykoli odvolat. Odpovídáme bez zbytečného odkladu, obvykle do jednoho měsíce; GDPR dovoluje určité prodloužení. Můžeme požadovat přiměřené ověření totožnosti.</p>
<h2>7. Povinné či volitelné údaje; automatizované rozhodování</h2><p>Platební/kontaktní údaje potřebné pro nákup nebo službu jsou smluvní/předsmluvní; bez nich nemusí být možné transakci dokončit. Volitelné hlášení/diagnostika ANTHBOT není podmínkou hlavní integrace. Reporting Server neprovádí výhradně automatizované rozhodování s právními či podobně významnými účinky. Stripe může provádět vlastní kontroly podvodů/rizika.</p>
<h2>8. Stížnosti a změny</h2><p>Nejprve můžete kontaktovat správce výše uvedenými způsoby nebo formulářem. Stížnost lze podat také maďarskému úřadu: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; poštovní adresa: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; telefon: +36 (1) 391-1400.</p><p>Toto oznámení může být aktualizováno při změně služby, poskytovatelů nebo právních požadavků. Aktuální verze a datum jsou zveřejněny zde.</p>`,

<h2>1. Prevádzkovateľ a rozsah</h2><p>Prevádzkovateľom tejto webovej stránky, obchodu s hlasmi ANTHBOT Community a ANTHBOT Reporting Servera je vyššie uvedený prevádzkovateľ. Oznámenie sa vzťahuje na nákupy, licencie a oprávnenia, žiadosti o vlastný hlas, podporu, verejný web a voliteľné hlásenie a diagnostiku ANTHBOT Map.</p>
<h2>2. Osobné údaje a zdroje</h2><p><strong>Nákupy:</strong> môžeme ukladať identifikátory Stripe Checkout/session a platieb, Stripe customer ID, email zadaný pri Checkout, zvolený hlasový balík, sumu, menu, stav platby/refundu, časové pečiatky a nepriehľadný identifikátor klienta ANTHBOT Map. Lokálny bearer token Map sa neukladá.</p><p><strong>Vlastný hlas a podpora:</strong> požadovaný jazyk, štýl hlasu, model robota, kontaktné údaje, poznámky, jazyk webu a komunikácia.</p><p><strong>Voliteľné hlásenie:</strong> iba po zapnutí/odoslaní: náhodné inštalačné UUID, verzie integrácie a Home Assistant, krajina ak je uvedená, počty zariadení/modelov, časové pečiatky a obsah diagnostiky. Polia s názvami podobnými prihlasovacím údajom server odmieta.</p><p><strong>Web:</strong> zvolený jazyk môže byť lokálne uložený v prehliadači. Databáza aplikácie zámerne neukladá IP adresy návštevníkov; hostingové, sieťové alebo bezpečnostné služby môžu dočasne spracovať bežné metadáta spojenia.</p><p>Údaje pochádzajú od vás, z vašej inštalácie ANTHBOT Map a od Stripe pri platbe.</p>
<h2>3. Účely a právne základy</h2><ul><li>Poskytovanie zakúpených digitálnych produktov, licencií, stiahnutí a podpory: čl. 6 ods. 1 písm. b GDPR.</li><li>Účtovné, daňové, právne a regulačné povinnosti: čl. 6 ods. 1 písm. c.</li><li>Bezpečnosť, prevencia podvodov/zneužitia a ochrana systémov alebo nárokov: čl. 6 ods. 1 písm. f, oprávnený záujem obmedzený na nevyhnutné.</li><li>Voliteľné hlásenie/diagnostika pri vyžiadaní súhlasu: čl. 6 ods. 1 písm. a. Súhlas možno kedykoľvek odvolať do budúcnosti.</li></ul>
<h2>4. Platby, príjemcovia a medzinárodné prenosy</h2><p>Platby spracúva Stripe. Reporting Server neprijíma ani neukladá úplné údaje platobnej karty. V EHP môže Stripe Payments Europe Limited podľa činnosti vystupovať ako sprostredkovateľ a/alebo samostatný prevádzkovateľ, vrátane platieb, podvodov, rizík a compliance. Stripe a nevyhnutné prepojené spoločnosti/dodávatelia môžu spracúvať dáta mimo EHP s vhodnými zárukami, napr. rozhodnutiami o primeranosti, EU-US Data Privacy Framework tam, kde sa uplatňuje, a štandardnými zmluvnými doložkami EÚ.</p><p>Ďalší príjemcovia sú obmedzení na nevyhnutných poskytovateľov infraštruktúry, hostingu, siete a bezpečnosti, poradcov podľa potreby a orgány verejnej moci, ak to vyžaduje zákon. Osobné údaje nepredávame na reklamné účely.</p>
<h2>5. Doba uchovávania</h2><ul><li>Dočasné párovacie kódy Map vypršia po 7 dňoch; lokálny bearer token sa neukladá.</li><li>Údaje objednávok a oprávnení sa uchovávajú počas poskytovania digitálneho oprávnenia a príslušných účtovných, daňových, chargeback, antifraudných a právnych lehôt. Základné identifikátory môžu zostať počas aktívneho oprávnenia.</li><li>Žiadosti o vlastný hlas/podporu sa uchovávajú do vybavenia a primeraného následného kontaktu a potom sa vymažú alebo anonymizujú, ak už nie sú potrebné.</li><li>Voliteľná telemetria/diagnostika zostáva len počas potreby na odsúhlasený vývoj, bezpečnosť alebo vyšetrovanie a môže sa na platnú žiadosť vymazať, ak iný právny základ nevyžaduje ďalšie uchovanie.</li><li>Žiadosti o práva možno uchovať na ich vybavenie a preukázanie súladu.</li></ul>
<h2>6. Vaše práva</h2><p>Podľa GDPR a príslušných výnimiek môžete žiadať prístup, opravu, vymazanie, obmedzenie a prenosnosť a namietať proti spracúvaniu založenému na oprávnenom záujme. Súhlas môžete kedykoľvek odvolať. Odpovedáme bez zbytočného odkladu, spravidla do jedného mesiaca; GDPR umožňuje určité predĺženie. Môžeme požiadať o primerané overenie totožnosti.</p>

<h2>4. Maksut, vastaanottajat ja kansainväliset siirrot</h2><p>Maksut käsittelee Stripe. Reporting Server ei saa tai tallenna täydellisiä korttitietoja. ETA:ssa Stripe Payments Europe Limited voi toiminnosta riippuen toimia käsittelijänä ja/tai itsenäisenä rekisterinpitäjänä muun muassa maksu-, petos-, riski- ja compliance-tehtävissä. Stripe ja tarvittavat konserniyhtiöt/palveluntarjoajat voivat käsitellä tietoja ETA:n ulkopuolella asianmukaisin suojatoimin, kuten riittävyyspäätöksillä, soveltuvin osin EU-US Data Privacy Frameworkilla ja EU:n vakiolausekkeilla.</p><p>Muut vastaanottajat rajoittuvat tarvittaviin infrastruktuuri-, hosting-, verkko- ja tietoturvapalveluihin, tarvittaessa neuvonantajiin sekä viranomaisiin lain niin vaatiessa. Henkilötietoja ei myydä mainontaan.</p>

<h2>6. Oikeutesi</h2><p>GDPR:n ja sovellettavien poikkeusten mukaisesti voit pyytää pääsyä, oikaisua, poistamista, käsittelyn rajoittamista ja siirrettävyyttä sekä vastustaa oikeutettuun etuun perustuvaa käsittelyä. Suostumuksen voi peruuttaa milloin tahansa. Vastaamme ilman aiheetonta viivytystä ja yleensä kuukauden kuluessa; GDPR sallii tietyt pidennykset. Kohtuullinen henkilöllisyyden varmistus voidaan pyytää.</p>
<h2>7. Pakolliset tai valinnaiset tiedot; automaattiset päätökset</h2><p>Ostoon tai pyydettyyn palveluun tarvittavat maksu-/yhteystiedot ovat sopimus-/esisopimustietoja; ilman niitä tapahtumaa tai palvelua ei ehkä voida toteuttaa. Valinnainen ANTHBOT-raportointi/diagnostiikka ei ole ydinintegraation käytön edellytys. Reporting Server ei tee yksinomaan automaattisia päätöksiä, joilla on oikeudellisia tai vastaavan merkittäviä vaikutuksia. Stripe voi tehdä omia petos-/riskitarkistuksiaan.</p>
<h2>8. Valitukset ja muutokset</h2><p>Voit ensin ottaa yhteyttä rekisterinpitäjään yllä olevilla tiedoilla tai lomakkeella. Voit myös tehdä valituksen Unkarin viranomaiselle: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; postiosoite: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; puhelin: +36 (1) 391-1400.</p><p>Selostetta voidaan päivittää palvelun, palveluntarjoajien tai lakivaatimusten muuttuessa. Nykyinen versio ja päivämäärä julkaistaan tällä sivulla.</p>`

<h2>2. Kişisel veriler ve kaynaklar</h2><p><strong>Satın alımlar:</strong> Stripe Checkout/oturum ve ödeme kimlikleri, Stripe müşteri kimliği, Checkout'ta verilen email, seçilen ses paketi, tutar, para birimi, ödeme/iade durumu, zaman damgaları ve opak ANTHBOT Map istemci kimliği saklanabilir. Yerel Map bearer tokenının kendisi saklanmaz.</p><p><strong>Özel ses ve destek:</strong> talep edilen dil, ses stili, robot modeli, iletişim bilgileri, notlar, site dili ve yazışmalar.</p><p><strong>İsteğe bağlı raporlama:</strong> yalnızca etkinleştirildiğinde/gönderildiğinde: rastgele kurulum UUID'si, entegrasyon ve Home Assistant sürümleri, sağlanırsa ülke, cihaz/model sayıları, olay zamanları ve teşhis içeriği. Kimlik bilgilerine benzeyen alan adları reddedilir.</p><p><strong>Web sitesi:</strong> seçilen dil tarayıcıda yerel olarak saklanabilir. Uygulama veritabanı ziyaretçi IP adreslerini bilerek saklamaz; barındırma, ağ veya güvenlik sağlayıcıları normal bağlantı meta verilerini geçici olarak işleyebilir.</p><p>Veriler sizden, ANTHBOT Map kurulumunuzdan ve ödeme sırasında Stripe'dan gelir.</p>
<h2>3. Amaçlar ve hukuki dayanaklar</h2><ul><li>Satın alınan dijital ürünlerin, lisansların, indirmelerin ve desteğin sağlanması: GDPR md. 6(1)(b).</li><li>Muhasebe, vergi, hukuk ve düzenleyici yükümlülükler: md. 6(1)(c).</li><li>Güvenlik, dolandırıcılık/kötüye kullanım önleme ve sistemlerin veya hukuki taleplerin korunması: md. 6(1)(f), gerekli ölçüyle sınırlı meşru menfaat.</li><li>Rıza istendiğinde isteğe bağlı raporlama/teşhis: md. 6(1)(a). Rıza gelecekteki işlemler için her zaman geri çekilebilir.</li></ul>
<h2>4. Ödemeler, alıcılar ve uluslararası aktarımlar</h2><p>Ödemeler Stripe tarafından işlenir. Reporting Server tam kart bilgilerini almaz veya saklamaz. AEA'da Stripe Payments Europe Limited faaliyete göre veri işleyen ve/veya bağımsız veri sorumlusu olabilir; ödeme, dolandırıcılık, risk ve uyum işlevleri buna dahildir. Stripe ve gerekli bağlı şirketler/hizmet sağlayıcılar verileri AEA dışında uygun güvencelerle işleyebilir; buna yeterlilik kararları, uygun olduğunda EU-US Data Privacy Framework ve AB Standart Sözleşme Maddeleri dahildir.</p><p>Diğer alıcılar yalnızca gerekli altyapı, barındırma, ağ ve güvenlik sağlayıcıları, gerektiğinde profesyonel danışmanlar ve kanunen zorunlu olduğunda kamu makamlarıdır. Kişisel veriler reklam amacıyla satılmaz.</p>
<h2>5. Saklama</h2><ul><li>Geçici Map eşleştirme kodları 7 gün sonra sona erer; yerel bearer token saklanmaz.</li><li>Sipariş ve hak kayıtları, satın alınan dijital hakkın sağlanması ve geçerli muhasebe, vergi, chargeback, dolandırıcılık önleme ve hukuki talep süreleri için gerekli olduğu kadar saklanır. Temel hak kimlikleri hak aktif olduğu sürece tutulabilir.</li><li>Özel ses/destek talepleri sonuçlanana ve makul takip tamamlanana kadar saklanır; artık gerekli olmadığında silinir veya anonimleştirilir.</li><li>İsteğe bağlı telemetri/teşhis yalnızca onaylanan geliştirme, güvenlik veya inceleme amaçları için gerektiği kadar tutulur ve başka bir hukuki dayanak gerektirmiyorsa geçerli talep üzerine silinebilir.</li><li>Veri koruma hakkı talepleri, talebin işlenmesi ve uyumun kanıtlanması için gerekli olduğu kadar saklanabilir.</li></ul>
<h2>6. Haklarınız</h2><p>GDPR ve uygulanabilir istisnalara göre erişim, düzeltme, silme, kısıtlama ve taşınabilirlik talep edebilir; meşru menfaate dayalı işlemeye itiraz edebilirsiniz. Rıza her zaman geri çekilebilir. Taleplere gereksiz gecikme olmadan, normalde bir ay içinde cevap veririz; GDPR'ın izin verdiği uzatmalar uygulanabilir. Gerektiğinde makul kimlik doğrulaması istenebilir.</p>
<h2>7. Zorunlu veya isteğe bağlı veriler; otomatik kararlar</h2><p>Satın alma veya talep edilen hizmet için gerekli ödeme/iletişim bilgileri sözleşmesel/sözleşme öncesidir; bunlar olmadan işlem veya hizmet tamamlanamayabilir. İsteğe bağlı ANTHBOT raporlama/teşhis çekirdek entegrasyon için zorunlu değildir. Reporting Server yalnızca otomatik işlemeye dayalı ve hukuki ya da benzer derecede önemli etki doğuran karar vermez. Stripe kendi dolandırıcılık/risk kontrollerini yapabilir.</p>
<h2>8. Şikâyetler ve değişiklikler</h2><p>Önce yukarıdaki iletişim bilgileri veya aşağıdaki form üzerinden veri sorumlusuyla iletişime geçebilirsiniz. Ayrıca Macar denetim makamına şikâyette bulunabilirsiniz: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; posta: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; telefon: +36 (1) 391-1400.</p><p>Hizmet, sağlayıcılar veya hukuki gereklilikler değişirse bu bildirim güncellenebilir. Güncel sürüm ve tarih bu sayfada yayımlanır.</p>`,
th:`
<h2>1. ผู้ควบคุมและขอบเขต</h2><p>ผู้ควบคุมข้อมูลของเว็บไซต์นี้ ร้านเสียง ANTHBOT Community และ ANTHBOT Reporting Server คือผู้ดำเนินการที่ระบุไว้ด้านบน ประกาศนี้ครอบคลุมการซื้อ ใบอนุญาตและสิทธิ์ คำขอเสียงแบบกำหนดเอง การสนับสนุน เว็บไซต์สาธารณะ และการรายงาน/การวินิจฉัย ANTHBOT Map แบบเลือกใช้</p>
<h2>2. ข้อมูลส่วนบุคคลและแหล่งที่มา</h2><p><strong>การซื้อ:</strong> เราอาจเก็บตัวระบุ Stripe Checkout/เซสชันและการชำระเงิน ตัวระบุลูกค้า Stripe อีเมลที่ให้ใน Checkout แพ็กเสียงที่เลือก จำนวนเงิน สกุลเงิน สถานะการชำระเงิน/คืนเงิน เวลา และตัวระบุไคลเอนต์ ANTHBOT Map แบบไม่เปิดเผย ตัว bearer token ของ Map ในเครื่องจะไม่ถูกเก็บ</p><p><strong>เสียงกำหนดเองและการสนับสนุน:</strong> ภาษาที่ขอ รูปแบบเสียง รุ่นหุ่นยนต์ ข้อมูลติดต่อ หมายเหตุ ภาษาของเว็บไซต์ และการติดต่อสื่อสาร</p><p><strong>การรายงานแบบเลือกใช้:</strong> เฉพาะเมื่อเปิดใช้/ส่ง: UUID การติดตั้งแบบสุ่ม เวอร์ชัน integration และ Home Assistant ประเทศหากให้ไว้ จำนวนอุปกรณ์/รุ่น เวลาเหตุการณ์ และเนื้อหาการวินิจฉัย ระบบจะปฏิเสธฟิลด์ที่มีชื่อคล้ายข้อมูลรับรอง</p><p><strong>เว็บไซต์:</strong> ภาษาที่เลือกอาจถูกบันทึกไว้ในเบราว์เซอร์ ฐานข้อมูลแอปไม่ตั้งใจเก็บ IP ของผู้เยี่ยมชม แต่ผู้ให้บริการโฮสติ้ง เครือข่าย หรือความปลอดภัยอาจประมวลผลข้อมูลเมตาการเชื่อมต่อทั่วไปชั่วคราว</p><p>ข้อมูลมาจากคุณ การติดตั้ง ANTHBOT Map ของคุณ และ Stripe เมื่อมีการชำระเงิน</p>
<h2>3. วัตถุประสงค์และฐานทางกฎหมาย</h2><ul><li>การให้ผลิตภัณฑ์ดิจิทัลที่ซื้อ ใบอนุญาต ดาวน์โหลด และการสนับสนุน: GDPR มาตรา 6(1)(b)</li><li>หน้าที่ด้านบัญชี ภาษี กฎหมาย และข้อกำกับ: มาตรา 6(1)(c)</li><li>ความปลอดภัย การป้องกันการฉ้อโกง/การใช้ผิดวัตถุประสงค์ และการปกป้องระบบหรือสิทธิเรียกร้อง: มาตรา 6(1)(f) ผลประโยชน์โดยชอบด้วยกฎหมายในขอบเขตที่จำเป็น</li><li>การรายงาน/วินิจฉัยแบบเลือกใช้เมื่อขอความยินยอม: มาตรา 6(1)(a) สามารถถอนความยินยอมสำหรับอนาคตได้ตลอดเวลา</li></ul>
<h2>4. การชำระเงิน ผู้รับ และการโอนระหว่างประเทศ</h2><p>Stripe เป็นผู้ประมวลผลการชำระเงิน Reporting Server ไม่รับหรือเก็บข้อมูลบัตรแบบเต็ม ใน EEA Stripe Payments Europe Limited อาจทำหน้าที่เป็นผู้ประมวลผลและ/หรือผู้ควบคุมอิสระตามกิจกรรม รวมถึงการชำระเงิน การฉ้อโกง ความเสี่ยง และการปฏิบัติตามข้อกำหนด Stripe และบริษัทในเครือ/ผู้ให้บริการที่จำเป็นอาจประมวลผลข้อมูลนอก EEA โดยใช้มาตรการคุ้มครองที่เหมาะสม เช่น การตัดสินความเพียงพอ EU-US Data Privacy Framework เมื่อใช้ได้ และข้อสัญญามาตรฐานของสหภาพยุโรป</p><p>ผู้รับอื่นจำกัดเฉพาะผู้ให้บริการโครงสร้างพื้นฐาน โฮสติ้ง เครือข่าย และความปลอดภัยที่จำเป็น ที่ปรึกษาเมื่อจำเป็น และหน่วยงานรัฐเมื่อกฎหมายกำหนด เราไม่ขายข้อมูลส่วนบุคคลเพื่อโฆษณา</p>
<h2>5. ระยะเวลาจัดเก็บ</h2><ul><li>รหัสจับคู่ Map ชั่วคราวหมดอายุหลัง 7 วัน; bearer token ในเครื่องไม่ถูกเก็บ</li><li>ข้อมูลคำสั่งซื้อและสิทธิ์จะถูกเก็บเท่าที่จำเป็นเพื่อให้สิทธิ์ดิจิทัลที่ซื้อ และตามช่วงเวลาบัญชี ภาษี chargeback ป้องกันการฉ้อโกง และข้อเรียกร้องทางกฎหมายที่ใช้บังคับ ตัวระบุสิทธิ์หลักอาจเก็บไว้ตราบเท่าที่สิทธิ์ยังใช้งานอยู่</li><li>คำขอเสียง/การสนับสนุนจะเก็บจนดำเนินการเสร็จและติดตามอย่างสมเหตุสมผล จากนั้นจะลบหรือทำให้ไม่ระบุตัวตนเมื่อไม่จำเป็นอีกต่อไป</li><li>เทเลเมทรี/การวินิจฉัยแบบเลือกใช้จะเก็บเฉพาะเท่าที่จำเป็นสำหรับวัตถุประสงค์การพัฒนา ความปลอดภัย หรือการตรวจสอบที่ยินยอม และอาจลบตามคำขอที่ถูกต้องหากไม่มีฐานกฎหมายอื่นให้เก็บต่อ</li><li>คำขอใช้สิทธิอาจเก็บเพื่อดำเนินการและแสดงการปฏิบัติตามข้อกำหนด</li></ul>
<h2>6. สิทธิของคุณ</h2><p>ภายใต้ GDPR และข้อยกเว้นที่ใช้บังคับ คุณสามารถขอเข้าถึง แก้ไข ลบ จำกัดการประมวลผล โอนย้ายข้อมูล และคัดค้านการประมวลผลที่อาศัยผลประโยชน์โดยชอบด้วยกฎหมายได้ สามารถถอนความยินยอมได้ตลอดเวลา เราจะตอบโดยไม่ล่าช้าเกินควร โดยปกติภายในหนึ่งเดือน และอาจขยายตามที่ GDPR อนุญาต อาจต้องมีการยืนยันตัวตนอย่างสมเหตุสมผล</p>
<h2>7. ข้อมูลที่จำเป็นหรือเลือกได้; การตัดสินใจอัตโนมัติ</h2><p>ข้อมูลการชำระเงิน/ติดต่อที่จำเป็นสำหรับการซื้อหรือบริการเป็นข้อมูลตามสัญญา/ก่อนสัญญา หากไม่มีอาจไม่สามารถทำธุรกรรมหรือให้บริการได้ การรายงาน/วินิจฉัย ANTHBOT แบบเลือกใช้ไม่จำเป็นต่อฟังก์ชันหลัก Reporting Server ไม่ตัดสินใจโดยอาศัยการประมวลผลอัตโนมัติเพียงอย่างเดียวที่ก่อผลทางกฎหมายหรือผลสำคัญใกล้เคียง Stripe อาจทำการตรวจสอบการฉ้อโกง/ความเสี่ยงของตนเอง</p>
<h2>8. การร้องเรียนและการเปลี่ยนแปลง</h2><p>คุณสามารถติดต่อผู้ควบคุมผ่านข้อมูลด้านบนหรือแบบฟอร์มด้านล่างก่อน และสามารถร้องเรียนต่อหน่วยงานฮังการี: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; ที่อยู่ไปรษณีย์: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; โทรศัพท์: +36 (1) 391-1400.</p><p>ประกาศนี้อาจอัปเดตเมื่อบริการ ผู้ให้บริการ หรือข้อกำหนดทางกฎหมายเปลี่ยนแปลง เวอร์ชันและวันที่ล่าสุดจะแสดงบนหน้านี้</p>`,

<h2>1. Bên kiểm soát và phạm vi</h2><p>Bên kiểm soát dữ liệu cho trang web này, cửa hàng giọng nói ANTHBOT Community và ANTHBOT Reporting Server là đơn vị vận hành được nêu ở trên. Thông báo này áp dụng cho mua hàng, giấy phép và quyền sử dụng, yêu cầu giọng tùy chỉnh, hỗ trợ, trang công khai và báo cáo/chẩn đoán ANTHBOT Map tùy chọn.</p>
<h2>2. Dữ liệu cá nhân và nguồn</h2><p><strong>Mua hàng:</strong> chúng tôi có thể lưu mã Stripe Checkout/phiên và thanh toán, mã khách hàng Stripe, email cung cấp trong Checkout, gói giọng đã chọn, số tiền, tiền tệ, trạng thái thanh toán/hoàn tiền, thời gian và mã khách ANTHBOT Map dạng ẩn. Bearer token Map cục bộ không được lưu.</p><p><strong>Giọng tùy chỉnh và hỗ trợ:</strong> ngôn ngữ yêu cầu, phong cách giọng, mẫu robot, thông tin liên hệ, ghi chú, ngôn ngữ trang và trao đổi.</p><p><strong>Báo cáo tùy chọn:</strong> chỉ khi bật/gửi: UUID cài đặt ngẫu nhiên, phiên bản integration và Home Assistant, quốc gia nếu cung cấp, số thiết bị/mẫu, thời gian sự kiện và nội dung chẩn đoán. Các trường có tên giống thông tin xác thực sẽ bị từ chối.</p><p><strong>Trang web:</strong> ngôn ngữ đã chọn có thể được lưu cục bộ trong trình duyệt. Cơ sở dữ liệu ứng dụng không chủ ý lưu IP khách truy cập; nhà cung cấp hosting, mạng hoặc bảo mật có thể xử lý tạm thời siêu dữ liệu kết nối thông thường.</p><p>Dữ liệu đến từ bạn, cài đặt ANTHBOT Map của bạn và Stripe khi có thanh toán.</p>
<h2>3. Mục đích và căn cứ pháp lý</h2><ul><li>Cung cấp sản phẩm số đã mua, giấy phép, tải xuống và hỗ trợ: GDPR Điều 6(1)(b).</li><li>Nghĩa vụ kế toán, thuế, pháp lý và quy định: Điều 6(1)(c).</li><li>Bảo mật, phòng chống gian lận/lạm dụng và bảo vệ hệ thống hoặc yêu cầu pháp lý: Điều 6(1)(f), lợi ích hợp pháp giới hạn ở mức cần thiết.</li><li>Báo cáo/chẩn đoán tùy chọn khi có yêu cầu đồng ý: Điều 6(1)(a). Có thể rút lại sự đồng ý bất cứ lúc nào cho tương lai.</li></ul>
<h2>4. Thanh toán, bên nhận và chuyển dữ liệu quốc tế</h2><p>Thanh toán do Stripe xử lý. Reporting Server không nhận hoặc lưu dữ liệu thẻ đầy đủ. Trong EEA, Stripe Payments Europe Limited có thể đóng vai trò bên xử lý và/hoặc bên kiểm soát độc lập tùy hoạt động, gồm thanh toán, gian lận, rủi ro và tuân thủ. Stripe và các công ty liên kết/nhà cung cấp cần thiết có thể xử lý dữ liệu ngoài EEA với biện pháp bảo vệ phù hợp như quyết định công nhận mức bảo vệ tương đương, EU-US Data Privacy Framework khi áp dụng và các điều khoản hợp đồng tiêu chuẩn EU.</p><p>Các bên nhận khác giới hạn ở nhà cung cấp hạ tầng, hosting, mạng và bảo mật cần thiết, cố vấn khi cần và cơ quan công quyền khi pháp luật yêu cầu. Chúng tôi không bán dữ liệu cá nhân cho quảng cáo.</p>
<h2>5. Thời gian lưu giữ</h2><ul><li>Mã ghép nối Map tạm thời hết hạn sau 7 ngày; bearer token cục bộ không được lưu.</li><li>Dữ liệu đơn hàng và quyền sử dụng được lưu khi cần để cung cấp quyền số đã mua và trong các thời hạn kế toán, thuế, chargeback, chống gian lận và khiếu kiện áp dụng. Mã quyền cốt lõi có thể được giữ khi quyền còn hoạt động.</li><li>Yêu cầu giọng/hỗ trợ được giữ đến khi giải quyết và theo dõi hợp lý, sau đó xóa hoặc ẩn danh khi không còn cần thiết.</li><li>Telemetry/chẩn đoán tùy chọn chỉ được giữ khi cần cho mục đích phát triển, bảo mật hoặc điều tra đã được đồng ý và có thể xóa theo yêu cầu hợp lệ trừ khi có căn cứ pháp lý khác yêu cầu giữ.</li><li>Yêu cầu thực hiện quyền có thể được giữ để xử lý và chứng minh tuân thủ.</li></ul>
<h2>6. Quyền của bạn</h2><p>Theo GDPR và các ngoại lệ áp dụng, bạn có thể yêu cầu truy cập, chỉnh sửa, xóa, hạn chế, khả chuyển dữ liệu và phản đối việc xử lý dựa trên lợi ích hợp pháp. Có thể rút lại sự đồng ý bất kỳ lúc nào. Chúng tôi phản hồi không chậm trễ quá mức, thường trong một tháng; có thể gia hạn khi GDPR cho phép. Có thể yêu cầu xác minh danh tính hợp lý.</p>
<h2>7. Dữ liệu bắt buộc hoặc tùy chọn; quyết định tự động</h2><p>Dữ liệu thanh toán/liên hệ cần cho mua hàng hoặc dịch vụ là dữ liệu theo hợp đồng/trước hợp đồng; thiếu chúng có thể không hoàn tất được giao dịch hoặc dịch vụ. Báo cáo/chẩn đoán ANTHBOT tùy chọn không bắt buộc cho tích hợp cốt lõi. Reporting Server không đưa ra quyết định chỉ dựa trên xử lý tự động gây hiệu lực pháp lý hoặc ảnh hưởng đáng kể tương tự. Stripe có thể thực hiện kiểm tra gian lận/rủi ro riêng.</p>
<h2>8. Khiếu nại và thay đổi</h2><p>Bạn có thể liên hệ trước với bên kiểm soát bằng thông tin trên hoặc biểu mẫu dưới đây. Bạn cũng có thể khiếu nại tới cơ quan Hungary: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; địa chỉ thư: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; điện thoại: +36 (1) 391-1400.</p><p>Thông báo này có thể được cập nhật khi dịch vụ, nhà cung cấp hoặc yêu cầu pháp lý thay đổi. Phiên bản và ngày hiện tại được công bố tại trang này.</p>`,

<h2>1. 개인정보 처리자 및 범위</h2><p>이 웹사이트, ANTHBOT Community 음성 스토어 및 ANTHBOT Reporting Server의 개인정보 처리자는 위에 표시된 운영자입니다. 이 방침은 구매, 라이선스와 권한, 맞춤 음성 요청, 지원, 공개 웹사이트 및 선택적 ANTHBOT Map 보고/진단에 적용됩니다.</p>
<h2>2. 개인정보와 출처</h2><p><strong>구매:</strong> Stripe Checkout/세션 및 결제 식별자, Stripe 고객 식별자, Checkout에서 제공된 이메일, 선택한 음성팩, 금액, 통화, 결제/환불 상태, 타임스탬프 및 불투명한 ANTHBOT Map 클라이언트 식별자를 저장할 수 있습니다. 로컬 Map bearer token 자체는 저장하지 않습니다.</p><p><strong>맞춤 음성 및 지원:</strong> 요청 언어, 음성 스타일, 로봇 모델, 연락처, 메모, 사이트 언어 및 관련 통신.</p><p><strong>선택적 보고:</strong> 활성화/제출된 경우에만 무작위 설치 UUID, 통합 및 Home Assistant 버전, 제공된 경우 국가, 장치/모델 수, 이벤트 시간 및 진단 내용을 처리합니다. 자격 증명과 유사한 필드명은 Reporting Server가 거부합니다.</p><p><strong>웹사이트:</strong> 선택한 언어는 브라우저에 로컬로 저장될 수 있습니다. 애플리케이션 데이터베이스는 방문자 IP 주소를 의도적으로 저장하지 않지만 호스팅, 네트워크 또는 보안 제공업체가 일반 연결 메타데이터를 일시적으로 처리할 수 있습니다.</p><p>데이터는 귀하, 귀하의 ANTHBOT Map 설치 및 결제 시 Stripe에서 제공됩니다.</p>
<h2>3. 목적 및 법적 근거</h2><ul><li>구매한 디지털 제품, 라이선스, 다운로드 및 지원 제공: GDPR 6(1)(b).</li><li>회계, 세금, 법률 및 규제 의무: 6(1)(c).</li><li>서비스 보안, 사기/남용 방지 및 시스템 또는 법적 청구 보호: 6(1)(f), 필요한 범위의 정당한 이익.</li><li>동의를 요청하는 선택적 보고/진단: 6(1)(a). 동의는 언제든 향후 처리에 대해 철회할 수 있습니다.</li></ul>
<h2>4. 결제, 수신자 및 국제 이전</h2><p>결제는 Stripe가 처리합니다. Reporting Server는 전체 카드 정보를 수신하거나 저장하지 않습니다. EEA에서 Stripe Payments Europe Limited는 활동에 따라 처리자 및/또는 독립적인 개인정보 처리자가 될 수 있으며 결제, 사기, 위험 및 규정 준수 기능이 포함됩니다. Stripe와 필요한 계열사/서비스 제공업체는 적정성 결정, 해당되는 경우 EU-US Data Privacy Framework 및 EU 표준계약조항 등의 적절한 보호조치를 통해 EEA 외부에서 데이터를 처리할 수 있습니다.</p><p>기타 수신자는 서비스 운영에 필요한 인프라, 호스팅, 네트워크 및 보안 제공업체, 필요한 경우 전문 자문인, 법률상 요구되는 공공기관으로 제한됩니다. 개인정보를 광고 목적으로 판매하지 않습니다.</p>
<h2>5. 보관</h2><ul><li>임시 Map 페어링 코드는 7일 후 만료되며 로컬 bearer token은 저장되지 않습니다.</li><li>주문 및 권한 기록은 구매한 디지털 권한을 제공하는 데 필요한 기간과 적용되는 회계, 세금, chargeback, 사기 방지 및 법적 청구 기간 동안 보관됩니다. 핵심 권한 식별자는 권한이 활성 상태인 동안 유지될 수 있습니다.</li><li>맞춤 음성/지원 요청은 처리 및 합리적 후속조치가 끝날 때까지 보관하고 더 이상 필요하지 않으면 삭제하거나 익명화합니다.</li><li>선택적 텔레메트리/진단은 동의된 개발, 보안 또는 문제 조사 목적에 필요한 동안만 보관하며 다른 법적 근거가 보관을 요구하지 않는 경우 유효한 요청에 따라 삭제할 수 있습니다.</li><li>개인정보 권리 요청은 처리 및 준수 입증에 필요한 동안 보관할 수 있습니다.</li></ul>
<h2>6. 귀하의 권리</h2><p>GDPR 및 적용 예외에 따라 열람, 정정, 삭제, 처리 제한, 데이터 이동을 요청하고 정당한 이익에 근거한 처리에 반대할 수 있습니다. 동의는 언제든 철회할 수 있습니다. 부당한 지연 없이 일반적으로 한 달 내 응답하며 GDPR이 허용하는 경우 연장될 수 있습니다. 필요한 경우 합리적인 신원 확인을 요청할 수 있습니다.</p>
<h2>7. 필수 또는 선택 정보; 자동화된 결정</h2><p>구매 또는 요청 서비스에 필요한 결제/연락 정보는 계약/계약 전 필요한 정보이며 제공하지 않으면 거래나 서비스가 완료되지 않을 수 있습니다. 선택적 ANTHBOT 보고/진단은 핵심 통합 사용에 필수적이지 않습니다. Reporting Server는 법적 또는 유사하게 중대한 효과를 발생시키는 전적으로 자동화된 결정을 하지 않습니다. Stripe는 자체 사기/위험 검사를 수행할 수 있습니다.</p>
<h2>8. 불만 및 변경</h2><p>먼저 위 연락처 또는 아래 양식을 통해 개인정보 처리자에게 연락할 수 있습니다. 또한 헝가리 감독기관에 불만을 제기할 수 있습니다: <strong>Nemzeti Adatvédelmi és Információszabadság Hatóság (NAIH)</strong>, 1055 Budapest, Falk Miksa utca 9-11; 우편: 1363 Budapest, Pf. 9.; email: ugyfelszolgalat@naih.hu; 전화: +36 (1) 391-1400.</p><p>서비스, 제공업체 또는 법적 요구사항이 변경되면 본 방침을 업데이트할 수 있습니다. 최신 버전과 날짜는 이 페이지에 게시됩니다.</p>`,

const SUPPORTED=["hu","en","de","fr","es","it","pt","nl","pl","cs","sk","ro","da","sv","no","fi","zh-CN","zh-TW","tr","th","vi","ko","km"];
const BASE_BODY=COMMON_BODY.en;
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function bodyFor(lang){return COMMON_BODY[lang]||COMMON_BODY.en;}
function applyLanguage(lang){
  if(!SUPPORTED.includes(lang))lang="en";
  document.documentElement.lang=lang;
  const t=TEXT[lang]||TEXT.en;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(t[k])el.textContent=t[k];});
  document.getElementById("policy-body").innerHTML=bodyFor(lang);
  document.title=t.title+" | MQB Retrofit Hungary";
  document.getElementById("site-language").value=lang;
  const select=document.getElementById("request-type");
  const values=["access","rectification","erasure","restriction","portability","objection","withdraw_consent","complaint","other"];
  select.innerHTML=values.map((v,i)=>'<option value="'+v+'">'+escapeHtml(t.types[i])+'</option>').join("");
  try{localStorage.setItem("mqb-site-language",lang)}catch(_){}
}
function initialLanguage(){
  let saved="";try{saved=localStorage.getItem("mqb-site-language")||""}catch(_){}
  if(SUPPORTED.includes(saved))return saved;
  const raw=navigator.language||"en";
  if(SUPPORTED.includes(raw))return raw;
  const short=raw.slice(0,2).toLowerCase();
  return SUPPORTED.includes(short)?short:"en";
}
document.getElementById("site-language").addEventListener("change",e=>applyLanguage(e.target.value));
document.getElementById("privacy-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const t=TEXT[document.documentElement.lang]||TEXT.en;
  const btn=document.getElementById("request-submit");
  const status=document.getElementById("request-status");
  const payload={request_type:document.getElementById("request-type").value,contact:document.getElementById("request-contact").value.trim(),details:document.getElementById("request-details").value.trim(),site_language:document.documentElement.lang||"en"};
  btn.disabled=true;btn.textContent=t.sending;status.className="status";status.textContent="";
  try{
    const res=await fetch("/api/anthbot/privacy-requests",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.detail||("HTTP "+res.status));
    status.className="status good";status.textContent=t.sent.replace("{id}",data.request_id||"");
    document.getElementById("request-details").value="";
  }catch(err){status.className="status bad";status.textContent=t.error+": "+err.message}
  finally{btn.disabled=false;btn.textContent=t.requestSubmit}
});
applyLanguage(initialLanguage());
</script>
