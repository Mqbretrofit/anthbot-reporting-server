name: ANTHBOT Reporting Server
version: "1.0.16"
slug: anthbot_reporting
description: ANTHBOT Map presence, opt-in telemetry, diagnostics, and admin dashboard backend
url: https://github.com/Mqbretrofit/anthbot-reporting-server/tree/main/anthbot_reporting
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: ANTHBOT reporting API and admin dashboard
watchdog: http://[HOST]:[PORT:8080]/health
options:
  admin_token: ""
  store_enabled: false
  stripe_secret_key: ""
  stripe_webhook_secret: ""
  store_license_secret: ""
  stripe_automatic_tax: false
  privacy_controller_name: "ANTHBOT Map"
  privacy_controller_address: ""
  privacy_contact_email: "support@anthbotmap.com"
  privacy_contact_phone: "+36 30 620 9015"
  site_analytics_enabled: true
  google_site_verification: ""
  web_voice_installer_enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  smtp_from_email: "support@anthbotmap.com"
  smtp_from_name: "ANTHBOT Map"
  smtp_starttls: true
  smtp_ssl: false
schema:
  admin_token: password?
  store_enabled: bool
  stripe_secret_key: password?
  stripe_webhook_secret: password?
  store_license_secret: password?
  stripe_automatic_tax: bool
  privacy_controller_name: str
  privacy_controller_address: str?
  privacy_contact_email: str?
  privacy_contact_phone: str
  site_analytics_enabled: bool
  google_site_verification: str?
  web_voice_installer_enabled: bool
  smtp_host: str?
  smtp_port: int(1,65535)
  smtp_username: str?
  smtp_password: password?
  smtp_from_email: str?
  smtp_from_name: str
  smtp_starttls: bool
  smtp_ssl: bool
