name: ANTHBOT Reporting Server
version: "1.0.15"
slug: anthbot_reporting
description: ANTHBOT Map presence, opt-in telemetry, diagnostics, and admin dashboard backend
url: https://github.com/Mqbretrofit/anthbot-reporting-server/tree/main/anthbot_reporting
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: ANTHBOT reporting API and admin dashboard
watchdog: http://[HOST]:[PORT:8080]/health
options:
  admin_token: ""
  store_enabled: false
  stripe_secret_key: ""
schema:
  admin_token: password
  store_enabled: bool
  stripe_secret_key: password
image: ghcr.io/mqbretrofit/anthbot-reporting-{arch}
