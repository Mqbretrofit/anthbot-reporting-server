function initial(){let s='';try{s=localStorage.getItem('mqb-site-language')||''}catch(_){}if(SUPPORTED.includes(s))return s;const r=navigator.language||'en';if(SUPPORTED.includes(r))return r;const p=r.slice(0,2).toLowerCase();return SUPPORTED.find(x=>x.toLowerCase()===p)||'en'}
document.getElementById('site-language').addEventListener('change',e=>{apply(e.target.value);check(0,true)});
const sessionId=new URLSearchParams(location.search).get('session_id')||'',statusEl=document.getElementById('status'),wrap=document.getElementById('license-wrap'),licenseEl=document.getElementById('license'),packEl=document.getElementById('pack'),installEl=document.getElementById('install'),webNote=document.getElementById('web-note'),mapGuide=document.getElementById('map-guide'),emailNote=document.getElementById('email-note'),returnHa=document.getElementById('return-ha'),closeHint=document.getElementById('close-hint');
async function check(attempt=0,languageOnly=false){
 if(!sessionId){statusEl.textContent=t('missing');return}
 if(languageOnly&&statusEl.dataset.mode==='web'){statusEl.textContent=wt('paidWeb');webNote.textContent=wt('webText');installEl.textContent=wt('install');return}
 if(languageOnly&&licenseEl.value){statusEl.textContent=statusEl.dataset.linked==='1'?t('paidLinked'):t('paid');document.getElementById('license-copy').innerHTML=statusEl.dataset.linked==='1'?'<strong>'+t('auto')+'</strong> '+t('autoText'):'<strong>'+t('license')+'</strong> '+t('licenseText');packEl.innerHTML=t('pack')+': <strong>'+packEl.dataset.language+'</strong> · '+packEl.dataset.variant;return}
 statusEl.textContent=t('checking');
 try{const res=await fetch('/api/anthbot/store/orders/'+encodeURIComponent(sessionId),{cache:'no-store'});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.detail||('HTTP '+res.status));
  if(data.payment_status==='paid'&&data.web_installer_linked){document.body.dataset.paid='1';document.getElementById('heading').textContent=t('successHeading');statusEl.className='status good';statusEl.dataset.mode='web';statusEl.textContent=wt('paidWeb');wrap.style.display='none';mapGuide.style.display='none';returnHa.style.display='none';webNote.style.display='block';webNote.textContent=wt('webText');installEl.href=data.installer_url||('/voice-installer?pack='+encodeURIComponent(data.pack_id||''));installEl.style.display='inline-flex';installEl.textContent=wt('install');return}
  if(data.payment_status==='paid'&&data.license_key){document.body.dataset.paid='1';document.getElementById('heading').textContent=t('successHeading');statusEl.className='status good';statusEl.dataset.mode='license';statusEl.dataset.linked=data.map_linked?'1':'0';statusEl.textContent=data.map_linked?t('paidLinked'):t('paid');licenseEl.value=data.license_key;wrap.style.display='block';document.getElementById('license-copy').innerHTML=data.map_linked?'<strong>'+t('auto')+'</strong> '+t('autoText'):'<strong>'+t('license')+'</strong> '+t('licenseText');const p=data.pack||{};packEl.dataset.language=p.language||'';packEl.dataset.variant=p.variant_name||p.community_id||p.pack_id||'';packEl.innerHTML=t('pack')+': <strong>'+String(packEl.dataset.language).replace(/[&<>"]/g,'')+'</strong> · '+String(packEl.dataset.variant).replace(/[&<>"]/g,'');if(data.map_linked){mapGuide.style.display='block';returnHa.style.display='inline-flex';emailNote.style.display='block';emailNote.dataset.sent=data.installation_email_sent?'1':'0';renderMapGuide()}return}
  if(attempt<10){statusEl.textContent=t('processing');setTimeout(()=>check(attempt+1),1500);return}statusEl.textContent=t('unverified')
 }catch(err){statusEl.textContent=t('failed')+': '+err.message}
}
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(licenseEl.value);document.getElementById('copy').textContent=t('copied')}catch(_){licenseEl.select();document.execCommand('copy')}};returnHa.onclick=()=>{closeHint.style.display='none';window.close();window.setTimeout(()=>{closeHint.style.display='block'},350)};
apply(initial());check();
</script></body></html>
