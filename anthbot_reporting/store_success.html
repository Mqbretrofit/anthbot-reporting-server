<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANTHBOT hangvásárlás</title>
  <style>
    :root{color-scheme:dark;--bg:#08111f;--panel:#111d30;--line:#263b5d;--text:#f2f7ff;--muted:#9bb0ce;--accent:#6aa9ff;--good:#7fe1bf;--warn:#ffd27a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 0,#17365f 0,#08111f 34rem),var(--bg);color:var(--text);padding:20px}
    .card{width:min(680px,100%);padding:26px;background:linear-gradient(180deg,rgba(23,38,61,.98),rgba(13,24,40,.98));border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(0,0,0,.28)}
    h1{margin:.2rem 0 1rem;font-size:clamp(1.8rem,5vw,2.8rem)}p{color:var(--muted);line-height:1.6}.status{padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0c1727;margin:18px 0}
    .status.good{border-color:rgba(127,225,191,.35);color:#c9ffed}.status.warn{border-color:rgba(255,210,122,.35);color:#ffe5ad}.license{display:none;margin-top:18px}
    .license-box{display:flex;gap:9px}.license-box input{flex:1;min-width:0;background:#081321;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    button,a.btn{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:750;cursor:pointer;background:linear-gradient(135deg,#4f8fe8,#7267ed);color:white;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.secondary{background:#15243a!important;border:1px solid var(--line)!important}
    .small{font-size:.84rem;color:var(--muted);margin-top:12px}
  </style>
</head>
<body>
  <div class="card">
    <div style="color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem">ANTHBOT Community</div>
    <h1>Fizetés ellenőrzése</h1>
    <p id="intro">Ellenőrizzük a Stripe fizetési munkamenetet.</p>
    <div class="status warn" id="status">Ellenőrzés…</div>
    <div class="license" id="license-wrap">
      <p><strong>Hanglicenc:</strong> ezt a kulcsot tartsd meg. A fizetős hangcsomag jogosultságát ez azonosítja.</p>
      <div class="license-box">
        <input id="license" readonly>
        <button id="copy">Másolás</button>
      </div>
      <div class="small" id="pack"></div>
    </div>
    <div class="actions"><a class="btn secondary" href="/store">Vissza a Hangbolthoz</a></div>
  </div>
  <script>
    const sessionId=new URLSearchParams(location.search).get('session_id')||'';
    const statusEl=document.getElementById('status');
    const wrap=document.getElementById('license-wrap');
    const licenseEl=document.getElementById('license');
    const packEl=document.getElementById('pack');
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    async function check(attempt=0){
      if(!sessionId){statusEl.textContent='Hiányzik a Stripe session azonosító.';return;}
      try{
        const res=await fetch('/api/anthbot/store/orders/'+encodeURIComponent(sessionId),{cache:'no-store'});
        const data=await res.json().catch(()=>({}));
        if(!res.ok)throw new Error(data.detail||('HTTP '+res.status));
        if(data.payment_status==='paid'&&data.license_key){
          statusEl.className='status good';statusEl.textContent='Sikeres fizetés. A hanglicenc elkészült.';
          licenseEl.value=data.license_key;wrap.style.display='block';
          const p=data.pack||{};packEl.innerHTML='Csomag: <strong>'+esc(p.language||'')+'</strong> · '+esc(p.variant_name||p.community_id||p.pack_id||'');
          return;
        }
        if(attempt<10){statusEl.textContent='A fizetés még feldolgozás alatt van…';setTimeout(()=>check(attempt+1),1500);return;}
        statusEl.textContent='A fizetés még nem igazolt. Frissítsd az oldalt pár másodperc múlva.';
      }catch(err){statusEl.textContent='Az ellenőrzés nem sikerült: '+err.message;}
    }
    document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(licenseEl.value);document.getElementById('copy').textContent='Másolva';}catch(_){licenseEl.select();document.execCommand('copy');}};
    check();
  </script>
</body>
</html>
