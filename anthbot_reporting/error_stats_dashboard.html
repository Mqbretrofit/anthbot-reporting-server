<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTHBOT hiba statisztika</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef4ff}.shell{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:9px 13px;border:1px solid #263349;border-radius:11px;background:#182235;color:#eef4ff;text-decoration:none;cursor:pointer}.export{background:#176b52;border-color:#2b9d79;font-weight:700}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,minmax(0,1fr));margin:20px 0}.two{grid-template-columns:1fr 1fr}.card{background:#121a2a;border:1px solid #263349;border-radius:16px;padding:16px}.label,.muted{color:#9fb0ca}.value{font-size:1.9rem;font-weight:750;margin-top:5px}.bar{display:grid;grid-template-columns:minmax(150px,1.35fr) 3fr auto;gap:9px;align-items:center;margin:9px 0}.track{height:9px;background:#0d1626;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff8a9a,#ffcc66)}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #263349;text-align:left;vertical-align:top}th{color:#9fb0ca;font-size:.82rem}.wrap{overflow:auto}.good{color:#8de6b8}.warn{color:#ffe3a7}.bad{color:#ff9ca7}.mono{font-family:monospace}.rank{font-weight:800;font-size:1.05rem}.note{margin:14px 0;padding:11px 13px;border-radius:10px;background:#0e192a;border:1px solid #263349}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.shell{padding:13px}}</style></head><body><main class="shell"><div class="top"><div><h1>Robot hiba- és eseménystatisztika</h1><div class="muted">Valódi hibák, normál robot-események és cloud/API hibák külön kezelve</div></div><div class="actions"><a class="btn export" href="/api/anthbot/admin/analysis-export.json">⬇ Elemzési JSON mentése</a><a class="btn" href="/dashboard/presence">Presence</a><a class="btn" href="/dashboard">Fő dashboard</a><button class="btn" onclick="load()">Frissítés</button></div></div><div id="content">Betöltés…</div></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmt=v=>v?new Intl.DateTimeFormat('hu-HU',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';
function k(l,v,h,cls=''){return `<div class="card"><div class="label">${esc(l)}</div><div class="value ${cls}">${esc(v)}</div><div class="muted">${esc(h)}</div></div>`}
function bars(a,label='name',value='count'){if(!a?.length)return '<div class="muted">Még nincs adat.</div>';let m=Math.max(...a.map(x=>Number(x[value]||0)),1);return a.slice(0,20).map(x=>`<div class="bar"><div title="${esc(x[label])}">${esc(x[label])}</div><div class="track"><div class="fill" style="width:${Math.max(3,Number(x[value]||0)/m*100)}%"></div></div><div>${esc(x[value])}</div></div>`).join('')}
async function load(){
 const r=await fetch('/api/anthbot/admin/error-stats',{credentials:'same-origin'});
 if(r.status===401){location.href='/dashboard';return}
 const s=await r.json();
 const modelRows=(s.model_errors||[]).map(x=>`<tr><td><b>${esc(x.model)}</b></td><td>${esc(x.error_code??'—')}</td><td>${esc(x.description||x.message||'—')}</td><td>${x.count}</td><td>${x.affected_installations}</td><td>${x.affected_robots}</td><td>${esc(fmt(x.last_seen))}</td></tr>`).join('');
 const robotRows=(s.problem_robots||[]).map((x,i)=>`<tr><td class="rank">#${i+1}</td><td><b>${esc(x.robot||x.model||'Ismeretlen')}</b></td><td>${esc(x.model||'—')}</td><td class="bad"><b>${esc(x.error_count)}</b></td><td>${esc(x.unique_errors)}</td><td>${esc(fmt(x.last_seen))}</td></tr>`).join('');
 const classified=(s.total_error_events||0)+(s.status_events||0)+(s.unclassified_events||0);
 const note=s.classification_version>=2?`<div class="note"><span class="good">✓ Új osztályozás aktív.</span> A normál task-események nem növelik a hibaszámot. Besorolt diagnosztikai események: <b>${classified}</b>.</div>`:'';
 document.getElementById('content').innerHTML=`
 ${note}
 <div class="grid kpis">
  ${k('Valódi hibák',s.total_error_events,'Csak hibának minősített robot-esemény','bad')}
  ${k('Normál események',s.status_events,'Kiszűrve a hibastatisztikából','good')}
  ${k('Nem besorolt',s.unclassified_events,'Nem számítanak valódi hibának','warn')}
  ${k('Érintett robotok',s.affected_robots,'Valódi hibát jelentő robot')}
  ${k('Érintett telepítések',s.affected_installations,'Valódi hibával')}
  ${k('Cloud/API hibák',s.cloud_api_events,'Külön kategória')}
 </div>
 <div class="card"><h2>Legproblémásabb robotok</h2><div class="muted">Valódi hibák száma alapján, azonos hibaszámnál a különböző hibatípusok száma dönt.</div><div class="wrap"><table><thead><tr><th>Hely</th><th>Robot</th><th>Modell</th><th>Valódi hiba</th><th>Különböző hiba</th><th>Utolsó hiba</th></tr></thead><tbody>${robotRows||'<tr><td colspan="6" class="muted">Nincs azonosítható, valódi hibát jelentő robot.</td></tr>'}</tbody></table></div></div>
 <div class="grid two" style="margin-top:14px">
  <div class="card"><h2>Valódi hibák modellenként</h2>${bars(s.by_model)}</div>
  <div class="card"><h2>Leggyakoribb valódi hibák</h2>${bars(s.by_error)}</div>
  <div class="card"><h2>Kiszűrt normál események</h2>${bars(s.by_status_event)}</div>
  <div class="card"><h2>Nem besorolt események</h2>${bars(s.by_unclassified_event)}</div>
  <div class="card"><h2>Cloud/API hibakategóriák</h2>${bars(s.by_cloud_category)}</div>
  <div class="card"><h2>Robot állapot valódi hibánál</h2>${bars(s.by_robot_status)}</div>
 </div>
 <div class="card" style="margin-top:14px"><h2>Modell × valódi hiba</h2><div class="wrap"><table><thead><tr><th>Modell</th><th>Kód</th><th>Leírás / üzenet</th><th>Esemény</th><th>Telepítés</th><th>Robot</th><th>Utolsó</th></tr></thead><tbody>${modelRows||'<tr><td colspan="7" class="muted">Még nincs valódi hibariport.</td></tr>'}</tbody></table></div></div>
 <div class="card" style="margin-top:14px"><h2>Valódi hibák időben</h2><div class="grid kpis">${k('24 óra',s.error_events_24h,'valódi hiba')}${k('7 nap',s.error_events_7d,'valódi hiba')}${k('30 nap',s.error_events_30d,'valódi hiba')}</div><div class="muted">Az összesítés a már meglévő opt-in diagnosztikai riportokból készül; nem kapcsol be új adatküldést.</div></div>`;
}
load();
</script></body></html>
