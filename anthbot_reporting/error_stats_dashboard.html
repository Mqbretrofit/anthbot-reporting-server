<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTHBOT hiba statisztika</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef4ff}.shell{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:9px 13px;border:1px solid #263349;border-radius:11px;background:#182235;color:#eef4ff;text-decoration:none;cursor:pointer}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin:20px 0}.two{grid-template-columns:1fr 1fr}.card{background:#121a2a;border:1px solid #263349;border-radius:16px;padding:16px}.label,.muted{color:#9fb0ca}.value{font-size:1.9rem;font-weight:750;margin-top:5px}.bar{display:grid;grid-template-columns:minmax(130px,1.2fr) 3fr auto;gap:9px;align-items:center;margin:9px 0}.track{height:9px;background:#0d1626;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff8a9a,#ffcc66)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-bottom:1px solid #263349;text-align:left;vertical-align:top}.wrap{overflow:auto}.pill{display:inline-block;padding:3px 7px;border:1px solid #263349;border-radius:999px;margin:2px;font-size:.78rem}.warn{color:#ffe3a7}.mono{font-family:monospace}@media(max-width:850px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.shell{padding:13px}}</style></head><body><main class="shell"><div class="top"><div><h1>Robot hiba- és eseménystatisztika</h1><div class="muted">A meglévő, opt-in diagnosztikai riportok anonim összesítése modellenként</div></div><div class="actions"><a class="btn" href="/dashboard/presence">Presence</a><a class="btn" href="/dashboard">Fő dashboard</a><button class="btn" onclick="load()">Frissítés</button></div></div><div id="content">Betöltés…</div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=v=>v?new Intl.DateTimeFormat('hu-HU',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';function k(l,v,h){return `<div class="card"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div><div class="muted">${esc(h)}</div></div>`}function bars(a,label='name'){if(!a?.length)return '<div class="muted">Még nincs adat.</div>';let m=Math.max(...a.map(x=>x.count),1);return a.slice(0,20).map(x=>`<div class="bar"><div title="${esc(x[label])}">${esc(x[label])}</div><div class="track"><div class="fill" style="width:${Math.max(3,x.count/m*100)}%"></div></div><div>${x.count}</div></div>`).join('')}async function load(){const r=await fetch('/api/anthbot/admin/error-stats',{credentials:'same-origin'});if(r.status===401){location.href='/dashboard';return}const s=await r.json();const rows=(s.model_errors||[]).map(x=>`<tr><td><b>${esc(x.model)}</b></td><td>${esc(x.error_code??'—')}</td><td>${esc(x.description||x.message||'—')}</td><td>${x.count}</td><td>${x.affected_installations}</td><td>${x.affected_robots}</td><td>${esc(fmt(x.last_seen))}</td></tr>`).join('');document.getElementById('content').innerHTML=`<div class="grid kpis">${k('Hibaesemények',s.total_error_events,'Tárolt automatikus robot hibariport')}${k('Érintett telepítések',s.affected_installations,'Külön installation ID')}${k('Érintett robotok',s.affected_robots,'Adatvédelmi robot hash alapján')}${k('Modellek',s.models_with_errors,'Hibát jelentő modellek')}${k('Cloud/API hibák',s.cloud_api_events,'ANTHBOT cloud/API riport')}</div><div class="grid two"><div class="card"><h2>Hibák modellenként</h2>${bars(s.by_model)}</div><div class="card"><h2>Leggyakoribb hibakódok</h2>${bars(s.by_error)}</div><div class="card"><h2>Cloud/API hibakategóriák</h2>${bars(s.by_cloud_category)}</div><div class="card"><h2>Robot állapot hibánál</h2>${bars(s.by_robot_status)}</div></div><div class="card" style="margin-top:14px"><h2>Modell × hibakód</h2><div class="wrap"><table><thead><tr><th>Modell</th><th>Kód</th><th>Leírás / üzenet</th><th>Esemény</th><th>Telepítés</th><th>Robot</th><th>Utolsó</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">Még nincs automatikus hibariport.</td></tr>'}</tbody></table></div></div><div class="card" style="margin-top:14px"><h2>Időbeli aktivitás</h2><div class="grid kpis">${k('24 óra',s.error_events_24h,'hibaesemény')}${k('7 nap',s.error_events_7d,'hibaesemény')}${k('30 nap',s.error_events_30d,'hibaesemény')}</div><div class="muted">A statisztika a már meglévő opt-in diagnosztikai riportokból készül; nem kapcsol be új adatküldést.</div></div>`}load();</script></body></html>
