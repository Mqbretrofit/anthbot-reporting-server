.hero{padding:28px 0 20px}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}h1{font-size:clamp(2.25rem,6vw,4.4rem);line-height:1;margin:.45rem 0 1rem}.lead{max-width:820px;color:var(--muted);font-size:1.05rem;line-height:1.65}

.account-panel{margin:0 0 18px;padding:17px 18px;border:1px solid rgba(99,184,255,.24);border-radius:17px;background:linear-gradient(180deg,rgba(16,29,44,.96),rgba(10,18,28,.96));box-shadow:0 14px 38px rgba(0,0,0,.2)}.account-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.account-head strong{font-size:1rem}.account-sub{color:var(--muted);font-size:.82rem;margin-top:3px}.account-grid{display:grid;grid-template-columns:minmax(220px,1.4fr) minmax(130px,.7fr) auto;gap:9px;margin-top:13px;align-items:end}.account-input{width:100%;height:42px;border-radius:11px;border:1px solid var(--line2);background:#0a131f;color:#fff;padding:0 11px;font:inherit}.account-grid .btn{height:42px;padding:0 14px;white-space:nowrap}.account-state{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}.account-chip{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:#d8e6fb;font-size:.78rem}.account-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.account-actions .btn{width:auto;padding:9px 12px}.account-message{margin-top:10px;font-size:.82rem;color:var(--muted)}.account-message.good{color:#c9ffed}.account-message.bad{color:#ffc6ce}.hidden{display:none!important}
.organizer{margin:0 0 18px;padding:16px;border:1px solid var(--line2);border-radius:17px;background:linear-gradient(180deg,rgba(18,29,43,.96),rgba(11,18,27,.96));box-shadow:0 14px 38px rgba(0,0,0,.2)}.organizer-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.organizer-head strong{font-size:1rem}.organizer-summary{color:var(--muted);font-size:.82rem;text-align:right}.organizer-grid{display:grid;grid-template-columns:minmax(220px,1.7fr) repeat(4,minmax(130px,1fr));gap:9px}.filter-control{width:100%;height:42px;border-radius:11px;border:1px solid var(--line2);background:#0a131f;color:#fff;padding:0 11px;font:inherit;font-size:.86rem}.filter-control[type="search"]{padding:0 13px}.organizer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.organizer-actions .btn{width:auto;padding:8px 11px;font-size:.8rem;background:#15243a;border:1px solid var(--line)}
.language-groups{display:grid;gap:12px}.language-group{border:1px solid var(--line);border-radius:16px;background:rgba(15,23,31,.72);overflow:hidden}.language-group summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;cursor:pointer;user-select:none}.language-group summary::-webkit-details-marker{display:none}.language-group summary:hover{background:rgba(255,255,255,.025)}.language-summary-main{display:flex;align-items:center;gap:10px;min-width:0}.language-chevron{font-size:1rem;transition:transform .15s;color:var(--green)}.language-group[open] .language-chevron{transform:rotate(90deg)}.language-title{font-size:1.05rem;font-weight:800}.language-code{color:var(--muted);font-size:.76rem;text-transform:uppercase}.language-count{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:#d8e6fb;font-size:.77rem;white-space:nowrap}.language-body{padding:0 14px 14px}
.preview-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}.preview-btn{width:100%;border:1px solid var(--line2);border-radius:10px;padding:9px 10px;background:#0e1b2b;color:#dceaff;font:inherit;font-size:.82rem;font-weight:750;cursor:pointer}.preview-btn:hover{border-color:rgba(99,184,255,.45);background:#13263c}.preview-btn.playing{border-color:rgba(94,224,131,.5);color:#d9ffe6;background:rgba(94,224,131,.08)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:linear-gradient(180deg,rgba(20,29,39,.98),rgba(12,18,24,.98));border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:0 18px 48px rgba(0,0,0,.24);display:flex;flex-direction:column;min-height:286px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.lang{font-size:1.2rem;font-weight:780}.variant{color:var(--muted);margin-top:4px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:.75rem;color:#d8e6fb;white-space:nowrap}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.desc{color:var(--muted);font-size:.9rem;line-height:1.5;margin:18px 0;flex:1}.price{font-size:1.55rem;font-weight:850;margin-bottom:12px}.price.free{color:var(--good)}
.btn{width:100%;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:780;cursor:pointer;background:linear-gradient(135deg,#31bf62,#248a46);color:#fff;transition:.16s;text-decoration:none;text-align:center}.card-actions{display:grid;gap:8px}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.btn.secondary{background:#15243a;border:1px solid var(--line)}
.empty,.error{padding:24px;border:1px solid var(--line);border-radius:16px;color:var(--muted)}.error{color:#ffc6ce;border-color:rgba(255,122,138,.3);background:rgba(255,122,138,.07)}
.custom{margin-top:34px;padding:24px;border-radius:22px;background:linear-gradient(145deg,rgba(18,29,43,.98),rgba(11,18,27,.98));border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.3)}.custom-head{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}.custom h2{font-size:clamp(1.7rem,4vw,2.5rem);margin:.35rem 0 .6rem}.custom-text{color:var(--muted);max-width:780px;line-height:1.6}.custom-price{text-align:right}.custom-price small{display:block;color:var(--muted)}.custom-price strong{font-size:2rem;color:#fff}

<main class="shell">
<div class="topbar"><nav class="navlinks" aria-label="Site navigation"><a class="home-link" href="/" data-i18n="homeNav"></a><a href="/refunds" data-i18n="refund"></a><a href="/terms" data-i18n="terms"></a><a href="/privacy" data-i18n="privacy"></a></nav><select id="site-language" class="lang-select" aria-label="Language"><option value="hu">Magyar</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option><option value="pt">Português</option><option value="nl">Nederlands</option><option value="pl">Polski</option><option value="cs">Čeština</option><option value="sk">Slovenčina</option><option value="ro">Română</option><option value="da">Dansk</option><option value="sv">Svenska</option><option value="no">Norsk</option><option value="fi">Suomi</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="tr">Türkçe</option><option value="th">ไทย</option><option value="vi">Tiếng Việt</option><option value="ko">한국어</option><option value="km">ខ្មែរ</option></select></div>
<section class="hero"><div class="eyebrow" data-i18n="eyebrow">ANTHBOT Community</div><h1 data-i18n="title">Voice Store</h1><div class="lead" data-i18n="lead"></div></section>
<div class="price-banner"><div><strong data-i18n="readyTitle"></strong><span data-i18n="readyText"></span></div><div class="price-big">€7.99</div></div>
<div class="notice" id="notice"></div>
<section class="account-panel" id="account-panel">
  <div class="account-head"><div><strong id="account-title"></strong><div class="account-sub" id="account-lead"></div></div><span class="account-chip" id="account-badge"></span></div>
  <div id="account-logged-out">
    <div class="account-grid">
      <input class="account-input" id="account-email" type="email" autocomplete="email">
      <button class="btn" type="button" id="account-send"></button>
      <span></span>
    </div>
    <div class="account-grid hidden" id="account-code-row">
      <input class="account-input" id="account-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      <button class="btn" type="button" id="account-verify"></button>
      <span></span>
    </div>
  </div>
  <div id="account-logged-in" class="hidden">
    <div class="account-state"><span class="account-chip" id="account-email-label"></span><span class="account-chip" id="account-purchases"></span><span class="account-chip" id="account-maps"></span></div>
    <div class="account-actions"><button class="btn hidden" type="button" id="account-link-map"></button><button class="btn secondary" type="button" id="account-logout"></button></div>
  </div>
  <div class="account-message" id="account-message"></div>
</section>
<section class="organizer" id="voice-organizer">
  <div class="organizer-head"><strong id="organizer-title"></strong><span class="organizer-summary" id="voice-results-summary"></span></div>
  <div class="organizer-grid">
    <input class="filter-control voice-search" id="voice-search" type="search" autocomplete="off">
    <select class="filter-control" id="filter-language"></select>
    <select class="filter-control" id="filter-gender"></select>
    <select class="filter-control" id="filter-model"></select>
    <select class="filter-control" id="filter-access"></select>
  </div>
  <div class="organizer-actions"><button class="btn secondary" type="button" id="expand-groups"></button><button class="btn secondary" type="button" id="collapse-groups"></button></div>
</section>
<div id="content"><div class="empty" data-i18n="loading">Loading voice packs…</div></div>

<section class="custom" id="custom-voice">
  <div class="custom-head"><div><div class="eyebrow" data-i18n="customEyebrow"></div><h2 data-i18n="customTitle"></h2><div class="custom-text" data-i18n="customText"></div></div><div class="custom-price"><small data-i18n="from"></small><strong>€24.99</strong></div></div>
  <form class="form" id="custom-form">
    <div class="field"><label for="requested-language" data-i18n="requestedLanguage"></label><input id="requested-language" maxlength="64" required></div>
    <div class="field"><label for="voice-style" data-i18n="voiceStyle"></label><input id="voice-style" maxlength="128" required></div>
    <div class="field"><label for="robot-model" data-i18n="model"></label><input id="robot-model" maxlength="128" value="Genie 1000" required></div>
    <div class="field"><label for="contact" data-i18n="contact"></label><input id="contact" maxlength="254" required></div>
    <div class="field wide"><label for="notes" data-i18n="notes"></label><textarea id="notes" maxlength="2000"></textarea></div>
    <div class="form-actions"><button type="submit" class="btn" id="custom-submit" data-i18n="send"></button><span class="form-status" id="custom-status"></span></div>
  </form>
</section>

<div class="footer"><div data-i18n="footer"></div><div class="footerlinks"><a href="/" data-i18n="home"></a><a href="/refunds" data-i18n="refund"></a><a href="/terms" data-i18n="terms"></a><a href="/privacy" data-i18n="privacy"></a></div></div>
</main>

function initialLanguage(){
  let saved='';try{saved=localStorage.getItem('mqb-site-language')||''}catch(_){}
  if(SUPPORTED.includes(saved))return saved;
  const raw=(navigator.language||'en');
  if(SUPPORTED.includes(raw))return raw;
  const short=raw.slice(0,2).toLowerCase();
  const direct=SUPPORTED.find(x=>x.toLowerCase()===short);
  return direct||'en';

async function resumePendingPurchase(){
  if(!accountState.authenticated)return;
  if(pairCode&&!accountState.linked)return;
  let target=pendingPurchaseId;
  if(!target&&qs.get('checkout')==='1'){
    const voiceId=qs.get('voice_id')||'',packId=qs.get('pack_id')||'';
    const found=(packsCache||[]).find(p=>(voiceId&&String(p.community_id||'')===voiceId)||(packId&&String(p.id||'')===packId));
    if(found)target=found.id;
  }
  if(!target||autoCheckoutAttempted)return;
  autoCheckoutAttempted=true;
  pendingPurchaseId=null;
  const ghost={textContent:'',disabled:false};
  await buy(target,ghost);

const INSTALLER_LABEL={hu:'Telepítés Home Assistant nélkül',en:'Install without Home Assistant',de:'Ohne Home Assistant installieren',fr:'Installer sans Home Assistant',es:'Instalar sin Home Assistant',it:'Installa senza Home Assistant',pt:'Instalar sem Home Assistant',nl:'Installeren zonder Home Assistant',pl:'Zainstaluj bez Home Assistant',cs:'Nainstalovat bez Home Assistant',sk:'Nainštalovať bez Home Assistant',ro:'Instalează fără Home Assistant',da:'Installer uden Home Assistant',sv:'Installera utan Home Assistant',no:'Installer uten Home Assistant',fi:'Asenna ilman Home Assistantia','zh-CN':'无需 Home Assistant 安装','zh-TW':'無需 Home Assistant 安裝',tr:'Home Assistant olmadan yükle',th:'ติดตั้งโดยไม่ใช้ Home Assistant',vi:'Cài đặt không cần Home Assistant',ko:'Home Assistant 없이 설치',km:'ដំឡើងដោយមិនប្រើ Home Assistant'};
function installerLabel(){return INSTALLER_LABEL[currentLang]||INSTALLER_LABEL.en}
let packsCache=null,errorCache=null,installerAvailable=false;
let previewAudio=null,previewButton=null,renderedGroups=[];

function packLanguage(p){return String(p.language||p.language_code||'Voice pack')}
function packModels(p){return Array.isArray(p.models)&&p.models.length?p.models.map(String):['Anthbot Genie 1000']}
function genderBucket(p){
  const raw=String(p.voice_gender||'').trim().toLowerCase();
  if(raw==='female'||raw==='f'||raw.includes('female'))return 'female';
  if(raw==='male'||raw==='m'||raw.includes('male'))return 'male';
  return 'other';
}
function genderLabel(p){
  const bucket=genderBucket(p);
  return bucket==='female'?ou('female'):(bucket==='male'?ou('male'):ou('other'));
}
function setSelectOptions(select,items,previous){
  select.innerHTML=items.map(item=>'<option value="'+esc(item.value)+'">'+esc(item.label)+'</option>').join('');
  if(items.some(item=>item.value===previous))select.value=previous;
}
function rebuildOrganizerOptions(){
  if(!packsCache)return;
  const languageSelect=document.getElementById('filter-language');
  const genderSelect=document.getElementById('filter-gender');
  const modelSelect=document.getElementById('filter-model');
  const accessSelect=document.getElementById('filter-access');
  const oldLanguage=languageSelect.value,oldGender=genderSelect.value,oldModel=modelSelect.value,oldAccess=accessSelect.value;
  const languages=[...new Set(packsCache.map(packLanguage))].sort((a,b)=>a.localeCompare(b,LOCALE[currentLang]||undefined,{sensitivity:'base'}));
  const models=[...new Set(packsCache.flatMap(packModels))].sort((a,b)=>a.localeCompare(b,LOCALE[currentLang]||undefined,{sensitivity:'base'}));
  setSelectOptions(languageSelect,[{value:'',label:ou('allLanguages')},...languages.map(v=>({value:v,label:v}))],oldLanguage);
  setSelectOptions(genderSelect,[{value:'',label:ou('allGenders')},{value:'female',label:ou('female')},{value:'male',label:ou('male')},{value:'other',label:ou('other')}],oldGender);
  setSelectOptions(modelSelect,[{value:'',label:ou('allModels')},...models.map(v=>({value:v,label:v}))],oldModel);
  setSelectOptions(accessSelect,[{value:'',label:ou('allAccess')},{value:'free',label:t('free')},{value:'paid',label:t('paid')},{value:'purchased',label:ou('purchased')}],oldAccess);
}
function applyOrganizerLanguage(){
  document.getElementById('organizer-title').textContent=ou('filtersTitle');
  document.getElementById('voice-search').placeholder=ou('search');
  document.getElementById('expand-groups').textContent=ou('expandAll');
  document.getElementById('collapse-groups').textContent=ou('collapseAll');
  rebuildOrganizerOptions();
}
function organizerFilteredPacks(){
  if(!packsCache)return [];
  const query=document.getElementById('voice-search').value.trim().toLowerCase();
  const language=document.getElementById('filter-language').value;
  const gender=document.getElementById('filter-gender').value;
  const model=document.getElementById('filter-model').value;
  const access=document.getElementById('filter-access').value;
  return packsCache.filter(p=>{
    if(language&&packLanguage(p)!==language)return false;
    if(gender&&genderBucket(p)!==gender)return false;
    if(model&&!packModels(p).includes(model))return false;
    if(access==='free'&&p.access!=='free')return false;
    if(access==='paid'&&p.access!=='paid')return false;
    if(access==='purchased'&&!p.owned)return false;
    if(query){
      const haystack=[
        p.language,p.language_code,p.variant_name,p.variant_id,p.community_id,
        p.voice_gender,p.version,...packModels(p)
      ].filter(Boolean).join(' ').toLowerCase();
      if(!haystack.includes(query))return false;
    }
    return true;
  });
}
function organizerFiltersActive(){
  return Boolean(
    document.getElementById('voice-search').value.trim()||
    document.getElementById('filter-language').value||
    document.getElementById('filter-gender').value||
    document.getElementById('filter-model').value||
    document.getElementById('filter-access').value
  );
}
function resetPreviewButton(){
  if(previewButton){
    previewButton.classList.remove('playing');
    previewButton.textContent='▶ '+String(previewButton.dataset.previewLabel||ou('sample1'));
  }
}
function stopPreview(){
  if(previewAudio){
    previewAudio.pause();
    try{previewAudio.currentTime=0}catch(_){}
  }
  previewAudio=null;
  resetPreviewButton();
  previewButton=null;
}
function playPreview(url,button){
  if(previewButton===button&&previewAudio&&!previewAudio.paused){stopPreview();return}
  stopPreview();
  const audio=new Audio(url);
  let failed=false;
  previewAudio=audio;previewButton=button;
  button.classList.add('playing');
  button.textContent='■ '+ou('stop');
  const fail=()=>{
    if(failed)return;
    failed=true;
    if(previewAudio===audio)stopPreview();
    alert(ou('previewError'));
  };
  audio.onended=()=>{if(previewAudio===audio)stopPreview()};
  audio.onerror=fail;
  const pending=audio.play();
  if(pending&&typeof pending.catch==='function')pending.catch(fail);
}
function bindPreviewButtons(root){
  root.querySelectorAll('[data-preview-url]').forEach(button=>{
    button.addEventListener('click',()=>playPreview(button.dataset.previewUrl||'',button));
  });
}
function hydrateGroup(details){
  if(details.dataset.hydrated==='1')return;
  const index=Number(details.dataset.groupIndex||'-1');
  const group=renderedGroups[index];
  const body=details.querySelector('.language-body');
  if(!group||!body)return;
  body.innerHTML='<div class="grid">'+group.items.map(card).join('')+'</div>';
  body.dataset.hydrated='1';
  bindPreviewButtons(body);
}
function setupOrganizerEvents(){
  let timer=null;
  document.getElementById('voice-search').addEventListener('input',()=>{
    clearTimeout(timer);timer=setTimeout(renderCurrent,100);
  });
  ['filter-language','filter-gender','filter-model','filter-access'].forEach(id=>{
    document.getElementById(id).addEventListener('change',renderCurrent);

  document.getElementById('expand-groups').addEventListener('click',()=>{
    document.querySelectorAll('.language-group').forEach(details=>{details.open=true;hydrateGroup(details)});
  });
  document.getElementById('collapse-groups').addEventListener('click',()=>{
    stopPreview();
    document.querySelectorAll('.language-group').forEach(details=>{details.open=false});
  });
}
async function buy(packId,button){
  if(!accountState.authenticated){
    pendingPurchaseId=packId;setAccountMessage(au('loginRequired'),'bad');document.getElementById('account-panel').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('account-email').focus();return;
  }
  if(pairCode&&!accountState.linked){
    pendingPurchaseId=packId;setAccountMessage(au('linkRequired'),'bad');document.getElementById('account-panel').scrollIntoView({behavior:'smooth',block:'center'});return;
  }
  const original=button.textContent;button.disabled=true;button.textContent=t('opening');
  try{
    const payload={pack_id:packId};if(pairCode)payload.pair_code=pairCode;
    const res=await fetch('/api/anthbot/store/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.detail||('HTTP '+res.status));
    if(data.already_owned){button.textContent=t('alreadyOwned');button.disabled=true;const n=document.getElementById('notice');n.style.display='block';n.style.borderColor='rgba(127,225,191,.32)';n.style.background='rgba(127,225,191,.07)';n.style.color='#c9ffed';n.textContent=t('ownedNotice');return}
    location.href=data.checkout_url;
  }catch(err){alert(t('paymentError')+': '+err.message);button.disabled=false;button.textContent=original}
}
function card(p){
  const paid=p.access==='paid';
  const models=packModels(p).join(', ');
  const price=paid?money(p.price_amount,p.currency):t('free');
  const ownedWeb=paid&&p.owned&&p.ownership==='web';
  const action=ownedWeb
    ? '<button class="btn secondary" disabled>'+t('alreadyOwned')+'</button>'
    : (paid
      ? '<button class="btn" '+(p.checkout_available?'':'disabled')+' onclick="buy(\''+esc(p.id)+'\',this)">'+(p.checkout_available?t('buy'):t('checkoutDisabled'))+'</button>'
      : '<button class="btn secondary" disabled>'+t('availableMap')+'</button>');
  const webInstall=installerAvailable?'<a class="btn '+(ownedWeb?'':'secondary')+'" href="/voice-installer?pack='+encodeURIComponent(p.id)+'">'+esc(installerLabel())+'</a>':'';
  const samples=Array.isArray(p.preview_samples)?p.preview_samples.slice(0,2):[];
  const previews=samples.length
    ? '<div class="preview-row">'+samples.map((sample,index)=>{
        const label=index===0?ou('sample1'):ou('sample2');
        return '<button type="button" class="preview-btn" data-preview-url="'+esc(sample.url||'')+'" data-preview-label="'+esc(label)+'">▶ '+esc(label)+'</button>';
      }).join('')+'</div>'
    : '';
  return '<article class="card"><div class="row"><div><div class="lang">'+esc(packLanguage(p))+'</div><div class="variant">'+esc(p.variant_name||p.community_id||'Community')+'</div></div><span class="pill">'+(paid?t('paid'):t('free'))+'</span></div><div class="meta"><span class="pill">'+esc(genderLabel(p))+'</span><span class="pill">'+esc(models)+'</span><span class="pill">v'+esc(p.version||'—')+'</span></div><div class="desc">'+esc(t('desc'))+'</div>'+previews+'<div class="price '+(paid?'':'free')+'">'+esc(price)+'</div><div class="card-actions">'+action+webInstall+'</div></article>';
}
function renderCurrent(){
  stopPreview();
  const root=document.getElementById('content');
  const summary=document.getElementById('voice-results-summary');
  if(errorCache){summary.textContent='';root.innerHTML='<div class="error">'+esc(t('loadError'))+': '+esc(errorCache)+'</div>';return}
  if(!packsCache){summary.textContent='';root.innerHTML='<div class="empty">'+esc(t('loading'))+'</div>';return}

  const filtered=organizerFilteredPacks();
  const grouped=new Map();
  filtered.forEach(pack=>{
    const name=packLanguage(pack);
    if(!grouped.has(name))grouped.set(name,{name,codes:new Set(),items:[]});
    const group=grouped.get(name);
    if(pack.language_code)group.codes.add(String(pack.language_code));
    group.items.push(pack);
  });
  renderedGroups=[...grouped.values()].sort((a,b)=>a.name.localeCompare(b.name,LOCALE[currentLang]||undefined,{sensitivity:'base'}));
  renderedGroups.forEach(group=>group.items.sort((a,b)=>String(a.variant_name||a.community_id||'').localeCompare(String(b.variant_name||b.community_id||''),LOCALE[currentLang]||undefined,{sensitivity:'base'})));
  summary.textContent=ou('showing')+' '+filtered.length+' '+ou('voices')+' · '+renderedGroups.length+' '+ou('languages');

  if(!filtered.length){root.innerHTML='<div class="empty">'+esc(ou('noMatches'))+'</div>';return}

  const autoOpen=organizerFiltersActive()&&filtered.length<=24;
  root.innerHTML='<div class="language-groups">'+renderedGroups.map((group,index)=>{
    const codes=[...group.codes].sort().join(' · ');
    return '<details class="language-group" data-group-index="'+index+'" '+(autoOpen?'open':'')+'><summary><div class="language-summary-main"><span class="language-chevron">›</span><div><div class="language-title">'+esc(group.name)+'</div>'+(codes?'<div class="language-code">'+esc(codes)+'</div>':'')+'</div></div><span class="language-count">'+group.items.length+' '+esc(ou('voices'))+'</span></summary><div class="language-body"></div></details>';
  }).join('')+'</div>';

  root.querySelectorAll('.language-group').forEach(details=>{
    details.addEventListener('toggle',()=>{if(details.open)hydrateGroup(details)});
    if(details.open)hydrateGroup(details);
  });
}
async function boot(){
  await refreshAccount();
  try{
    const res=await fetch('/api/anthbot/store/voice-packs',{cache:'no-store'});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.detail||('HTTP '+res.status));
    packsCache=Array.isArray(data.packs)?data.packs:[];
    installerAvailable=Boolean(data.web_installer_available);
    errorCache=null;
    rebuildOrganizerOptions();
  }catch(err){errorCache=err.message}
  renderCurrent();
  await resumePendingPurchase();
}
document.getElementById('site-language').addEventListener('change',e=>applyLanguage(e.target.value));
document.getElementById('custom-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('custom-submit'),status=document.getElementById('custom-status');
  const payload={requested_language:document.getElementById('requested-language').value.trim(),voice_style:document.getElementById('voice-style').value.trim(),model:document.getElementById('robot-model').value.trim(),contact:document.getElementById('contact').value.trim(),notes:document.getElementById('notes').value.trim(),site_language:currentLang};
  if(!payload.requested_language||!payload.voice_style||!payload.model||!payload.contact){status.className='form-status bad';status.textContent=t('required');return}
  btn.disabled=true;btn.textContent=t('sending');status.textContent='';
  try{const res=await fetch('/api/anthbot/store/custom-voice-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.detail||('HTTP '+res.status));status.className='form-status good';status.textContent=t('sent');document.getElementById('notes').value=''}
  catch(err){status.className='form-status bad';status.textContent=t('requestError')+': '+err.message}
  finally{btn.disabled=false;btn.textContent=t('send')}
});
setupOrganizerEvents();applyLanguage(initialLanguage());boot();
</script>
