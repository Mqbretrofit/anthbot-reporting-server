<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ANTHBOT üzenetek és újdonságok</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#121a2a;--panel2:#182235;--line:#263349;--text:#eef4ff;--muted:#9fb0ca;--accent:#6aa9ff;--good:#80e0c7;--danger:#ff7a8a;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#14233d 0,var(--bg) 34rem),var(--bg);color:var(--text);min-height:100vh}.shell{max-width:1280px;margin:auto;padding:26px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.head h1{margin:0 0 5px;font-size:clamp(1.4rem,3vw,2rem)}.muted{color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:11px;cursor:pointer;font:inherit;font-weight:700}.btn.primary{border:0;background:linear-gradient(135deg,#4f8fe8,#6c63e7)}.btn.danger{color:#ffdfe4;border-color:rgba(255,122,138,.38)}.grid{display:grid;grid-template-columns:minmax(360px,.95fr) minmax(420px,1.25fr);gap:18px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(24,34,53,.97),rgba(15,23,38,.97));padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}h2{margin:0 0 15px;font-size:1.12rem}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{display:grid;gap:6px;color:var(--muted);font-size:.82rem}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#0d1626;color:var(--text);padding:10px;font:inherit;outline:none}textarea{min-height:104px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--accent)}.checks{display:flex;gap:18px;flex-wrap:wrap;padding:4px 0}.checks label{display:flex;align-items:center;gap:8px}.checks input{width:auto}.target-box{display:grid;gap:8px}.target-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.target-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.target-head button{border:0;background:transparent;color:var(--accent);cursor:pointer;font:inherit;font-size:.8rem}.target-list{display:grid;gap:5px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#0d1626;padding:8px}.target-choice{display:grid;grid-template-columns:20px 1fr;align-items:start;gap:8px;padding:7px;border-radius:8px;color:var(--text);font-size:.82rem}.target-choice:hover{background:rgba(106,169,255,.08)}.target-choice input{width:auto;margin-top:2px}.target-choice small{display:block;color:var(--muted);margin-top:3px;font-family:ui-monospace,monospace;overflow-wrap:anywhere}.target-empty{padding:14px;text-align:center;color:var(--muted)}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:13px;background:#0d1626;padding:13px}.item-head{display:flex;justify-content:space-between;gap:12px}.item-title{font-weight:800}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.badge{border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--muted);font-size:.73rem}.badge.live{color:#baf7e7;border-color:rgba(128,224,199,.32)}.badge.critical{color:#ffd7dc;border-color:rgba(255,122,138,.4)}.item-body{margin-top:8px;color:#c8d7ed;white-space:pre-wrap;font-size:.88rem;line-height:1.45}.item-actions{display:flex;gap:8px;margin-top:11px}.empty{padding:25px;text-align:center;color:var(--muted)}.status{min-height:22px;margin-top:10px;color:var(--good)}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:620px){.shell{padding:14px}.head{flex-direction:column}.fields{grid-template-columns:1fr}.full{grid-column:auto}.target-head{align-items:flex-start;flex-direction:column}.target-actions{justify-content:flex-start}}
  </style>
</head>
<body><main class="shell">
  <header class="head"><div><h1>Üzenetek és újdonságok</h1><div class="muted">Távoli ANTHBOT Map hírek, verzióüzenetek és fontos figyelmeztetések</div></div><div class="actions"><button class="btn" id="back">Vissza</button><button class="btn" id="refresh">Frissítés</button></div></header>
  <div class="grid">
    <section class="card"><h2 id="form-title">Új üzenet</h2><form id="form"><div class="fields">
      <label class="full">Azonosító (üresen automatikus)<input id="announcement_id" maxlength="80" placeholder="peldaul-2495-beta"></label>
      <label>Típus<select id="category"><option value="news">Újdonság</option><option value="personal">Személyes üzenet</option><option value="release">Új verzió</option><option value="maintenance">Karbantartás</option><option value="outage">Szolgáltatáskiesés</option><option value="voice">Hangcsomag</option></select></label>
      <label>Fontosság<select id="priority"><option value="normal">Normál</option><option value="important">Fontos</option><option value="critical">Kritikus</option></select></label>
      <label class="full">Magyar cím<input id="title_hu" maxlength="160" required></label>
      <label class="full">Magyar szöveg<textarea id="body_hu" maxlength="4000" required></textarea></label>
      <label class="full">Magyar linkfelirat<input id="link_label_hu" maxlength="100" placeholder="Részletek"></label>
      <label class="full">Angol cím<input id="title_en" maxlength="160" required></label>
      <label class="full">Angol szöveg<textarea id="body_en" maxlength="4000" required></textarea></label>
      <label class="full">Angol linkfelirat<input id="link_label_en" maxlength="100" placeholder="Learn more"></label>
      <label class="full">További fordítások JSON-ban<textarea id="extra_translations" placeholder='{"de":{"title":"…","body":"…","link_label":"…"}}'></textarea></label>
      <label class="full">HTTPS hivatkozás<input id="link_url" maxlength="2048" placeholder="https://anthbotmap.com/..."></label>
      <label>Célverzió ettől<input id="min_version" maxlength="64" placeholder="2.4.9.5-beta1"></label>
      <label>Célverzió eddig<input id="max_version" maxlength="64"></label>
      <div class="target-box full"><div class="target-head"><span class="muted">Célmodellek — több is kijelölhető</span><div class="target-actions"><button type="button" data-select-all-target="model">Összes kijelölése</button><button type="button" data-clear-target="model">Kijelölés törlése</button></div></div><div class="target-list" id="target_models"><div class="target-empty">Betöltés…</div></div></div>
      <div class="target-box full"><div class="target-head"><span class="muted">Konkrét telepítések — üresen minden telepítés</span><button type="button" data-clear-target="installation">Kijelölés törlése</button></div><input id="installation_search" placeholder="Keresés azonosító, verzió vagy modell alapján…"><div class="target-list" id="target_installations"><div class="target-empty">Betöltés…</div></div></div>
      <label>Közzététel ideje<input id="published_at" type="datetime-local"></label>
      <label>Lejárat<input id="expires_at" type="datetime-local"></label>
      <div class="checks full"><label><input id="published" type="checkbox"> Közzétéve</label><label><input id="show_popup" type="checkbox"> Egyszeri felugró ablak</label></div>
    </div><div class="form-actions"><button type="button" class="btn" id="clear">Új</button><button type="submit" class="btn primary">Mentés</button></div><div class="status" id="status"></div></form></section>
    <section class="card"><h2>Elmentett üzenetek</h2><div class="list" id="list"><div class="empty">Betöltés…</div></div></section>
  </div>
</main><script>
const $=id=>document.getElementById(id);let items=[],targets={models:[],installations:[]},selectedInstallations=new Set();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,options={}){const res=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(res.status===401){location.href='/dashboard';throw new Error('Nincs jogosultság')}if(!res.ok)throw new Error((await res.json().catch(()=>({}))).detail||`HTTP ${res.status}`);return res.status===204?{}:res.json()}
function isoLocal(value){if(!value)return'';const d=new Date(value);if(Number.isNaN(d.getTime()))return'';const off=d.getTimezoneOffset()*60000;return new Date(d.getTime()-off).toISOString().slice(0,16)}function toIso(value){return value?new Date(value).toISOString():null}
function translation(item,lang){return item.translations?.[lang]||{title:'',body:'',link_label:''}}
function chosen(kind){return kind==='installation'?[...selectedInstallations]:[...document.querySelectorAll(`input[name="target_${kind}"]:checked`)].map(input=>input.value)}
function renderModels(selected=[]){const selectedSet=new Set(selected);const box=$('target_models');box.innerHTML=targets.models.length?targets.models.map(model=>`<label class="target-choice"><input type="checkbox" name="target_model" value="${esc(model.name)}" ${selectedSet.has(model.name)?'checked':''}><span><strong>${esc(model.name)}</strong><small>${model.installation_count} telepítés</small></span></label>`).join(''):'<div class="target-empty">Még nincs jelentett robotmodell.</div>'}
function renderInstallations(selected=null){if(selected!==null)selectedInstallations=new Set(selected);else document.querySelectorAll('input[name="target_installation"]').forEach(input=>input.checked?selectedInstallations.add(input.value):selectedInstallations.delete(input.value));const needle=$('installation_search').value.trim().toLowerCase();const values=targets.installations.filter(item=>!needle||`${item.installation_id} ${item.version} ${(item.models||[]).join(' ')}`.toLowerCase().includes(needle));const box=$('target_installations');box.innerHTML=values.length?values.map(item=>`<label class="target-choice"><input type="checkbox" name="target_installation" value="${esc(item.installation_id)}" ${selectedInstallations.has(item.installation_id)?'checked':''}><span><strong>${esc((item.models||[]).join(' · ')||'Ismeretlen modell')}</strong><small>${esc(item.installation_id)} · ${esc(item.version||'ismeretlen verzió')}</small></span></label>`).join(''):'<div class="target-empty">Nincs megfelelő telepítés.</div>';box.querySelectorAll('input[name="target_installation"]').forEach(input=>input.addEventListener('change',()=>input.checked?selectedInstallations.add(input.value):selectedInstallations.delete(input.value)))}
function render(){const box=$('list');if(!items.length){box.innerHTML='<div class="empty">Még nincs üzenet.</div>';return}box.innerHTML=items.map(item=>{const t=translation(item,'hu');const installs=item.target_installations||[];return `<article class="item"><div class="item-head"><div><div class="item-title">${esc(t.title||item.announcement_id)}</div><div class="muted">${esc(item.announcement_id)}</div></div><span class="badge ${item.published?'live':''}">${item.published?'közzétéve':'piszkozat'}</span></div><div class="badges"><span class="badge">${esc(item.category)}</span><span class="badge ${item.priority==='critical'?'critical':''}">${esc(item.priority)}</span>${item.show_popup?'<span class="badge">popup</span>':''}${item.target_models?.map(m=>`<span class="badge">${esc(m)}</span>`).join('')||''}${installs.map(id=>`<span class="badge">telepítés: ${esc(id.slice(0,8))}…</span>`).join('')}</div><div class="item-body">${esc(t.body||'')}</div><div class="item-actions"><button class="btn" data-edit="${esc(item.announcement_id)}">Szerkesztés</button><button class="btn danger" data-delete="${esc(item.announcement_id)}">Törlés</button></div></article>`}).join('');box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));box.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeItem(b.dataset.delete))}
async function load(){const[data,targetData]=await Promise.all([api('/api/anthbot/admin/announcements'),api('/api/anthbot/admin/announcement-targets')]);items=data.items||[];targets=targetData||{models:[],installations:[]};renderModels();renderInstallations([]);render()}
function reset(){$('form').reset();selectedInstallations.clear();document.querySelectorAll('input[name^="target_"]').forEach(input=>input.checked=false);$('announcement_id').disabled=false;$('form-title').textContent='Új üzenet';$('status').textContent='';renderInstallations([])}
function edit(id){const item=items.find(x=>x.announcement_id===id);if(!item)return;reset();$('form-title').textContent='Üzenet szerkesztése';$('announcement_id').value=item.announcement_id;$('announcement_id').disabled=true;$('category').value=item.category;$('priority').value=item.priority;$('published').checked=item.published;$('show_popup').checked=item.show_popup;$('published_at').value=isoLocal(item.published_at);$('expires_at').value=isoLocal(item.expires_at);$('min_version').value=item.min_version||'';$('max_version').value=item.max_version||'';$('link_url').value=item.link_url||'';renderModels(item.target_models||[]);renderInstallations(item.target_installations||[]);for(const lang of ['hu','en']){const t=translation(item,lang);$(`title_${lang}`).value=t.title||'';$(`body_${lang}`).value=t.body||'';$(`link_label_${lang}`).value=t.link_label||''}const extra={...item.translations};delete extra.hu;delete extra.en;$('extra_translations').value=Object.keys(extra).length?JSON.stringify(extra,null,2):'';window.scrollTo({top:0,behavior:'smooth'})}
async function removeItem(id){if(!confirm(`Biztosan törlöd?\n\n${id}`))return;await api('/api/anthbot/admin/announcements/'+encodeURIComponent(id),{method:'DELETE'});await load()}
$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='Mentés…';try{let extra={};if($('extra_translations').value.trim())extra=JSON.parse($('extra_translations').value);const translations={...extra,hu:{title:$('title_hu').value,body:$('body_hu').value,link_label:$('link_label_hu').value||null},en:{title:$('title_en').value,body:$('body_en').value,link_label:$('link_label_en').value||null}};const body={announcement_id:$('announcement_id').value||null,category:$('category').value,priority:$('priority').value,published:$('published').checked,show_popup:$('show_popup').checked,published_at:toIso($('published_at').value),expires_at:toIso($('expires_at').value),min_version:$('min_version').value||null,max_version:$('max_version').value||null,target_models:chosen('model'),target_installations:chosen('installation'),translations,link_url:$('link_url').value||null};await api('/api/anthbot/admin/announcements',{method:'POST',body:JSON.stringify(body)});$('status').textContent='Elmentve.';reset();await load()}catch(err){$('status').textContent='Hiba: '+err.message}};
$('installation_search').addEventListener('input',()=>renderInstallations());document.querySelectorAll('[data-select-all-target]').forEach(button=>button.onclick=()=>document.querySelectorAll(`input[name="target_${button.dataset.selectAllTarget}"]`).forEach(input=>input.checked=true));document.querySelectorAll('[data-clear-target]').forEach(button=>button.onclick=()=>{if(button.dataset.clearTarget==='installation')selectedInstallations.clear();document.querySelectorAll(`input[name="target_${button.dataset.clearTarget}"]`).forEach(input=>input.checked=false)});$('clear').onclick=reset;$('refresh').onclick=load;$('back').onclick=()=>location.href='/dashboard';load().catch(err=>$('list').innerHTML=`<div class="empty">${esc(err.message)}</div>`);
</script></body></html>
