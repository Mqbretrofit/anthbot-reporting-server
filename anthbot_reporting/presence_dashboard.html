<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTHBOT Presence statisztika</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#0b1220;color:#eef4ff}.shell{max-width:1400px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.btn{padding:10px 14px;border:1px solid #263349;border-radius:12px;background:#182235;color:#eef4ff;text-decoration:none;cursor:pointer}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin:22px 0}.card{background:#121a2a;border:1px solid #263349;border-radius:18px;padding:18px}.label,.muted{color:#9fb0ca}.value{font-size:2rem;font-weight:750;margin-top:7px}.charts{grid-template-columns:1fr 1fr}.bar{display:grid;grid-template-columns:minmax(110px,1fr) 3fr auto;gap:10px;align-items:center;margin:10px 0}.track{height:10px;background:#0d1626;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#6aa9ff,#80e0c7)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid #263349;text-align:left}.wrap{overflow:auto}.mono{font-family:monospace}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.shell{padding:14px}}</style></head><body><div class="shell"><div class="top"><div><h1>ANTHBOT Map Presence</h1><div class="muted">Minimális telepítési heartbeat statisztikák</div></div><div><a class="btn" href="/dashboard/error-stats">Hiba statisztikák</a> <a class="btn" href="/dashboard">← Fő dashboard</a> <button class="btn" onclick="load()">Frissítés</button></div></div><div id="content">Betöltés…</div></div><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=v=>v?new Intl.DateTimeFormat('hu-HU',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';const short=v=>v?String(v).slice(0,8)+'…':'—';function k(l,v,h){return `<div class="card"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div><div class="muted">${esc(h)}</div></div>`}function bars(a){if(!a?.length)return '<div class="muted">Még nincs adat.</div>';let m=Math.max(...a.map(x=>x.count),1);return a.map(x=>`<div class="bar"><div>${esc(x.name)}</div><div class="track"><div class="fill" style="width:${Math.max(3,x.count/m*100)}%"></div></div><div>${x.count}</div></div>`).join('')}async function load(){let r=await fetch('/api/anthbot/admin/presence-stats',{credentials:'same-origin'});if(r.status===401){location.href='/dashboard';return}let s=await r.json();document.getElementById('content').innerHTML=`<div class="grid kpis">${k('Összes telepítés',s.total,'Egyedi install_id')}${k('Aktív 24 óra',s.active_24h,'Utolsó 24 óra')}${k('Aktív 7 nap',s.active_7d,'Utolsó 7 nap')}${k('Aktív 30 nap',s.active_30d,'Utolsó 30 nap')}${k('Modellek',s.by_model.length,'Különböző modellek')}</div><div class="grid charts"><div class="card"><h2>Verzióeloszlás</h2>${bars(s.by_version)}</div><div class="card"><h2>Modellmegoszlás</h2>${bars(s.by_model)}</div></div><div class="card" style="margin-top:16px"><h2>Telepítések</h2><div class="wrap"><table><thead><tr><th>Install ID</th><th>Verzió</th><th>Modellek</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>${(s.items||[]).map(x=>`<tr><td class="mono" title="${esc(x.install_id)}">${esc(short(x.install_id))}</td><td>${esc(x.version)}</td><td>${esc(x.models||'—')}</td><td>${esc(fmt(x.first_seen))}</td><td>${esc(fmt(x.last_seen))}</td></tr>`).join('')||'<tr><td colspan="5">Még nem érkezett heartbeat.</td></tr>'}</tbody></table></div></div><div class="muted" style="margin-top:12px">Frissítve: ${esc(fmt(s.generated_at))}</div>`}load();</script></body></html>
