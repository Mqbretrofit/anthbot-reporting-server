<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANTHBOT Voice Installer | ANTHBOT Map</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:dark;--bg:#081017;--panel:#111820;--line:rgba(255,255,255,.12);--text:#fff;--muted:rgba(255,255,255,.7);--green:#5ee083;--bad:#ff98a4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,rgba(40,94,145,.34),transparent 30rem),var(--bg);color:var(--text)}.shell{max-width:940px;margin:auto;padding:20px 18px 54px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#dce9f8;text-decoration:none;border:1px solid var(--line);padding:8px 11px;border-radius:11px;background:#111b27;font-size:13px;font-weight:700}.lang{height:38px;border:1px solid var(--line);border-radius:11px;background:#111b27;color:#fff;padding:0 10px}.hero{padding:36px 0 24px}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.02;margin:.45rem 0 1rem}.lead,.sub,.fine{color:var(--muted);line-height:1.6}.card{background:linear-gradient(180deg,#141d27,#0c1218);border:1px solid var(--line);border-radius:19px;padding:20px;margin:0 0 16px;box-shadow:0 18px 48px rgba(0,0,0,.22)}.card h2{margin:0 0 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.field{display:grid;gap:6px}.field label{font-size:.85rem;font-weight:750;color:#ced8e7}.field input,.field select{width:100%;background:#09131f;color:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#31bf62,#248a46);color:#fff}.btn.secondary{background:#15243a;border:1px solid var(--line)}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:10px;margin-top:14px}.actions .btn{width:auto;min-width:190px}.notice{margin-top:14px;padding:13px 15px;border:1px solid rgba(255,210,122,.28);background:rgba(255,210,122,.07);border-radius:13px;color:#ffe5ad;line-height:1.5}.notice.good{border-color:rgba(127,225,191,.3);background:rgba(127,225,191,.07);color:#c9ffed}.notice.bad{border-color:rgba(255,152,164,.35);background:rgba(255,152,164,.08);color:#ffc6ce}.hidden{display:none!important}.progress{height:12px;background:#07111b;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:linear-gradient(90deg,#31bf62,#63b8ff);transition:width .3s}.status{margin-top:10px;color:#dce9f8}.footer{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}.footer a{color:#cfe0ff}.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;margin-right:8px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:680px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.lang{width:100%}.actions{flex-direction:column}.actions .btn{width:100%}}
</style>
</head>
<body>
<main class="shell">
<div class="top"><nav class="nav"><a href="/" data-t="home"></a><a href="/store" data-t="store"></a><a href="/privacy" data-t="privacy"></a></nav><select id="lang" class="lang"><option value="hu">Magyar</option><option value="en">English</option></select></div>
<section class="hero"><div class="eyebrow">ANTHBOT Community</div><h1 data-t="title"></h1><div class="lead" data-t="lead"></div></section>
<div id="disabled" class="notice bad hidden" data-t="disabled"></div>

<section id="login-card" class="card">
<h2 data-t="step1"></h2><div class="sub" data-t="loginLead"></div>
<form id="login-form" class="grid">
<div class="field"><label data-t="account"></label><input id="username" autocomplete="username" required></div>
<div class="field"><label data-t="password"></label><input id="password" type="password" autocomplete="current-password" required></div>
<div class="field"><label data-t="countryCode"></label><input id="area" value="36" inputmode="numeric" maxlength="4" required></div>
<div class="field"><label>&nbsp;</label><button id="login-btn" class="btn" type="submit" data-t="login"></button></div>
</form>
<div class="fine" style="margin-top:12px" data-t="credentialNote"></div>
<div id="login-status" class="notice bad hidden"></div>
</section>

<section id="install-card" class="card hidden">
<h2 data-t="step2"></h2><div class="sub" data-t="chooseLead"></div>
<div class="grid">
<div class="field"><label data-t="mower"></label><select id="device"></select></div>
<div class="field"><label data-t="voice"></label><select id="pack"></select></div>
</div>
<div id="selection-info" class="notice"></div>
<div class="notice" data-t="slotWarning"></div>
<div class="actions"><button id="primary" class="btn" type="button"></button><button id="logout" class="btn secondary" type="button" data-t="logout"></button></div>
</section>

<section id="progress-card" class="card hidden">
<h2 data-t="step3"></h2>
<div><span id="progress-device"></span> · <strong id="progress-voice"></strong></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="progress-text" class="status"></div>
<div id="finish-note" class="notice good hidden" data-t="finishNote"></div>
</section>

<div class="footer"><span data-t="footer"></span> · <a href="/terms" data-t="terms"></a> · <a href="/refunds" data-t="refunds"></a></div>
</main>
<script>
const T={
hu:{home:"Főoldal",store:"Hangbolt",privacy:"Adatvédelem",terms:"Felhasználási feltételek",refunds:"Visszatérítések",title:"ANTHBOT hang telepítése Home Assistant nélkül",lead:"Jelentkezz be az ANTHBOT-fiókoddal, válaszd ki a Genie robotot és a hangot, majd nyomj meg egyetlen gombot. Nem kell Home Assistant, licenckulcs-másolás vagy külön Windows telepítő.",disabled:"A webes hangtelepítő jelenleg ki van kapcsolva.",step1:"1. Bejelentkezés az ANTHBOT-ba",loginLead:"Ugyanazt a fiókot használd, mint az ANTHBOT alkalmazásban.",account:"ANTHBOT e-mail / felhasználónév",password:"ANTHBOT jelszó",countryCode:"Ország hívókód",login:"Bejelentkezés",credentialNote:"A jelszavad HTTPS-en keresztül csak azért érkezik a Reporting Serverhez, hogy bejelentkezzen a hivatalos ANTHBOT API-ba. Lemezre nem mentjük. Az ideiglenes ANTHBOT token csak a szerver memóriájában marad, és 20 perc után lejár.",step2:"2. Robot és hang kiválasztása",chooseLead:"Ha csak egy támogatott Genie van a fiókban, automatikusan kiválasztjuk.",mower:"Robot",voice:"Hangcsomag",slotWarning:"A Community hangok a Genie német női hanghelyét használják. A telepítés felülírja ezt a hanghelyet. A gyári hang visszaállításához töltsd le újra a német női hangot az ANTHBOT alkalmazásban.",logout:"Kijelentkezés",buy:"Megvásárlás – {price}",install:"Hang telepítése",owned:"Megvásárolva",free:"Ingyenes",unsupported:"Nem támogatott",payment:"Stripe fizetés megnyitása…",syncing:"Vásárlás ellenőrzése…",starting:"Telepítés indítása…",step3:"3. Telepítés",finishNote:"Kész. A robotnak most az új hangcsomag „itt vagyok” mondatát kell lejátszania.",footer:"Független Community eszköz. Csak saját robotodon használd.",loginFailed:"A bejelentkezés sikertelen",loadFailed:"A telepítő nem tölthető be",installFailed:"A telepítés sikertelen",cancelled:"A fizetést megszakítottad. Nem történt terhelés."},
en:{home:"Home",store:"Voice Store",privacy:"Privacy",terms:"Terms",refunds:"Refunds",title:"Install an ANTHBOT voice without Home Assistant",lead:"Sign in with your ANTHBOT account, choose your Genie and voice, then press one button. No Home Assistant, license copying or desktop installer is required.",disabled:"The web voice installer is currently disabled.",step1:"1. Sign in to ANTHBOT",loginLead:"Use the same account you use in the ANTHBOT app.",account:"ANTHBOT email / username",password:"ANTHBOT password",countryCode:"Country calling code",login:"Sign in",credentialNote:"Your password is sent over HTTPS to this Reporting Server only to sign in to the official ANTHBOT API. It is not written to disk. The temporary ANTHBOT token stays only in server memory and expires after 20 minutes.",step2:"2. Choose mower and voice",chooseLead:"If there is only one supported Genie, it is selected automatically.",mower:"Mower",voice:"Voice pack",slotWarning:"Community voices use the Genie German female voice slot. Installing a Community voice overwrites that slot. Re-downloading the official German female voice in the ANTHBOT app restores the factory voice.",logout:"Sign out",buy:"Buy – {price}",install:"Install voice",owned:"Purchased",free:"Free",unsupported:"Not supported",payment:"Opening Stripe checkout…",syncing:"Confirming purchase…",starting:"Starting installation…",step3:"3. Installation",finishNote:"Done. The mower should now play its “here I am” phrase using the newly installed voice.",footer:"Independent Community tool. Use only on a mower you own.",loginFailed:"Sign-in failed",loadFailed:"Could not load the installer",installFailed:"Installation failed",cancelled:"Payment was cancelled. Nothing was charged."}
};
let lang="hu",catalog=[],session={authenticated:false},timer=null;
function t(k){return (T[lang]||T.en)[k]||T.en[k]||k}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(a,c){try{return new Intl.NumberFormat(lang,{style:"currency",currency:String(c||"EUR").toUpperCase()}).format(Number(a||0)/100)}catch(_){return "€"+(Number(a||0)/100).toFixed(2)}}
function applyLang(v){lang=T[v]?v:"en";document.documentElement.lang=lang;document.getElementById("lang").value=lang;document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));try{localStorage.setItem("mqb-site-language",lang)}catch(_){}renderSelection()}
function initialLang(){let s="";try{s=localStorage.getItem("mqb-site-language")||""}catch(_){}if(T[s])return s;return (navigator.language||"").toLowerCase().startsWith("hu")?"hu":"en"}
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));return d}
function show(id,text,kind="bad"){const e=document.getElementById(id);e.textContent=text;e.className="notice "+kind}
function hide(id){document.getElementById(id).classList.add("hidden")}
function renderDevices(){const e=document.getElementById("device");e.innerHTML=(session.devices||[]).map(d=>'<option value="'+esc(d.device_id)+'" '+(d.supported?"":"disabled")+'>'+esc(d.alias)+" · "+esc(d.category||"—")+" · "+esc(d.serial_masked)+(d.supported?"":" · "+esc(t("unsupported")))+"</option>").join("");if(session.auto_device_id)e.value=session.auto_device_id}
function renderPacks(){const e=document.getElementById("pack"),q=new URLSearchParams(location.search).get("pack")||"";e.innerHTML=catalog.map(p=>{const state=p.owned?(p.access==="paid"?t("owned"):t("free")):money(p.price_amount,p.currency);return '<option value="'+esc(p.id)+'">'+esc(p.language||p.language_code||"Voice")+" · "+esc(p.variant_name||p.community_id||"Community")+" · "+esc(state)+"</option>"}).join("");if(q&&catalog.some(p=>p.id===q))e.value=q}
function selectedPack(){return catalog.find(p=>p.id===document.getElementById("pack").value)}
function renderSelection(){if(!catalog.length||!session.authenticated)return;const p=selectedPack();if(!p)return;document.getElementById("selection-info").textContent=(p.language||"Voice")+" · "+(p.variant_name||p.community_id||"Community")+" · "+(p.owned?(p.access==="paid"?t("owned"):t("free")):money(p.price_amount,p.currency));const b=document.getElementById("primary");b.textContent=(p.access==="paid"&&!p.owned)?t("buy").replace("{price}",money(p.price_amount,p.currency)):t("install");b.disabled=!document.getElementById("device").value}
async function boot(){try{session=await api("/api/anthbot/web-installer/session");if(!session.enabled){document.getElementById("disabled").classList.remove("hidden");document.getElementById("login-card").classList.add("hidden");return}catalog=(await api("/api/anthbot/web-installer/catalog")).packs||[];if(session.authenticated){document.getElementById("login-card").classList.add("hidden");document.getElementById("install-card").classList.remove("hidden");renderDevices();renderPacks();renderSelection()}const qs=new URLSearchParams(location.search);if(qs.get("cancelled"))show("selection-info",t("cancelled"),"bad");if(qs.get("session_id")){show("selection-info",t("syncing"),"good");await api("/api/anthbot/web-installer/purchase-sync/"+encodeURIComponent(qs.get("session_id")),{method:"POST",body:"{}"});catalog=(await api("/api/anthbot/web-installer/catalog")).packs||[];if(session.authenticated){renderPacks();renderSelection()}history.replaceState(null,"","/voice-installer?pack="+encodeURIComponent(qs.get("pack")||""))}}catch(err){show("login-status",t("loadFailed")+": "+err.message)}}
document.getElementById("login-form").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("login-btn");b.disabled=true;b.innerHTML='<span class="spinner"></span>'+esc(t("login"));hide("login-status");try{session=await api("/api/anthbot/web-installer/login",{method:"POST",body:JSON.stringify({username:document.getElementById("username").value.trim(),password:document.getElementById("password").value,area_code:document.getElementById("area").value.trim()})});document.getElementById("password").value="";catalog=(await api("/api/anthbot/web-installer/catalog")).packs||[];document.getElementById("login-card").classList.add("hidden");document.getElementById("install-card").classList.remove("hidden");renderDevices();renderPacks();renderSelection()}catch(err){show("login-status",t("loginFailed")+": "+err.message)}finally{b.disabled=false;b.textContent=t("login")}});
document.getElementById("pack").addEventListener("change",renderSelection);document.getElementById("device").addEventListener("change",renderSelection);
document.getElementById("logout").addEventListener("click",async()=>{try{await api("/api/anthbot/web-installer/logout",{method:"POST",body:"{}"})}catch(_){}location.reload()});
document.getElementById("primary").addEventListener("click",async()=>{const p=selectedPack();if(!p)return;const b=document.getElementById("primary");b.disabled=true;try{if(p.access==="paid"&&!p.owned){b.textContent=t("payment");const o=await api("/api/anthbot/web-installer/checkout",{method:"POST",body:JSON.stringify({pack_id:p.id})});if(o.already_owned){catalog=(await api("/api/anthbot/web-installer/catalog")).packs||[];renderPacks();renderSelection();return}location.href=o.checkout_url;return}b.textContent=t("starting");const o=await api("/api/anthbot/web-installer/install",{method:"POST",body:JSON.stringify({device_id:document.getElementById("device").value,pack_id:p.id})});document.getElementById("install-card").classList.add("hidden");document.getElementById("progress-card").classList.remove("hidden");document.getElementById("progress-device").textContent=o.device_name;document.getElementById("progress-voice").textContent=o.voice_name;poll(o.job_id)}catch(err){alert(t("installFailed")+": "+err.message);b.disabled=false;renderSelection()}});
async function poll(id){clearTimeout(timer);try{const s=await api("/api/anthbot/web-installer/jobs/"+encodeURIComponent(id));document.getElementById("bar").style.width=Math.max(0,Math.min(100,s.progress||0))+"%";document.getElementById("progress-text").textContent=s.message||"";if(s.status==="success"){document.getElementById("finish-note").classList.remove("hidden");return}if(s.status==="failed"){show("finish-note",t("installFailed")+": "+(s.message||""),"bad");return}timer=setTimeout(()=>poll(id),3000)}catch(err){show("finish-note",t("installFailed")+": "+err.message,"bad")}}
document.getElementById("lang").addEventListener("change",e=>applyLang(e.target.value));applyLang(initialLang());boot();
</script>
</body></html>
