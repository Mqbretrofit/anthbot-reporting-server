function jobMessage(j){if(!j)return"";const key=String(j.message_key||"");const a=j.message_args||{};if(key==="progressRobot")return fmt(t(key),{state:stateText(a.state),progress:a.progress??"—"});if(key&&T.en[key])return fmt(t(key),a);return String(j.message||"")}
function applyLang(v){lang=T[v]?v:"en";document.documentElement.lang=lang;document.getElementById("lang").value=lang;document.title=t("title")+" | ANTHBOT Map";document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));if(lastJob)document.getElementById("progress-text").textContent=jobMessage(lastJob);try{localStorage.setItem("mqb-site-language",lang)}catch(_){}renderSelection()}
function initialLang(){let saved="";try{saved=localStorage.getItem("mqb-site-language")||""}catch(_){}if(T[saved])return saved;const raw=navigator.language||"en",normalized=raw.toLowerCase(),keys=Object.keys(T),exact=keys.find(k=>k.toLowerCase()===normalized);if(exact)return exact;if(normalized.startsWith("zh"))return /(?:tw|hk|hant)/.test(normalized)?"zh-TW":"zh-CN";const short=normalized.slice(0,2);return keys.find(k=>k.toLowerCase()===short)||"en"}
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));return d}
function show(id,text,kind="bad"){const e=document.getElementById(id);e.textContent=text;e.className="notice "+kind}
function hide(id){document.getElementById(id).classList.add("hidden")}
function renderDevices(){const e=document.getElementById("device");e.innerHTML=(session.devices||[]).map(d=>'<option value="'+esc(d.device_id)+'" '+(d.supported?"":"disabled")+'>'+esc(d.alias)+" · "+esc(d.category||"—")+" · "+esc(d.serial_masked)+(d.supported?"":" · "+esc(t("unsupported")))+"</option>").join("");if(session.auto_device_id)e.value=session.auto_device_id}
function renderPacks(){const e=document.getElementById("pack"),q=new URLSearchParams(location.search).get("pack")||"";e.innerHTML=catalog.map(p=>{const state=p.owned?(p.access==="paid"?t("owned"):t("free")):money(p.price_amount,p.currency);return '<option value="'+esc(p.id)+'">'+esc(p.language||p.language_code||"Voice")+" · "+esc(p.variant_name||p.community_id||"Community")+" · "+esc(state)+"</option>"}).join("");if(q&&catalog.some(p=>p.id===q))e.value=q}
function selectedPack(){return catalog.find(p=>p.id===document.getElementById("pack").value)}
function renderSelection(){if(!catalog.length||!session.authenticated)return;const p=selectedPack();if(!p)return;document.getElementById("selection-info").textContent=(p.language||"Voice")+" · "+(p.variant_name||p.community_id||"Community")+" · "+(p.owned?(p.access==="paid"?t("owned"):t("free")):money(p.price_amount,p.currency));const b=document.getElementById("primary");b.textContent=(p.access==="paid"&&!p.owned)?t("buy").replace("{price}",money(p.price_amount,p.currency)):t("install");b.disabled=!document.getElementById("device").value}
async function boot(){try{session=await api("/api/anthbot/web-installer/session");if(!session.enabled){document.getElementById("disabled").classList.remove("hidden");document.getElementById("login-card").classList.add("hidden");return}catalog=(await api("/api/anthbot/web-installer/catalog")).packs||[];if(session.authenticated){document.getElementById("login-card").classList.add("hidden");document.getElementById("install-card").classList.remove("hidden");renderDevices();renderPacks();renderSelection()}const qs=new URLSearchParams(location.search);if(qs.get("cancelled"))show("selection-info",t("cancelled"),"bad");if(qs.get("session_id")){show("selection-info",t("syncing"),"good");await api("/api/anthbot/web-installer/purchase-sync/"+encodeURIComponent(qs.get("session_id")),{method:"POST",body:"{}"});catalog=(await api("/api/anthbot/web-installer/catalog")).packs||[];if(session.authenticated){renderPacks();renderSelection()}history.replaceState(null,"","/voice-installer?pack="+encodeURIComponent(qs.get("pack")||""))}}catch(err){show("login-status",t("loadFailed")+": "+err.message)}}
document.getElementById("login-form").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("login-btn");b.disabled=true;b.innerHTML='<span class="spinner"></span>'+esc(t("login"));hide("login-status");try{session=await api("/api/anthbot/web-installer/login",{method:"POST",body:JSON.stringify({username:document.getElementById("username").value.trim(),password:document.getElementById("password").value,area_code:document.getElementById("area").value.trim()})});document.getElementById("password").value="";catalog=(await api("/api/anthbot/web-installer/catalog")).packs||[];document.getElementById("login-card").classList.add("hidden");document.getElementById("install-card").classList.remove("hidden");renderDevices();renderPacks();renderSelection()}catch(err){show("login-status",t("loginFailed")+": "+err.message)}finally{b.disabled=false;b.textContent=t("login")}});
document.getElementById("pack").addEventListener("change",renderSelection);document.getElementById("device").addEventListener("change",renderSelection);
document.getElementById("logout").addEventListener("click",async()=>{try{await api("/api/anthbot/web-installer/logout",{method:"POST",body:"{}"})}catch(_){}location.reload()});
document.getElementById("primary").addEventListener("click",async()=>{const p=selectedPack();if(!p)return;const b=document.getElementById("primary");b.disabled=true;try{if(p.access==="paid"&&!p.owned){b.textContent=t("payment");const o=await api("/api/anthbot/web-installer/checkout",{method:"POST",body:JSON.stringify({pack_id:p.id})});if(o.account_required&&o.account_url){location.href=o.account_url;return}if(o.already_owned){catalog=(await api("/api/anthbot/web-installer/catalog")).packs||[];renderPacks();renderSelection();return}location.href=o.checkout_url;return}b.textContent=t("starting");const o=await api("/api/anthbot/web-installer/install",{method:"POST",body:JSON.stringify({device_id:document.getElementById("device").value,pack_id:p.id})});document.getElementById("install-card").classList.add("hidden");document.getElementById("progress-card").classList.remove("hidden");document.getElementById("progress-device").textContent=o.device_name;document.getElementById("progress-voice").textContent=o.voice_name;poll(o.job_id)}catch(err){alert(t("installFailed")+": "+err.message);b.disabled=false;renderSelection()}});
async function poll(id){clearTimeout(timer);try{const s=await api("/api/anthbot/web-installer/jobs/"+encodeURIComponent(id));lastJob=s;document.getElementById("bar").style.width=Math.max(0,Math.min(100,s.progress||0))+"%";document.getElementById("progress-text").textContent=jobMessage(s);if(s.status==="success"){document.getElementById("finish-note").classList.remove("hidden");return}if(s.status==="failed"){show("finish-note",jobMessage(s)||t("installFailed"),"bad");return}timer=setTimeout(()=>poll(id),3000)}catch(err){show("finish-note",t("installFailed")+": "+err.message,"bad")}}
document.getElementById("lang").addEventListener("change",e=>applyLang(e.target.value));applyLang(initialLang());boot();
</script>
</body></html>
